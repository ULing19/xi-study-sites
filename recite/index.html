<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习思想背诵手册 · 期末冲刺</title>
<style>
:root{color-scheme:light;--red:#c1272d;--red2:#a51d22;--gold:#d4a843;--bg:#f4f1ea;--card:#fff;--ink:#23211c;--muted:#7a756a;--line:#e3ddd0;--hl:#fff2cc;--hlb:#b8860b;--star:#d4a843;--cf:#fbf3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:16px}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:60;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header .hwrap{max-width:880px;margin:0 auto}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
header h1 .s{color:var(--gold)}
.topbar{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.modebtns{display:flex;background:rgba(255,255,255,.16);border-radius:9px;padding:3px}
.modebtns button{border:none;background:transparent;color:#fff;padding:7px 16px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.modebtns button.on{background:#fff;color:var(--red)}
.searchbox{flex:1;min-width:140px;padding:9px 13px;border:none;border-radius:9px;font-size:15px;font-family:inherit;background:rgba(255,255,255,.95)}
.layout{max-width:880px;margin:0 auto;padding:0 16px 120px;display:flex;gap:18px}
.toc{position:sticky;top:120px;align-self:flex-start;width:128px;flex:none;max-height:calc(100vh - 140px);overflow:auto;padding:6px 0;font-size:13.5px}
.toc a{display:block;padding:6px 9px;color:var(--muted);text-decoration:none;border-radius:7px;border-left:3px solid transparent;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{background:#ece5d6;color:var(--ink)}
.toc a.on{color:var(--red);border-left-color:var(--red);background:var(--cf);font-weight:600}
.content{flex:1;min-width:0}
.chap{background:var(--card);border-radius:14px;padding:18px 20px;margin-top:16px;box-shadow:0 1px 6px rgba(0,0,0,.05);border:1px solid var(--line);scroll-margin-top:130px}
.chap h2{margin:0 0 4px;font-size:18px;color:var(--red2);display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--cf);padding-bottom:10px}
.chap h2 .cn{flex:none;width:28px;height:28px;background:var(--red);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.pt{margin-top:15px;padding-left:2px}
.pt-h{font-weight:700;font-size:16px;display:flex;align-items:flex-start;gap:7px;color:var(--ink);cursor:pointer}
.pt-h .star{color:var(--star);flex:none}
.pt-h .chk{flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;margin-top:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.12s}
.pt.done .pt-h .chk{background:var(--red);border-color:var(--red);color:#fff}
.pt.done .pt-h .ttl{color:var(--muted);text-decoration:line-through}
.pt ul{margin:8px 0 0;padding-left:26px}
.pt ul li{margin-bottom:7px;line-height:1.8}
.pt ul li.sub{color:var(--muted);font-size:14.5px}
mark{background:var(--hl);color:var(--hlb);padding:0 3px;border-radius:3px;font-weight:600}
.kw{background:var(--hl);color:#8a5a00;padding:0 4px;border-radius:3px;font-weight:700}
.confuse{margin-top:16px;background:var(--cf);border:1px solid #ecdcb8;border-radius:11px;padding:12px 15px}
.confuse .ch{font-weight:700;color:var(--red2);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.confuse .ci{font-size:14.5px;margin-bottom:8px;line-height:1.75}
.confuse .ci:last-child{margin-bottom:0}
.confuse .ci b{color:var(--red2)}
.essaybox{background:var(--card);border-radius:14px;padding:18px 20px;margin-top:16px;border:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.05)}
.essaybox>h2{margin:0 0 4px;font-size:18px;color:var(--red2);border-bottom:2px solid var(--cf);padding-bottom:10px}
.eitem{border-bottom:1px dashed var(--line);padding:13px 0}
.eitem:last-child{border-bottom:none}
.eitem .eq{font-weight:700;cursor:pointer;display:flex;gap:8px;line-height:1.7}
.eitem .eq .ar{flex:none;color:var(--red);transition:.2s}
.eitem.open .eq .ar{transform:rotate(90deg)}
.eitem .ea{display:none;margin:10px 0 4px;padding-left:14px;border-left:3px solid var(--cf)}
.eitem.open .ea{display:block;animation:fd .2s}
.eitem .ea ol{margin:0;padding-left:20px}
.eitem .ea li{margin-bottom:9px;line-height:1.8}
@keyframes fd{from{opacity:0}to{opacity:1}}
.tag{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:0;transition:width .3s}
.toolbar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.toolbar2 label{display:flex;align-items:center;gap:5px;cursor:pointer}
.minibtn{padding:5px 11px;border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.intro{background:var(--card);border-radius:14px;padding:16px 20px;margin-top:16px;border:1px solid var(--line);font-size:14.5px;color:var(--muted);line-height:1.8}
.intro b{color:var(--ink)}
.starlegend{display:inline-block;color:var(--star)}
.empty{text-align:center;color:var(--muted);padding:36px}
.mobile-toc{display:none}
@media(max-width:680px){
 .toc{display:none}
 .layout{display:block;padding:0 12px 120px}
 .mobile-toc{display:block;margin-top:12px}
 .mobile-toc select{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:#fff}
 body{font-size:15.5px}
}
@media print{header,.toc,.topbar,.toolbar2,.mobile-toc{display:none}.eitem .ea{display:block!important}}
</style>
</head>
<body>
<header><div class="hwrap">
<h1><span class="s">★</span> 习思想背诵手册 · 期末冲刺</h1>
<div class="topbar">
 <div class="modebtns">
  <button id="m-full" class="on">全面版</button>
  <button id="m-quick">速记版（只看★）</button>
 </div>
 <input class="searchbox" id="search" placeholder="搜索关键词，如：首要任务、自立自强…">
</div>
</div></header>
<div class="layout">
 <nav class="toc" id="toc"></nav>
 <div class="content">
  <div class="mobile-toc"><select id="mtoc"></select></div>
  <div class="intro" id="intro">
   <b>怎么用这本手册：</b>先用「全面版」过一遍，<span class="starlegend">★</span> 是高频必考点，<span class="kw">黄色高亮</span>是必须一字不差记住的关键词。临考前切到「速记版」，只剩 ★ 考点快速扫。每个考点标题左边可以打勾标记"已背"，进度自动存在本机。底部有易混辨析和分析题答题模板。点右上角章节可跳转。
   <div class="bar"><i id="introbar"></i></div>
   <div class="toolbar2">
    <span id="progtxt">背诵进度 0%</span>
    <button class="minibtn" id="resetprog">清空背诵勾选</button>
   </div>
  </div>
  <div id="main"></div>
 </div>
</div>
<script>
const HB=[{"chap":"导论","title":"导论 · 新思想的创立与历史地位","points":[{"t":"科学回答的重大时代课题","star":true,"pts":["新时代坚持和发展什么样的【中国特色社会主义】、怎样坚持和发展中国特色社会主义；","建设什么样的【社会主义现代化强国】、怎样建设；","建设什么样的【长期执政的马克思主义政党】、怎样建设。"]},{"t":"创立的时代背景（两个局，别写反）","star":true,"pts":["国际背景：【世界百年未有之大变局】（加速演进）；","国内背景：【中华民族伟大复兴的战略全局】。","口诀：国际是'变局'，国内是'复兴全局'。"]},{"t":"两个结合","star":true,"pts":["第一个结合：马克思主义基本原理同【中国具体实际】相结合；","第二个结合：同【中华优秀传统文化】相结合。","'两个结合'是我们取得成功的【最大法宝】，是开辟和发展中国特色社会主义的【必由之路】。","'结合'不是'拼盘'、不是'物理反应'，而是深刻的【化学反应】，造就了一个有机统一的新的文化生命体。"]},{"t":"核心内容的四个概括","star":true,"pts":["【十个明确】、【十四个坚持】、【十三个方面成就】、【六个必须坚持】。","★ 十个明确 = 主体内容，是【四梁八柱】，发挥【统摄作用】。","★ 六个必须坚持 = 新思想的【世界观和方法论】：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。","十四个坚持 = 基本方略；十三个方面成就 = 全景式展示理论与实践成果。"]},{"t":"六个必须坚持（逐条定位，多选常考）","pts":["坚持人民至上 = 根本价值立场；","坚持自信自立 = 内在精神特质；","坚持守正创新 = 鲜明理论品格；","坚持问题导向 = 重要实践要求；","坚持系统观念 = 基本思想和工作方法；","坚持胸怀天下 = 中国共产党人的境界格局。"]},{"t":"历史地位","star":true,"pts":["是当代中国马克思主义、【二十一世纪马克思主义】；","是中华文化和中国精神的【时代精华】；","实现了马克思主义中国化时代化【新的飞跃】。"]},{"t":"两个确立的决定性意义","star":true,"pts":["确立习近平同志【党中央的核心、全党的核心】地位；","确立习近平新时代中国特色社会主义思想的【指导地位】。","'两个确立'是党在新时代取得的重大政治成果，是应对一切不确定性的【最大确定性、最大底气、最大保证】。","是新时代取得历史性成就、发生历史性变革的【决定性因素】。"]}],"confuse":[{"q":"国际背景 vs 国内背景","a":"国际=百年未有之大变局；国内=中华民族伟大复兴的战略全局。考试最爱写反。"},{"q":"十个明确 vs 六个必须坚持","a":"十个明确=四梁八柱、统摄作用（主体内容）；六个必须坚持=世界观和方法论。"}]},{"chap":"第一章","title":"第一章 · 新时代坚持和发展中国特色社会主义","points":[{"t":"为什么是社会主义","star":true,"pts":["究其根本在于坚持了【科学社会主义基本原则】，并坚持中国共产党的领导。","是科学社会主义理论逻辑和中国社会发展历史逻辑的【辩证统一】，写出了科学社会主义的【新版本】。"]},{"t":"四个自信及其地位","star":true,"pts":["道路自信 = 实现【途径】；","理论自信 = 行动【指南】；","制度自信 = 根本【保障】；","★ 文化自信 = 精神力量，是【更基础、更广泛、更深厚】的自信，是最基本、最深沉、最持久的力量。","坚定四个自信，说到底是要坚定【文化自信】。","坚定四个自信的理论支撑和根本依据：社会主义必然代替资本主义的【客观规律】。"]},{"t":"进入新时代的依据与内涵","pts":["重大判断的基本依据：我国【社会主要矛盾】发生新变化。","新时代是我国发展新的【历史方位】。"]},{"t":"社会主要矛盾（一变两不变）","star":true,"pts":["一变：主要矛盾已转化为【人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾】；","两不变：①我国仍处于并将长期处于【社会主义初级阶段】的基本国情没变；②世界最大【发展中国家】的国际地位没变。"]},{"t":"基本理论、路线、方略","star":true,"pts":["党的基本理论是坚持和发展中国特色社会主义的【行动指南】；","★ 党的基本路线是【国家的生命线、人民的幸福线】。"]},{"t":"五位一体与四个全面","star":true,"pts":["总体布局：【五位一体】（经济、政治、文化、社会、生态文明建设）；","战略布局：【四个全面】。","★ 四个全面中居于【引领地位】的是：全面建设社会主义现代化国家；其余三个是战略举措。"]}],"confuse":[{"q":"四个自信谁'更基础'","a":"文化自信——更基础、更广泛、更深厚。其他三个对应途径/指南/保障。"},{"q":"基本路线的比喻","a":"国家的生命线、人民的幸福线（注意：基本理论才是'行动指南'）。"}]},{"chap":"第二章","title":"第二章 · 以中国式现代化全面推进中华民族伟大复兴","points":[{"t":"中国梦","star":true,"pts":["首次提出：2012年参观《复兴之路》展览时；","★ 本质：【国家富强、民族振兴、人民幸福】。","奋斗主题：实现【中华民族伟大复兴】。"]},{"t":"两步走战略（时间节点严防篡改）","star":true,"pts":["第一步：2020年到【2035年】，基本实现社会主义现代化；","第二步：2035年到【本世纪中叶】，建成社会主义现代化强国。","注：2035年要达到中等发达国家水平、跻身创新型国家前列；建成文化、教育、人才、体育强国和健康中国，其余为'基本建成'。"]},{"t":"中国式现代化五个中国特色","star":true,"pts":["①【人口规模巨大】的现代化（显著特征）；","②【全体人民共同富裕】的现代化（本质特征，区别于西方的显著标志）；","③物质文明和精神文明【相协调】的现代化（根本要求/崇高追求）；","④人与自然【和谐共生】的现代化（鲜明特点）；","⑤走【和平发展道路】的现代化（突出特征）。"]},{"t":"中国式现代化的定性（核心大题）","star":true,"pts":["是中国共产党领导的【社会主义现代化】，这是对中国式现代化的定性，是【管总、管根本】的。","党的领导：①决定根本【性质】；②确保锚定奋斗目标【行稳致远】；③激发【强劲动力】；④凝聚【磅礴力量】。"]},{"t":"是党长期探索的重大成果（四个时期）","pts":["新民主主义革命时期 → 根本社会条件；","社会主义革命和建设时期 → 根本政治前提和制度基础；","改革开放新时期 → 充满活力的体制保证和快速发展的物质条件；","新时代 → 更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量。"]},{"t":"是强国建设、民族复兴的【唯一正确道路】","pts":["开放是中国式现代化的【鲜明标识】；","现代化的最终目标是实现【人自由而全面的发展】。"]}],"confuse":[{"q":"显著特征 vs 本质特征","a":"人口规模巨大=显著特征；共同富裕=本质特征（也是区别于西方的显著标志）。"},{"q":"2035 vs 本世纪中叶","a":"2035基本实现现代化；本世纪中叶建成现代化强国。数字最常被改。"}]},{"chap":"第三章","title":"第三章 · 坚持党的全面领导","points":[{"t":"最大国情就是党的领导","star":true,"pts":["★ 中国特色社会主义最本质的特征 = 中国特色社会主义制度的最大优势 = 【中国共产党领导】。","党的领导是【全面的、系统的、整体的】。"]},{"t":"党中央集中统一领导","star":true,"pts":["★ 是党的领导的【最高原则】。","维护党中央权威和集中统一领导，最关键是坚决维护习近平同志党中央的核心、全党的核心地位。"]},{"t":"党的领导制度","pts":["是我国的【根本领导制度】，在中国特色社会主义制度体系中具有【统领地位】。","马克思主义政党第一位的能力是【政治领导力】。"]}],"confuse":[{"q":"最高原则 vs 根本制度","a":"党中央集中统一领导=最高原则；党的领导制度=根本领导制度、统领地位。"},{"q":"'统领地位'的两个提法","a":"①党的领导制度在制度体系中统领；②军委主席负责制在军队制度体系中统领。"}]},{"chap":"第四章","title":"第四章 · 坚持以人民为中心","points":[{"t":"江山就是人民","star":true,"pts":["★ 【民心是最大的政治】，决定事业兴衰成败。","人民是历史的创造者，是决定党和国家前途命运的【根本力量】。","江山就是人民，人民就是江山；人民是党执政的最大底气和最深厚根基。"]},{"t":"人民立场","star":true,"pts":["★ 人民立场是中国共产党的【根本政治立场】，是我们党区别于其他政党的【显著标志】。","人民是党的工作的【最高裁决者和最终评判者】。","★ 让群众满意是我们党做好一切工作的【价值取向和根本标准】。"]},{"t":"政绩观与群众路线","pts":["'时代是出卷人，我们是答卷人，人民是阅卷人。'","群众路线是我们党的【生命线和根本工作路线】；'知'是基础，'行'是关键。"]},{"t":"共同富裕","star":true,"pts":["现代化的最终目标是实现【人自由而全面的发展】。","正确原则：鼓励勤劳创新致富、坚持基本经济制度、尽力而为量力而行、坚持循序渐进。","构建初次分配、再分配、第三次分配协调配套的制度安排。"]}],"confuse":[{"q":"根本政治立场 vs 显著标志","a":"都指'人民立场'——它既是根本政治立场，又是区别于其他政党的显著标志。"},{"q":"最高裁决者","a":"人民是党的工作的'最高裁决者和最终评判者'，让群众满意是价值取向和根本标准。"}]},{"chap":"第五章","title":"第五章 · 全面深化改革开放","points":[{"t":"改革开放的地位","star":true,"pts":["★ 是决定当代中国命运的【关键一招】；","是坚持和发展中国特色社会主义的【必由之路】；","★ 全面深化改革开放是新时代坚持和发展中国特色社会主义的【根本动力】。"]},{"t":"改革的特征与任务","star":true,"pts":["★ 【解放和发展社会生产力】，是改革开放的鲜明特征和【首要任务】；","【解放和增强社会活力】，是新时代全面深化改革的【关键所在】。"]},{"t":"全面深化改革总目标（必背模板）","star":true,"pts":["★ 总目标：【完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化】。","以制度建设为【主线】，以经济体制改革为【重点】，以重要领域和关键环节改革为【突破口】。","进一步全面深化改革以推进【中国式现代化】为主题。"]},{"t":"改革方法论","star":true,"pts":["★ 【摸着石头过河】，是富有中国特色、符合中国国情的改革方法；","正确处理【改革发展稳定】的关系是重要经验：改革是动力，发展是关键，稳定是前提；","把【改善人民生活】作为正确处理改革发展稳定关系的结合点。","三个进一步解放：解放思想、解放和发展社会生产力、解放和增强社会活力。"]},{"t":"对外开放","pts":["开放也是改革；'中国开放的大门只会越开越大'；","以开放促改革、促发展是宝贵经验；建设更高水平开放型经济新体制。"]}],"confuse":[{"q":"首要任务 vs 关键所在","a":"解放和发展社会生产力=首要任务；解放和增强社会活力=关键所在。"},{"q":"改革/发展/稳定","a":"改革是动力、发展是关键、稳定是前提；结合点=改善人民生活。"}]},{"chap":"第六章","title":"第六章 · 推动高质量发展","points":[{"t":"新发展理念与高质量发展","star":true,"pts":["★ 贯彻【新发展理念】是新时代我国发展壮大的必由之路（最重要、最主要的重大理论）；","★ 【高质量发展】是新时代经济社会发展的鲜明主题，是全面建设社会主义现代化国家的【首要任务】；","新发展理念：创新（第一动力，解决动力问题）、协调、绿色、开放（解决内外联动）、共享（解决公平/不平衡）。"]},{"t":"社会主义基本经济制度","star":true,"pts":["★ 在经济制度体系中具有【基础性决定性】地位；","内容：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。"]},{"t":"两个毫不动摇","star":true,"pts":["★ 国有企业是中国特色社会主义的【重要物质基础和政治基础】，是党执政兴国的重要支柱和依靠力量；推动国有资本和国有企业【做强做优做大】。","★ 民营经济是非公有制经济的【主要经济组织形式】，是【推进中国式现代化的生力军】、高质量发展的重要基础；促进民营经济【做大做优做强】。","构建高水平社会主义市场经济体制，关键是处理好【政府和市场】的关系。"]},{"t":"构建新发展格局","star":true,"pts":["以【国内大循环】为主体、国内国际双循环相互促进；","★ 最本质的特征是实现【高水平的自立自强】；","立足点：满足国内需求；着力点：放在【实体经济】上。","加快建设以实体经济为支撑的【现代化产业体系】。"]},{"t":"新质生产力","star":true,"pts":["★ 是推动高质量发展的内在要求和重要着力点；","特点是【创新】，关键在【质优】，本质是【先进生产力】；","核心标志：【全要素生产率】大幅提升；","科技创新是发展新质生产力的核心要素。"]},{"t":"乡村振兴与区域协调","pts":["★ 【农业强国】是社会主义现代化强国的根基；","乡村振兴：总目标=农业农村现代化；总方针=坚持农业农村优先发展；总要求=产业兴旺、生态宜居、乡风文明、治理有效、生活富裕；制度保障=健全城乡融合发展体制机制；","新型城镇化首要任务：推进【农业转移人口市民化】。"]}],"confuse":[{"q":"首要任务（多处）","a":"高质量发展=现代化国家首要任务；解放发展生产力=改革开放首要任务；农业转移人口市民化=新型城镇化首要任务。"},{"q":"新质生产力核心标志 vs 本质","a":"核心标志=全要素生产率大幅提升；本质=先进生产力；特点=创新。"},{"q":"国企 vs 民企","a":"国企'做强做优做大'；民企'做大做优做强'（顺序不同）。"}]},{"chap":"第七章","title":"第七章 · 教育、科技、人才战略","points":[{"t":"三者一体推进","star":true,"pts":["★ 教育、科技、人才是全面建设社会主义现代化国家的【基础性、战略性支撑】；","教育是【根本】，科技是【关键】，人才是【基础】；","科技是【第一生产力】、人才是【第一资源】、创新是【第一动力】。"]},{"t":"教育","star":true,"pts":["★ 教育是【国之大计、党之大计】；是民族振兴、社会进步的基石；","建设教育强国的根本任务/核心课题：解决【培养什么人、怎样培养人、为谁培养人】；","根本任务=【立德树人】；根本尺度=【人民满意】。"]},{"t":"科技自立自强","star":true,"pts":["★ 实现高水平科技自立自强是国家强盛和民族复兴的【战略基石】，是国家强盛之基、安全之要；","★ 【基础研究】是科技创新的源头；","自主创新=加强原始创新、集成创新、开放创新；关键核心技术是'要不来、买不来、讨不来'的。"]},{"t":"人才强国","pts":["根本保证=【党管人才】；自主创新是攀登世界科技高峰的必由之路。"]}],"confuse":[{"q":"教育/科技/人才定位","a":"教育是根本、科技是关键、人才是基础；又：第一生产力/第一资源/第一动力分别对应科技/人才/创新。"},{"q":"立德树人 vs 人民满意","a":"立德树人=根本任务；人民满意=发展教育的根本尺度。"}]},{"chap":"第八章","title":"第八章 · 发展全过程人民民主","points":[{"t":"民主制度体系","star":true,"pts":["★ 根本政治制度：【人民代表大会制度】；","基本政治制度：【多党合作和政治协商制度、民族区域自治制度、基层群众自治制度】。"]},{"t":"全过程人民民主","star":true,"pts":["★ 【人民民主是社会主义的生命】；全过程人民民主是社会主义民主政治的【本质属性】；","是【全链条、全方位、全覆盖】的民主；是【最广泛、最真实、最管用】的民主；","★ 人民代表大会制度是实现全过程人民民主的【重要制度载体】。"]},{"t":"协商民主与基层民主","star":true,"pts":["★ 协商民主是实践全过程人民民主的【重要形式】，是中国社会主义民主政治中【独特的、独有的、独到的】民主形式；","基层民主是全过程人民民主的【重要体现】。","新型政党制度：共产党领导、多党派合作，共产党执政、多党派参政。"]},{"t":"统一战线","star":true,"pts":["★ 是【凝聚人心、汇聚力量】的强大法宝；","★ 本质要求是【大团结大联合】；关键是坚持求同存异，找到【最大公约数】、画出【最大同心圆】；","党的领导是统一战线最鲜明的特征、最核心最根本的问题。"]},{"t":"民族团结","star":true,"pts":["★ 【民族团结】是我国各族人民的生命线，【中华民族共同体意识】是民族团结之本；","铸牢中华民族共同体意识：休戚与共、荣辱与共、生死与共、命运与共；","促进中华儿女大团结，是新时代爱国统一战线的历史责任。"]}],"confuse":[{"q":"根本 vs 基本政治制度","a":"根本=人民代表大会制度（仅1个）；基本=多党合作政治协商、民族区域自治、基层群众自治（3个）。"},{"q":"协商民主的'独'","a":"独特的、独有的、独到的民主形式——这是协商民主的标志性表述。"},{"q":"生命线（多处）","a":"民族团结=各族人民的生命线；群众路线=党的生命线和根本工作路线；基本路线=国家生命线、人民幸福线。"}]},{"chap":"第九章","title":"第九章 · 全面依法治国","points":[{"t":"法治道路核心要义","star":true,"pts":["★ 核心要义：坚持【党的领导】、坚持中国特色社会主义制度、贯彻中国特色社会主义法治理论；","★ 党的领导是中特法治之【魂】，是我们的法治同西方资本主义国家法治【最大的区别】；","平等是社会主义法律的【基本属性】。"]},{"t":"总抓手与首要任务","star":true,"pts":["★ 总抓手：建设【中国特色社会主义法治体系】（注意是治理的'治'，不是制度的'制'）；","★ 坚持【依宪治国、依宪执政】（首要任务=全面贯彻实施宪法）；","依法治国是党领导人民治理国家的【基本方式】。"]},{"t":"法治建设布局","star":true,"pts":["法治【国家】是目标，法治【政府】是重点任务和主体工程，法治【社会】是基础；","★ 全面推进【科学立法、严格执法、公正司法、全民守法】；","工作布局：依法治国、依法执政、依法行政共同推进；法治国家、政府、社会一体建设；统筹推进国内法治和涉外法治。"]},{"t":"全面依法治国的意义","pts":["是国家治理的一场【深刻革命】，关系党执政兴国、人民幸福安康、党和国家长治久安；","五项基本原则：坚持党的领导、以人民为中心、法律面前人人平等、依法治国和以德治国相结合、从中国实际出发。"]}],"confuse":[{"q":"法治体'系' vs 体'制'","a":"总抓手是法治'体系'（治理的治）；不要写成法治'制度'。"},{"q":"法治国家/政府/社会","a":"国家=目标；政府=重点任务和主体工程；社会=基础。"},{"q":"法治之魂","a":"党的领导=法治之魂，也是同西方法治最大的区别。"}]},{"chap":"第十章","title":"第十章 · 建设社会主义文化强国","points":[{"t":"文化自信","star":true,"pts":["★ 文化自信是【更基础、更广泛、更深厚】的自信，是最基本、最深沉、最持久的力量；","★ 推动文化繁荣兴盛，关键在于坚定【中国特色社会主义文化自信】；","三个基础：中华优秀传统文化是深厚基础，革命文化和社会主义先进文化是坚强基石，中国特色社会主义伟大实践是现实基础。"]},{"t":"中华优秀传统文化","star":true,"pts":["★ 是中华文明的智慧结晶和精华所在，是中华民族的【根和魂】，是我们在世界文化激荡中站稳脚跟的根基；","★ 创新创造是文化的【生命所在】，是文化的本质特征；","双创：【创造性转化、创新性发展】。"]},{"t":"意识形态与哲社科","star":true,"pts":["马克思主义为指导，是当代中国哲学社会科学区别于其他哲学社会科学的【根本标志】；","意识形态工作：为国家立心、为民族立魂；互联网是意识形态工作的主阵地、主战场、最前沿。","习近平文化思想：明体达用、体用贯通。"]},{"t":"中华文明五大突出特性","star":true,"pts":["★ 连续性→从根本上决定中华民族必然【走自己的路】；","★ 统一性→决定'国土不可分、国家不可乱、民族不可散、文明不可断'的共同信念；","创新性→决定守正不守旧、尊古不复古的进取精神；","包容性→决定交往交流交融的历史取向；和平性→决定中国始终是世界和平建设者。"]},{"t":"文化事业与软实力","pts":["繁荣发展文化事业和文化产业，是满足人民精神文化需求、保障文化权益的基本途径；","文化软实力取决于核心价值观的生命力、凝聚力、感召力。"]}],"confuse":[{"q":"中华文明五特性记忆","a":"连续性→走自己的路；统一性→四个不可（国土/国家/民族/文明）；创新性→进取精神；包容性→交流互鉴；和平性→世界和平。"},{"q":"文化自信三个'更'","a":"更基础、更广泛、更深厚——固定表述。"}]},{"chap":"第十一章","title":"第十一章 · 保障和改善民生","points":[{"t":"民生的地位","star":true,"pts":["★ 让人民生活幸福是'【国之大者】'；","解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的【重中之重】；","增进民生福祉是坚持立党为公、执政为民的本质要求，是社会主义生产的根本目的。"]},{"t":"收入分配与就业","star":true,"pts":["★ 【收入分配】是民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式；","★ 【分配制度】是促进共同富裕的基础性制度；","★ 【就业】是最基本的民生，是'最大的民生工程、民心工程、根基工程'；新使命=促进高质量充分就业。"]},{"t":"社会治理","star":true,"pts":["★ 加强和创新社会治理，坚持【系统治理、依法治理、综合治理、源头治理】；","基层治理是国家治理的【基石】；坚持共建共治共享的社会治理理念；","社会保障：民生保障安全网、收入分配调节器、经济运行减震器。"]}],"confuse":[{"q":"民生之源 vs 基础性制度","a":"收入分配=民生之源、最重要最直接方式；分配制度=促进共同富裕的基础性制度。"},{"q":"就业三工程","a":"最大的民生工程、民心工程、根基工程；就业是'最基本的民生'。"}]},{"chap":"第十二章","title":"第十二章 · 建设社会主义生态文明","points":[{"t":"生态文明的认识","star":true,"pts":["★ 生态环境问题归根到底是【经济发展方式和生活方式】问题；","★ 良好生态环境是【最公平的公共产品】，是【最普惠的民生福祉】；","生态文明建设是关系中华民族永续发展的【根本大计】。"]},{"t":"绿水青山就是金山银山","star":true,"pts":["★ '我们既要绿水青山，也要金山银山。宁要绿水青山，不要金山银山，而且绿水青山就是金山银山'；","二者是【辩证统一、相辅相成】的关系；","★ 把【绿色低碳发展】作为解决生态环境问题的【治本之策】。"]},{"t":"三条红线","star":true,"pts":["★ 严守【生态保护红线、环境质量底线、资源利用上线】三条红线；","三条控制线：生态保护红线、永久基本农田、城镇开发边界；","坚持山水林田湖草沙一体化保护和系统治理。"]},{"t":"全球生态贡献","pts":["积极参与全球气候治理，坚持【共同但有区别的责任】原则；打造绿色'一带一路'。"]}],"confuse":[{"q":"三条'红线' vs 三条'控制线'","a":"三条红线=生态保护红线、环境质量底线、资源利用上线；三条控制线=生态保护红线、永久基本农田、城镇开发边界。"},{"q":"治本之策","a":"绿色低碳发展=解决生态环境问题的治本之策。"}]},{"chap":"第十三章","title":"第十三章 · 维护和塑造国家安全","points":[{"t":"国家安全的地位","star":true,"pts":["★ 【国家安全是民族复兴的根基】，社会稳定是国家强盛的前提；","★ 发展解决【动力】问题，安全解决【保障】问题；","牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障。"]},{"t":"总体国家安全观（核心内涵）","star":true,"pts":["★ 以【人民安全】为宗旨，以【政治安全】为根本，以【经济安全】为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托；","★ 关键是'【总体】'；","政治安全是【根本】；人民安全居于【中心地位】；国家利益至上是要求和原则。"]},{"t":"重点领域与主战场","star":true,"pts":["★ 维护重点领域国家安全是【主阵地、主战场】；","政治安全是国家安全的根本，把维护政治安全放在【首要位置】；","维护政治安全主要内容：政权安全、制度安全、意识形态安全。"]}],"confuse":[{"q":"宗旨/根本/基础","a":"人民安全=宗旨；政治安全=根本；经济安全=基础；国际安全=依托。"},{"q":"中心地位 vs 根本","a":"人民安全居于中心地位；政治安全是根本。"}]},{"chap":"第十四章","title":"第十四章 · 巩固国防和强大人民军队","points":[{"t":"党对军队绝对领导","star":true,"pts":["★ 坚持党对人民军队的【绝对领导】，是马克思主义建党建军的基本原则，是【建军之本、强军之魂】；","★ 【政治建军】是人民军队的【立军之本】；","军委主席负责制是党对军队绝对领导的【根本制度和根本实现形式】，处于最高层次、居于统领地位。"]},{"t":"强军要求","star":true,"pts":["听党指挥是【灵魂】（决定政治方向）；能打胜仗是【核心】（根本职能）；作风优良是【保证】；","改革是决定人民军队发展壮大、制胜未来的关键一招；科技是核心战斗力；依法治军是建军治军基本方式。"]},{"t":"军队现代化目标","pts":["确保【2027年】实现建军一百年奋斗目标；2035年基本实现国防和军队现代化；本世纪中叶建成世界一流军队。"]}],"confuse":[{"q":"建军之本 vs 立军之本","a":"党对军队绝对领导=建军之本、强军之魂；政治建军=立军之本。"},{"q":"听党指挥/能打胜仗/作风优良","a":"灵魂/核心/保证——分别对应。"}]},{"chap":"第十五章","title":"第十五章 · '一国两制'与祖国统一","points":[{"t":"一国两制","star":true,"pts":["★ '一国两制'最早针对【台湾问题】提出，首先运用于解决【香港、澳门】问题；","★ 最高原则=【维护国家主权、安全、发展利益】；根本宗旨=维护国家主权安全发展利益，保持港澳长期繁荣稳定；","'一国'是'两制'的前提和基础；国家主体必须实行社会主义制度；坚持'爱国者治港''爱国者治澳'。"]},{"t":"对台总体方略（十个坚持）","star":true,"pts":["★ 坚持在中华民族伟大复兴进程中推进祖国统一→统一的【历史方位】；","★ 坚持粉碎'台独'分裂图谋→统一的【必然要求】；","★ 坚持决不承诺放弃使用武力→统一的【战略支撑】；","坚持一个中国原则和'九二共识'；坚持反对外部势力干涉。"]}],"confuse":[{"q":"历史方位/必然要求/战略支撑","a":"民族复兴进程中推进统一=历史方位；粉碎台独=必然要求；不承诺放弃武力=战略支撑。"},{"q":"最早 vs 首先运用","a":"一国两制最早针对台湾提出；首先运用于港澳。"}]},{"chap":"第十六章","title":"第十六章 · 大国外交与人类命运共同体","points":[{"t":"外交布局","star":true,"pts":["★ 中国特色大国外交主线：服务【民族复兴】、促进【人类进步】；","★ 推动构建【人类命运共同体】是新时代对外工作的总目标；","推动构建新型国际关系：相互尊重、公平正义、合作共赢。"]},{"t":"外交方针理念","star":true,"pts":["周边外交方针：【亲诚惠容】，与邻为善、以邻为伴；","全人类共同价值：【和平、发展、公平、正义、民主、自由】；","'一带一路'坚持【共商共建共享】原则。"]}],"confuse":[{"q":"总目标 vs 主线","a":"构建人类命运共同体=对外工作总目标；服务民族复兴、促进人类进步=大国外交主线。"},{"q":"全人类共同价值（6个）","a":"和平、发展、公平、正义、民主、自由——勿与社会主义核心价值观混淆。"}]},{"chap":"第十七章","title":"第十七章 · 全面从严治党","points":[{"t":"全面从严治党","star":true,"pts":["★ 是新时代党的建设的【鲜明主题】；","★ 党要管党、从严治党，是党的建设的【一贯要求和根本方针】；","核心是加强党的领导，基础在全面，关键在严，要害在治。"]},{"t":"政治建设与自我革命","star":true,"pts":["★ 党的政治建设是党的【根本性建设】，摆在【首位】；首要任务=保证全党服从中央、维护党中央权威和集中统一领导；","（注意：党内政治生活的首要任务=加强思想教育和理论武装）；","★ 勇于【自我革命】是中国共产党区别于其他政党的显著标志，是党最大的优势、最鲜明的品格；","自我革命是跳出历史周期率的【第二个答案】（第一个答案是人民监督）；","四个自我：自我净化、自我完善、自我革新、自我提高；以伟大自我革命引领伟大社会革命。"]},{"t":"组织、作风、反腐","pts":["组织路线：严密党的组织体系是【重点】，建设高素质专业化干部队伍是【关键】；","腐败是党长期执政面临的【最大威胁】；反腐败是最彻底的自我革命；标本兼治是鲜明特征。"]}],"confuse":[{"q":"两个'首要任务'","a":"党的政治建设首要任务=保证全党服从中央、维护党中央权威；党内政治生活首要任务=加强思想教育和理论武装。"},{"q":"两个答案（历史周期率）","a":"第一个答案=人民监督（让人民监督政府）；第二个答案=党的自我革命。"},{"q":"鲜明主题 vs 根本方针","a":"全面从严治党=新时代党的建设鲜明主题；党要管党从严治党=一贯要求和根本方针。"}]}];
const ESSAY={"essays":[{"id":1,"chapter":"导论","q":"中国特色社会主义进入新时代的意义","points":["党始终走在时代前列，始终成为全国人民的主心骨，始终成为坚强领导核心。","中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定，焕发出更为强烈的历史自觉和主动精神。","改革开放和社会主义现代化建设深入推进，实现中华民族伟大复兴进入了不可逆转的历史进程。","科学社会主义在21世纪的中国焕发出新的蓬勃生机，中国式现代化为人类实现现代化提供了新的选择。"]},{"id":2,"chapter":"第二章","q":"如何奋力实现中国梦？","points":["必须走中国道路，这就是中国特色社会主义道路。","必须弘扬中国精神，这就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神。","必须凝聚中国力量，这就是全国各族人民大团结的力量。"]},{"id":3,"chapter":"第二章","q":"中国式现代化是中国共产党领导人民长期探索和实践的重大成果","points":["新民主主义革命时期，取得新民主主义革命的胜利，为实现现代化创造了根本社会条件。","社会主义革命和建设时期，为现代化建设奠定了根本政治前提和制度基础。","改革开放和社会主义现代化建设新时期，为中国式现代化提供了充满新的活力的体制保证和快速发展的物质条件。","进入新时代，为中国式现代化提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量。"]},{"id":4,"chapter":"第二章","q":"为什么说中国式现代化是中国共产党领导的社会主义现代化（是对中国式现代化的定性，管总、管根本）","points":["党的领导决定中国式现代化的根本性质（是社会主义现代化）。","党的领导确保中国式现代化锚定奋斗目标行稳致远（一代一代地接力推进）。","党的领导激发建设中国式现代化的强劲动力（改革开放）。","党的领导凝聚建设中国式现代化的磅礴力量（汇集全体人民的智慧和力量）。"]},{"id":5,"chapter":"第五章","q":"坚持全面深化改革开放的正确方向","points":["必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度。","必须坚持以人民为中心，促进社会公平正义、增进人民福祉。","必须有利于进一步解放思想、进一步解放和发展生产力、进一步解放和增强社会活力。"]},{"id":6,"chapter":"第五章","q":"坚定不移扩大高水平对外开放","points":["开放也是改革。以开放促改革、促发展是我国发展不断取得新成就的宝贵经验。","新时代中国的对外开放是全方位、全领域的。高水平对外开放的决心不会变，同世界分享发展机遇的决心不会变。","中国的发展离不开世界，世界的繁荣也需要中国。"]},{"id":7,"chapter":"第六章","q":"高质量发展关系我国社会主义现代化建设全局，具有重大战略意义","points":["高质量发展为全面建设社会主义现代化国家提供更为坚实的物质基础。","高质量发展是不断满足人民对美好生活需要的重要保证。","高质量发展是维护国家长治久安的必然要求。"]},{"id":8,"chapter":"第七章","q":"科技强则国家强（为什么必须实现高水平科技自立自强）","points":["科技是国之利器。实现高水平科技自立自强是国家强盛和民族复兴的战略基石。","是应对风险挑战和维护国家利益的必然选择。科技自立自强是国家强盛之基、安全之要。","是构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求。"]},{"id":9,"chapter":"第八章","q":"怎样坚定不移走中国特色社会主义政治发展道路","points":["必须坚持党的领导、人民当家作主、依法治国有机统一。党的领导是根本保证，人民当家作主是本质特征，依法治国是基本方式，三者统一于伟大实践。最根本的是坚持党的领导。","必须积极稳妥推进政治体制改革。","必须始终保持政治定力。"]},{"id":10,"chapter":"第九章","q":"全面依法治国是国家治理的一场深刻革命","points":["法律是治国之重器，法治是国家治理体系和治理能力的重要依托。全面依法治国关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。","全面依法治国是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化的重要方面，是坚持和发展中国特色社会主义的本质要求和重要保障。"]},{"id":11,"chapter":"第十章","q":"文化繁荣兴盛是实现中华民族伟大复兴的必然要求","points":["是实现中华民族伟大复兴的精神支撑。","是建设社会主义现代化强国的应有之义（提供思想保证、舆论支持、精神动力和文化条件）。","是满足人民日益增长的美好生活需要的内在要求。","是在世界文化激荡中站稳脚跟的前提基础。"]},{"id":12,"chapter":"第十一章","q":"民生是人民幸福之基","points":["民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。","增进民生福祉是坚持立党为公、执政为民的本质要求。","增进民生福祉是社会主义生产的根本目的。","增进民生福祉是全面建设社会主义现代化国家的应有之义。必须把实现人民对美好生活的向往作为现代化建设的出发点和落脚点。"]}],"materials":[{"id":101,"chapter":"导论/第二章","q":"材料分析题1：(1)如何理解\"中国特色的关键就在于'两个结合'\"？(2)为什么说中国式现代化是中国共产党领导的社会主义现代化，\"这是对中国式现代化定性的话，是管总、管根本的\"？","points":["(1)\"两个结合\"是开辟和发展中国特色社会主义的必由之路；中国特色社会主义最鲜明的特色来源于\"两个结合\"，写出了科学社会主义\"新版本\"；中国式现代化理论是\"两个结合\"的重大成果。","(2)党的领导决定中国式现代化的根本性质；确保锚定奋斗目标行稳致远；激发强劲动力；凝聚磅礴力量。（即第4题四点）"]},{"id":102,"chapter":"第五章","q":"材料分析题2：(1)如何理解进一步全面深化改革\"既是实践续篇，也是时代新篇\"？(2)进一步全面深化改革为什么要以制度建设为主线？","points":["(1)实践续篇：改革只有进行时没有完成时，总目标\"继续\"二字一脉相承又与时俱进；时代新篇：紧紧围绕推进中国式现代化主题，为其提供动力和制度保障。","(2)制度是关系党和国家事业发展的根本性、全局性、稳定性、长期性问题；以制度建设为主线能筑牢根本制度、完善基本制度、创新重要制度，把改革成果固化为制度。"]},{"id":103,"chapter":"第六章/第七章","q":"材料分析题3：(1)如何理解\"推动新质生产力加快发展，既是发展命题，也是改革命题\"？(2)推进中国式现代化为什么\"必须加快实现高水平科技自立自强\"？","points":["(1)发展命题：新质生产力是先进生产力，特点是创新、关键在质优、本质是先进生产力；改革命题：必须形成与之相适应的新型生产关系，靠改革开放增强内生动力。","(2)科技自立自强是国家强盛之基、安全之要；是国家强盛和民族复兴的战略基石；是应对风险挑战、维护国家利益的必然选择；是构建新发展格局、推动高质量发展的内在要求。"]},{"id":104,"chapter":"第六章","q":"材料分析题4：(1)如何理解\"高水平社会主义市场经济体制是中国式现代化的重要保障\"？(2)进一步全面深化改革为什么\"要坚持改革和开放相统一\"？","points":["(1)高水平社会主义市场经济体制能更好发挥市场决定性作用和政府作用，既\"放得活\"又\"管得住\"，畅通国民经济循环，激发内生动力和创新活力；关键是处理好政府和市场的关系。","(2)开放也是改革，以开放促改革、促发展是宝贵经验；要稳步扩大制度型开放，主动对接国际高标准经贸规则，营造一流营商环境。"]},{"id":105,"chapter":"第八章","q":"材料分析题5：(1)如何理解\"全过程人民民主是新时代我国民主政治领域具有重大创新意义的标志性成果\"？(2)为什么要全面发展协商民主？","points":["(1)全过程人民民主是社会主义民主政治的本质属性；是全链条、全方位、全覆盖的民主；是最广泛、最真实、最管用的民主；实现了过程民主和成果民主、程序民主和实质民主等相统一。","(2)协商民主是实践全过程人民民主的重要形式；是我国社会主义民主政治的特有形式和独特优势；是党的群众路线在政治领域的重要体现；有事好商量、众人的事情由众人商量。"]},{"id":106,"chapter":"第六章/第十三章","q":"材料分析题6：(1)为什么要\"坚持和落实'两个毫不动摇'\"？(2)为什么要\"实现高质量发展和高水平安全良性互动\"？","points":["(1)公有制主体地位、国有经济主导作用不能动摇，国企是重要物质基础和政治基础；非公有制经济是社会主义市场经济重要组成部分、民营经济是推进中国式现代化的生力军。两者统一于社会主义现代化建设进程。","(2)发展和安全是一体之两翼、驱动之双轮；发展解决动力问题，安全解决保障问题；牢牢守住安全发展底线是构建新发展格局的重要前提和保障。"]},{"id":107,"chapter":"第五章/第十一章","q":"材料分析题7：(1)结合谷文昌事迹，说明为什么进一步全面深化改革要以促进社会公平正义、增进人民福祉为出发点和落脚点。(2)六尺巷的故事对推进社会治理现代化、加强城乡社区治理的启示。","points":["(1)人民立场是党的根本政治立场；让群众满意是做好一切工作的价值取向和根本标准；人民是党的工作的最高裁决者和最终评判者；为了人民而改革才有意义，依靠人民而改革才有动力。","(2)社会治理要坚持系统治理、依法治理、综合治理、源头治理；基层治理是国家治理的基石；坚持共建共治共享；弘扬中华优秀传统文化中以和为贵、谦让等美德，源头治理、多元共治、和谐共享。"]}]};// ===== storage (localStorage with memory fallback) =====
var store=(function(){
  try{var k='__t__';localStorage.setItem(k,'1');localStorage.removeItem(k);
    return {get:function(k,d){var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}};
  }catch(e){var m={};return {get:function(k,d){return k in m?m[k]:d},set:function(k,v){m[k]=v}};}
})();
var DONE=store.get('hb_done',{});      // ptKey -> true
var MODE=store.get('hb_mode','full');  // full | quick

function saveDone(){store.set('hb_done',DONE)}

// ===== helpers =====
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// 把【...】转成高亮关键词；先转义再替换标记
function fmt(s){
  s=esc(s);
  s=s.replace(/【([^】]+)】/g,'<span class="kw">$1</span>');
  s=s.replace(/★/g,'<span class="star">★</span>');
  return s;
}
function ptKey(ci,pi){return 'c'+ci+'p'+pi}

// 统计所有考点总数 / ★数量
var ALL_PTS=[],STAR_PTS=[];
HB.forEach(function(ch,ci){(ch.points||[]).forEach(function(p,pi){ALL_PTS.push(ptKey(ci,pi));if(p.star)STAR_PTS.push(ptKey(ci,pi))})});

// ===== render TOC =====
function buildTOC(){
  var toc=document.getElementById('toc');var mtoc=document.getElementById('mtoc');
  toc.innerHTML='';mtoc.innerHTML='';
  HB.forEach(function(ch,ci){
    var a=document.createElement('a');a.href='#chap'+ci;a.dataset.ci=ci;
    a.textContent=ch.chap;a.id='toc'+ci;
    a.onclick=function(e){e.preventDefault();var el=document.getElementById('chap'+ci);if(el)el.scrollIntoView({behavior:'smooth'})};
    toc.appendChild(a);
    var op=document.createElement('option');op.value=ci;op.textContent=ch.chap+' · '+ch.title.replace(/^.*?·\s*/,'');mtoc.appendChild(op);
  });
  // 分析题入口
  var ae=document.createElement('a');ae.href='#essaybox';ae.textContent='✍ 分析题模板';
  ae.onclick=function(e){e.preventDefault();document.getElementById('essaybox').scrollIntoView({behavior:'smooth'})};
  toc.appendChild(ae);
  mtoc.onchange=function(){var el=document.getElementById('chap'+this.value);if(el)el.scrollIntoView({behavior:'smooth'})};
}

// ===== render content =====
function render(){
  var main=document.getElementById('main');var html='';
  var quick=(MODE==='quick');
  HB.forEach(function(ch,ci){
    var pts=(ch.points||[]);
    var shown=quick?pts.filter(function(p){return p.star}):pts;
    // 速记版：没有★考点的章节也显示标题（保持结构），但若完全无内容则跳过
    html+='<div class="chap" id="chap'+ci+'" data-ci="'+ci+'">';
    html+='<h2><span class="cn">'+(ci===0?'导':ci)+'</span>'+esc(ch.title)+'</h2>';
    if(!shown.length){
      html+='<div class="tag" style="margin-top:8px">本章无★高频考点，切到全面版查看全部。</div>';
    }
    pts.forEach(function(p,pi){
      if(quick&&!p.star)return;
      var key=ptKey(ci,pi);var done=DONE[key]?' done':'';
      html+='<div class="pt'+done+'" data-key="'+key+'">';
      html+='<div class="pt-h"><span class="chk" data-key="'+key+'">✓</span>'+
            (p.star?'<span class="star">★</span>':'')+
            '<span class="ttl">'+fmt(p.t)+'</span></div>';
      html+='<ul>';
      (p.pts||[]).forEach(function(line){
        var sub=/^（|^\(|^口诀|^注[:：]/.test(line)?' class="sub"':'';
        html+='<li'+sub+'>'+fmt(line)+'</li>';
      });
      html+='</ul></div>';
    });
    // 易混辨析（两版都显示，速记版也很关键）
    if(ch.confuse&&ch.confuse.length){
      html+='<div class="confuse"><div class="ch">⚠ 易混辨析</div>';
      ch.confuse.forEach(function(c){
        html+='<div class="ci"><b>'+fmt(c.q)+'</b>：'+fmt(c.a)+'</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  main.innerHTML=html;
  wireChecks();
  updateProg();
}

function wireChecks(){
  document.querySelectorAll('.chk').forEach(function(c){
    c.onclick=function(e){
      e.stopPropagation();var key=this.dataset.key;
      if(DONE[key])delete DONE[key];else DONE[key]=1;saveDone();
      var pt=document.querySelector('.pt[data-key="'+key+'"]');
      if(pt)pt.classList.toggle('done');
      updateProg();
    };
  });
  // 点标题也能翻看（这里仅勾选用chk；标题点击留作展开备用——保持简单：点标题切换勾选）
}

function updateProg(){
  var total=ALL_PTS.length;var done=ALL_PTS.filter(function(k){return DONE[k]}).length;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('introbar').style.width=pct+'%';
  document.getElementById('progtxt').textContent='背诵进度 '+pct+'%（已勾 '+done+' / '+total+' 个考点）';
}

// ===== essays =====
function renderEssays(){
  var box=document.getElementById('main');
  var html='<div class="essaybox" id="essaybox"><h2>✍ 分析题 / 材料题 答题模板</h2>';
  html+='<div class="tag" style="margin:6px 0 4px">点击题目展开答题要点。背分析题记住"踩点给分"：把每个要点的开头关键词写全。</div>';
  (ESSAY.essays||[]).forEach(function(e,i){
    html+='<div class="eitem" data-ei="e'+i+'"><div class="eq"><span class="ar">▶</span><span>'+esc(e.chapter)+' ｜ '+esc(e.q)+'</span></div>'+
      '<div class="ea"><ol>'+(e.points||[]).map(function(p){return '<li>'+fmt(p)+'</li>'}).join('')+'</ol></div></div>';
  });
  html+='<h2 style="margin-top:22px">材料分析题</h2>';
  (ESSAY.materials||[]).forEach(function(e,i){
    html+='<div class="eitem" data-ei="m'+i+'"><div class="eq"><span class="ar">▶</span><span>'+esc(e.chapter)+' ｜ '+esc(e.q)+'</span></div>'+
      '<div class="ea"><ol>'+(e.points||[]).map(function(p){return '<li>'+fmt(p)+'</li>'}).join('')+'</ol></div></div>';
  });
  html+='</div>';
  box.insertAdjacentHTML('beforeend',html);
  document.querySelectorAll('.eitem .eq').forEach(function(q){
    q.onclick=function(){this.parentNode.classList.toggle('open')};
  });
}

// ===== mode switch =====
function setMode(m){
  MODE=m;store.set('hb_mode',m);
  document.getElementById('m-full').classList.toggle('on',m==='full');
  document.getElementById('m-quick').classList.toggle('on',m==='quick');
  render();renderEssays();applySearch();
}
document.getElementById('m-full').onclick=function(){setMode('full')};
document.getElementById('m-quick').onclick=function(){setMode('quick')};

// ===== search =====
function applySearch(){
  var kw=document.getElementById('search').value.trim();
  document.querySelectorAll('.chap').forEach(function(ch){
    if(!kw){ch.style.display='';ch.querySelectorAll('.pt').forEach(function(p){p.style.display=''});return}
    var any=false;
    ch.querySelectorAll('.pt').forEach(function(p){
      var hit=p.textContent.indexOf(kw)>=0;p.style.display=hit?'':'none';if(hit)any=true;
    });
    // 辨析命中也算
    var cf=ch.querySelector('.confuse');var cfhit=cf&&cf.textContent.indexOf(kw)>=0;
    if(cf)cf.style.display=(!kw||cfhit)?'':'none';
    ch.style.display=(any||cfhit)?'':'none';
  });
}
document.getElementById('search').oninput=applySearch;

// ===== scroll spy =====
function spy(){
  var cs=document.querySelectorAll('.chap');var top=window.scrollY+150;var cur=0;
  cs.forEach(function(c){if(c.offsetTop<=top)cur=+c.dataset.ci});
  document.querySelectorAll('.toc a[data-ci]').forEach(function(a){a.classList.toggle('on',+a.dataset.ci===cur)});
}
window.addEventListener('scroll',function(){window.requestAnimationFrame(spy)});

// ===== reset =====
document.getElementById('resetprog').onclick=function(){
  if(!confirm('清空所有"已背"勾选？'))return;
  DONE={};saveDone();render();
};

// init
buildTOC();render();renderEssays();applySearch();
document.getElementById('m-'+ (MODE==='quick'?'quick':'full')).click();
</script>
</body>
</html>

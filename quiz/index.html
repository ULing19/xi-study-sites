<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习思想刷题 · 期末冲刺</title>
<style>
:root{color-scheme:light;--red:#c1272d;--red2:#a51d22;--gold:#d4a843;--bg:#f4f1ea;--card:#fff;--ink:#23211c;--muted:#7a756a;--line:#e3ddd0;--ok:#1f7a44;--okbg:#e6f4ec;--bad:#c1272d;--badbg:#fbe9e9;--sel:#fff6e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header .hwrap{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
header h1 .star{color:var(--gold)}
.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tab{flex:1;min-width:64px;text-align:center;padding:9px 6px;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.tab.on{background:#fff;color:var(--red)}
.tab:active{transform:scale(.96)}
.panel{display:none;animation:fade .25s}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;background:var(--red);color:#fff}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn.gray{background:#eee7d9;color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink);font-family:inherit}
.muted{color:var(--muted);font-size:14px}
.big{font-size:34px;font-weight:800;color:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--sel);color:var(--red2);border:1px solid var(--gold)}
.pill.t2{background:#eef3fb;color:#2456a6;border-color:#bcd0ef}
.pill.t3{background:#eef7f0;color:#1f7a44;border-color:#bfe2cc}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .3s}
.qstem{font-size:17px;font-weight:600;margin:6px 0 16px;line-height:1.65}
.qnum{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:4px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.12s;user-select:none}
.opt:active{transform:scale(.99)}
.opt .key{flex:none;width:26px;height:26px;border-radius:50%;background:#f0ebdd;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.12s}
.opt .txt{flex:1;padding-top:2px}
.opt.sel{border-color:var(--gold);background:var(--sel)}
.opt.sel .key{background:var(--gold);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .key{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .key{background:var(--bad);color:#fff}
.opt.disabled{cursor:default}
.feedback{margin-top:8px;padding:13px 15px;border-radius:11px;font-size:15px;display:none}
.feedback.show{display:block;animation:fade .2s}
.feedback.right{background:var(--okbg);color:var(--ok);border:1px solid #bfe2cc}
.feedback.wrong{background:var(--badbg);color:var(--bad);border:1px solid #f0c9c9}
.feedback b{color:inherit}
.navbtns{display:flex;gap:10px;margin-top:16px}
.navbtns .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.flash{perspective:1600px;margin-top:14px}
.flash-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:240px}
.flash.flip .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 6px rgba(0,0,0,.05);overflow:auto}
.flash-back{transform:rotateY(180deg);background:#fffdf7}
.flash-face h3{margin:0 0 6px;font-size:18px;color:var(--red2);line-height:1.5}
.flash-face .tap{position:absolute;bottom:14px;right:18px;color:var(--muted);font-size:13px}
.flash-face ol{margin:10px 0 0;padding-left:22px}
.flash-face ol li{margin-bottom:10px}
.kpoint{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.kpoint .lbl{font-size:12px;font-weight:700;color:var(--red);background:var(--sel);padding:2px 9px;border-radius:6px;border:1px solid var(--gold)}
.kpoint p{margin:8px 0 0}
.star{color:var(--gold)}
.statline{display:flex;justify-content:space-around;text-align:center;margin-top:6px}
.statline div .n{font-size:26px;font-weight:800}
.statline .n.g{color:var(--ok)}.statline .n.r{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:6px 11px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;cursor:pointer;font-weight:600}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.searchbox{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin-top:10px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.result-big{text-align:center;padding:20px 0}
.note{font-size:13px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.tag-multi{font-size:12px;color:#2456a6;font-weight:600}
@media(max-width:560px){.qstem{font-size:16px}body{font-size:15px}}
</style>
</head>
<body>
<header><div class="hwrap">
<h1><span class="star">★</span> 习思想刷题 · 期末冲刺</h1>
<div class="tabs">
<button class="tab on" data-p="practice">刷题</button>
<button class="tab" data-p="judge">判断</button>
<button class="tab" data-p="essay">分析题</button>
<button class="tab" data-p="exam">模拟测验</button>
<button class="tab" data-p="stat">统计</button>
</div>
</div></header>
<div class="wrap">

<!-- PRACTICE -->
<section class="panel on" id="p-practice">
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <div><span class="muted">章节</span></div>
   <div class="muted" id="prac-count"></div>
  </div>
  <div class="chips" id="prac-chips"></div>
  <div class="toolbar">
   <label class="muted"><input type="checkbox" id="prac-wrongonly"> 只看做错的题</label>
   <label class="muted"><input type="checkbox" id="prac-shuffle"> 乱序</label>
   <button class="btn sm gray" id="prac-reset">重置本章进度</button>
  </div>
 </div>
 <div id="prac-area"></div>
</section>

<!-- JUDGE -->
<section class="panel" id="p-judge">
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <div><span class="muted">判断题 · 易混考点</span></div>
   <div class="muted" id="judge-count"></div>
  </div>
  <div class="chips" id="judge-chips"></div>
 </div>
 <div id="judge-area"></div>
</section>

<!-- ESSAY -->
<section class="panel" id="p-essay">
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <div><b>分析题背诵卡</b> <span class="muted">点击卡片翻面看要点</span></div>
  </div>
  <input class="searchbox" id="essay-search" placeholder="搜索题目关键词，如：中国式现代化、依法治国…">
  <div class="row" style="margin-top:10px">
   <button class="btn sm ghost" data-et="essay">简答/分析题(12)</button>
   <button class="btn sm ghost" data-et="material">材料分析题(7)</button>
   <span class="muted" id="essay-pos"></span>
  </div>
 </div>
 <div id="essay-area"></div>
 <div class="navbtns">
  <button class="btn ghost" id="essay-prev">上一张</button>
  <button class="btn" id="essay-next">下一张</button>
 </div>
</section>

<!-- EXAM -->
<section class="panel" id="p-exam">
 <div class="card" id="exam-setup">
  <h3 style="margin-top:0">模拟测验</h3>
  <p class="muted">随机抽题，答完一次性看分数和解析。</p>
  <div class="row">
   <label class="muted">单选 <select id="ex-single"><option>10</option><option selected>15</option><option>20</option><option>0</option></select></label>
   <label class="muted">多选 <select id="ex-multi"><option>5</option><option selected>10</option><option>15</option><option>0</option></select></label>
   <label class="muted">判断 <select id="ex-judge"><option>5</option><option selected>10</option><option>15</option><option>0</option></select></label>
  </div>
  <div class="navbtns"><button class="btn" id="ex-start">开始测验</button></div>
 </div>
 <div id="exam-area"></div>
</section>

<!-- STAT -->
<section class="panel" id="p-stat">
 <div class="card">
  <h3 style="margin-top:0">学习统计</h3>
  <div class="statline">
   <div><div class="n" id="st-done">0</div><div class="muted">已做</div></div>
   <div><div class="n g" id="st-right">0</div><div class="muted">答对</div></div>
   <div><div class="n r" id="st-wrong">0</div><div class="muted">答错</div></div>
   <div><div class="n" id="st-rate">0%</div><div class="muted">正确率</div></div>
  </div>
  <div class="progress"><i id="st-bar" style="width:0%"></i></div>
  <p class="muted" id="st-total"></p>
  <hr>
  <div class="row">
   <button class="btn ghost sm" id="st-gowrong">去复习错题</button>
   <button class="btn gray sm" id="st-clear">清空所有记录</button>
  </div>
 </div>
 <div class="card">
  <b>分章正确率</b>
  <div id="st-chap" style="margin-top:10px"></div>
 </div>
 <div class="note">题库：单选+多选 240 题、判断 89 题、分析题 12 题、材料题 7 题，覆盖导论至第十七章。<br>数据来源：习思想临门一脚2026新大纲、期末复习完整文档、选择题习参考与解析、第13-17章练习题。<br>进度保存在本机浏览器，换设备或清缓存会重置。</div>
</section>

</div>
<script>
const DATA={"mcq": [{"id": 1, "src": "single", "srcnum": 1, "type": "single", "stem": "“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，共同构成了习近平新时代中国特色社会主义思想的科学体系。其中，构成了这一思想体系的四梁八柱,发挥着统摄作用的是", "options": {"A": "“十个明确”", "B": "“十四个坚持”", "C": "“十三个方面成就”", "D": "“六个必须坚持”"}, "answer": "A", "chap": "导论"}, {"id": 2, "src": "single", "srcnum": 2, "type": "single", "stem": "党的二十大提出的“六个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。在这“六个必须坚持”中，必须坚持自信自立是", "options": {"A": "根本价值立场", "B": "内在精神特质", "C": "鲜明理论品格", "D": "重要实践要求"}, "answer": "B", "chap": "导论"}, {"id": 3, "src": "single", "srcnum": 3, "type": "single", "stem": "改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。其中，作为实现途径的是", "options": {"A": "中国特色社会主义道路", "B": "中国特色社会主义理论体系", "C": "中国特色社会主义制度", "D": "中国特色社会主义文化"}, "answer": "A", "chap": "第一章"}, {"id": 4, "src": "single", "srcnum": 4, "type": "single", "stem": "新时代坚持和发展中国特色社会主义，必须坚定道路自信、理论自信、制度自信、文化自信。我们坚定“四个自信”的理论支撑和根本依据是", "options": {"A": "当今世界正经历百年未有之大变局", "B": "江山就是人民，人民就是江山", "C": "实现中华民族伟大复兴进入不可逆转的历史进程", "D": "社会主义必然代替资本主义的客观规律"}, "answer": "D", "chap": "第一章"}, {"id": 5, "src": "single", "srcnum": 5, "type": "single", "stem": "坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定", "options": {"A": "政治自信", "B": "历史自信", "C": "战略自信", "D": "文化自信"}, "answer": "D", "chap": "第一章"}, {"id": 6, "src": "single", "srcnum": 6, "type": "single", "stem": "中国特色社会主义进入新时代，是长期以来特别是党的十八大以来我们党领导人民不懈奋斗的必然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。新时代是我国发展新的历史方位，标志着中国特色社会主义事业进入了新的发展阶段。中国特色社会主义进入新时代重大判断的基本依据是", "options": {"A": "我国社会主要矛盾发生新变化", "B": "党的主要任务发生新变化", "C": "中国和世界关系发生新变化", "D": "发展理念和思路发生新变化"}, "answer": "A", "chap": "第一章"}, {"id": 7, "src": "single", "srcnum": 7, "type": "single", "stem": "“四个全面”战略布局，是新的时代条件下坚持和发展中国特色社会主义、推进改革开放和社会主义现代化建设的战略抉择。“四个全面”战略布局既有战略目标又有战略举措，每个“全面”之间具有紧密的内在逻辑，是一个整体战略部署的有序展开。在“四个全面”中居于引领地位的是", "options": {"A": "全面深化改革", "B": "全面依法治国", "C": "全面从严治党", "D": "全面建设社会主义现代化国家"}, "answer": "D", "chap": "第一章"}, {"id": 8, "src": "single", "srcnum": 8, "type": "single", "stem": "实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。100多年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：实现中华民族伟大复兴。实现中华民族伟大复兴的中国梦，本质是", "options": {"A": "全面建成富强民主文明和谐美丽的社会主义现代化强国", "B": "实现高水平的自立自强", "C": "在推动共同富裕过程中促进人的全面发展", "D": "国家富强、民族振兴、人民幸福"}, "answer": "D", "chap": "第二章"}, {"id": 9, "src": "single", "srcnum": 10, "type": "single", "stem": "党的二十届三中全会对进一步全面深化改革各个方面的部署，都是从推进中国式现代化这个主题出发的。中国式现代化的鲜明标识是", "options": {"A": "城乡融合发展", "B": "法治", "C": "开放", "D": "在发展中保障和改善民生"}, "answer": "C", "chap": "第二章"}, {"id": 10, "src": "single", "srcnum": 11, "type": "single", "stem": "在长期实践过程中，党领导人民不懈探索现代化道路，取得了社会主义现代化建设的伟大成就,用几十年时间走完了发达国家几百年走过的工业化历程。我国现代化建设的出发点和落脚点是", "options": {"A": "完善和发展中国特色社会主义制度", "B": "增进民生福祉、促进社会公平", "C": "实现人民对美好生活的向往", "D": "实现高质量发展"}, "answer": "C", "chap": "第二章"}, {"id": 11, "src": "single", "srcnum": 12, "type": "single", "stem": "中国特色社会主义有很多特点和特征，其中最本质的特征是", "options": {"A": "以人民为中心", "B": "中国特色社会主义道路", "C": "中国特色社会主义制度", "D": "中国共产党领导"}, "answer": "D", "chap": "第三章"}, {"id": 12, "src": "single", "srcnum": 13, "type": "single", "stem": "加强党的全面领导为新时代党和国家事业发展提供了坚强保证。坚持和加强党的全面领导，使党的政治领导力、思想引领力、群众组织力、社会号召力显著增强。马克思主义政党第一位的能力是", "options": {"A": "思想引领力", "B": "政治领导力", "C": "社会号召力", "D": "群众组织力"}, "answer": "B", "chap": "第三章"}, {"id": 13, "src": "single", "srcnum": 14, "type": "single", "stem": "党的领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。党的领导的最高原则是", "options": {"A": "党中央集中统一领导", "B": "制度治党、依规治党", "C": "坚定理想信念", "D": "勇于自我革命"}, "answer": "A", "chap": "第三章"}, {"id": 14, "src": "single", "srcnum": 15, "type": "single", "stem": "中国特色社会主义制度是一个严密完整的科学制度体系，起四梁八柱作用的是根本制度、基本制度、重要制度。其中，具有统领地位的是", "options": {"A": "人民代表大会制度这一根本政治制度", "B": "马克思主义在意识形态领域指导地位的根本制度", "C": "社会主义基本经济制度", "D": "党的领导制度"}, "answer": "D", "chap": "第三章"}, {"id": 15, "src": "single", "srcnum": 16, "type": "single", "stem": "新时代坚持和发展中国特色社会主义的根本立场是", "options": {"A": "坚持以人民为中心", "B": "坚持以经济建设为中心", "C": "坚持四项基本原则", "D": "坚持改革开放"}, "answer": "A", "chap": "第四章"}, {"id": 16, "src": "single", "srcnum": 17, "type": "single", "stem": "习近平总书记指出：“时代是出卷人，我们是答卷人，人民是阅卷人。”我们党做好一切工作的价值取向和根本标准是", "options": {"A": "促进国民经济发展", "B": "维护国家长治久安", "C": "增强国际影响力", "D": "让群众满意"}, "answer": "D", "chap": "第四章"}, {"id": 17, "src": "single", "srcnum": 18, "type": "single", "stem": "发展是党执政兴国的第一要务。发展的出发点和落脚点是", "options": {"A": "满足人民对美好生活的新期待", "B": "不断实现理论和实践上的创新突破", "C": "完善中国特色社会主义制度", "D": "推进国家治理体系和治理能力现代化"}, "answer": "A", "chap": "第四章"}, {"id": 18, "src": "single", "srcnum": 19, "type": "single", "stem": "实现现代化是近代以来中国人民孜孜以求的宏愿。中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。现代化的最终目标是实现", "options": {"A": "中华民族伟大复兴", "B": "物质财富极大丰富", "C": "社会关系高度和谐", "D": "人自由而全面的发展"}, "answer": "D", "chap": "第四章"}, {"id": 19, "src": "single", "srcnum": 20, "type": "single", "stem": "改革开放是当代中国最显著的特征、最壮丽的气象。习近平总书记强调：“改革开放是决定当代中国命运的关键一招，也是决定实现‘两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”改革开放的鲜明特征和首要任务是", "options": {"A": "解放思想", "B": "解放和发展社会生产力", "C": "解放和增强社会活力", "D": "以创新的思维和办法解决前进中的问题"}, "answer": "B", "chap": "第五章"}, {"id": 20, "src": "single", "srcnum": 21, "type": "single", "stem": "全面深化改革开放，不是某个领域某个方面的变革，而是涉及党和国家事业发展全局的体制机制变革。全面深化改革开放的主线是", "options": {"A": "重要领域和关键环节改革", "B": "经济体制改革", "C": "制度建设", "D": "统筹改革、发展、稳定"}, "answer": "C", "chap": "第五章"}, {"id": 21, "src": "single", "srcnum": 22, "type": "single", "stem": "全面深化改革必须牢牢把握总目标，实施好“六个紧紧围绕”的路线图。统筹推进各领域各方面改革开放的突破口是", "options": {"A": "制度建设", "B": "重要领域和关键环节改革", "C": "经济体制改革", "D": "文化体制改革"}, "answer": "B", "chap": "第五章"}, {"id": 22, "src": "single", "srcnum": 23, "type": "single", "stem": "在全面深化改革开放中，我们坚持了正确方法论，这是改革取得成就的原因之一。在改革方法论中，富有中国特色、符合中国国情的改革方法是", "options": {"A": "摸着石头过河", "B": "加强顶层设计", "C": "统筹改革发展稳定", "D": "重大改革于法有据"}, "answer": "A", "chap": "第五章"}, {"id": 23, "src": "single", "srcnum": 24, "type": "single", "stem": "正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。正确处理改革、发展、稳定关系的结合点是", "options": {"A": "不断开辟发展新领域、新赛道", "B": "人的自由而全面的发展", "C": "坚持守正创新", "D": "改善人民生活"}, "answer": "D", "chap": "第五章"}, {"id": 24, "src": "single", "srcnum": 26, "type": "single", "stem": "面对纷繁复杂的国际国内形势，面对新一轮科技革命和产业变革，面对人民群众新期待，必须继续把改革推向前进。进一步全面深化改革的出发点和落脚点是", "options": {"A": "促进社会公平正义、增进人民福祉", "B": "解放和发展社会生产力", "C": "解放和增强社会活力", "D": "推动生产关系和生产力、上层建筑和经济基础、国家治理和社会发展更好相适应"}, "answer": "A", "chap": "第五章"}, {"id": 25, "src": "single", "srcnum": 27, "type": "single", "stem": "党的十八大以来，以习近平同志为核心的党中央领导全党全国各族人民开创了中国特色社会主义新时代，实现了具有里程碑意义的伟大变革。新时代我国发展壮大的必由之路是", "options": {"A": "团结奋斗", "B": "中国特色社会主义", "C": "贯彻新发展理念", "D": "全面从严治党"}, "answer": "C", "chap": "第六章"}, {"id": 26, "src": "single", "srcnum": 28, "type": "single", "stem": "党的十八大以来，我们党对经济社会发展提出了许多重大理论和战略，其中最重要、最主要的是", "options": {"A": "供给侧结构性改革", "B": "以人民为中心的发展思想", "C": "新发展理念", "D": "推动高质量发展"}, "answer": "C", "chap": "第六章"}, {"id": 27, "src": "single", "srcnum": 29, "type": "single", "stem": "发展理念是发展行动的先导，是发展思路、发展方式、发展着力点的集中体现。发展理念从根本上决定着发展成效乃至成败。新发展阶段必须坚定不移贯彻创新、协调、绿色、开放、共享的新发展理念。其中，创新是", "options": {"A": "引领发展的第一动力", "B": "国家繁荣发展的必由之路", "C": "持续健康发展的内在要求", "D": "中国特色社会主义的本质要求"}, "answer": "A", "chap": "第六章"}, {"id": 28, "src": "single", "srcnum": 30, "type": "single", "stem": "党的十八大以来，习近平总书记顺应时代和实践发展的新要求，坚持以人民为中心的发展思想,鲜明提出要坚定不移贯彻创新、协调、绿色、开放、共享的新发展理念，引领我国发展全局发生历史性变革。其中，开放发展注重的是解决", "options": {"A": "发展不平衡问题", "B": "发展动力问题", "C": "发展内外联动问题", "D": "社会公平正义问题"}, "answer": "C", "chap": "第六章"}, {"id": 29, "src": "single", "srcnum": 31, "type": "single", "stem": "高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任务。推动高质量发展的主线是", "options": {"A": "改革创新", "B": "实施扩大内需战略", "C": "深化供给侧结构性改革", "D": "加快构建新发展格局"}, "answer": "C", "chap": "第六章"}, {"id": 30, "src": "single", "srcnum": 32, "type": "single", "stem": "高质量发展是全面建设社会主义现代化国家的首要任务。推动高质量发展的战略基点是", "options": {"A": "加快实现高水平科技自立自强", "B": "加快构建新发展格局", "C": "推进农业现代化", "D": "更好统筹质的有效提升和量的合理增长"}, "answer": "B", "chap": "第六章"}, {"id": 31, "src": "single", "srcnum": 33, "type": "single", "stem": "2023年，商务部等5部门印发《关于公布中华老字号复核结果的通知》，将长期经营不善，甚至已经破产、注销、倒闭，或者丧失老字号注册商标所有权、使用权的55个品牌，移出中华老字号名录；对经营不佳、业绩下滑的73个品牌，要求6个月内予以整改；继续保留1000个经营规范、发展良好的品牌。市场预计，随着政府相关部门持续加大对中华老字号的管理力度,并采取约谈整改、移出名录等管理措施，倒逼中华老字号不断守正创新。在国货崛起的背景下，有着历史文化积淀的中华老字号有望进一步焕发活力，引领“新国潮”。这启示我们，构建高水平社会主义市场经济体制，关键是要处理好", "options": {"A": "政府和市场的关系", "B": "企业和市场的关系", "C": "中央和地方的关系", "D": "消费者和生产者的关系"}, "answer": "A", "chap": "第六章"}, {"id": 32, "src": "single", "srcnum": 34, "type": "single", "stem": "全面建成新发展格局任重道远，必须坚持问题导向和系统观念，着力破除制约加快构建新发展格局的主要矛盾和问题，不断扬优势、补短板、强弱项。要坚持把发展经济的着力点放在", "options": {"A": "制度创新上", "B": "乡村振兴上", "C": "对外开放上", "D": "实体经济上"}, "answer": "D", "chap": "第六章"}, {"id": 33, "src": "single", "srcnum": 35, "type": "single", "stem": "构建新发展格局，是根据我国发展阶段、发展环境、条件变化，特别是基于我国比较优势变化,审时度势作出的重大决策，是关系我国发展全局的重大战略任务。构建新发展格局最本质的特征是", "options": {"A": "实现高水平的自立自强", "B": "推动实施扩大内需战略同深化供给侧结构性改革有机结合", "C": "推动产业链供应链优化升级", "D": "建设现代化经济体系"}, "answer": "A", "chap": "第六章"}, {"id": 34, "src": "single", "srcnum": 37, "type": "single", "stem": "新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵。新质生产力的核心标志是", "options": {"A": "全要素生产率大幅提升", "B": "创新和质优", "C": "稳定的产业链供应链", "D": "催生新产业、新模式、新动能"}, "answer": "A", "chap": "第六章"}, {"id": 35, "src": "single", "srcnum": 38, "type": "single", "stem": "科技兴则民族兴，科技强则国家强。扎实推动科技创新和产业创新深度融合，助力发展新质生产力，是新形势下加快建设科技强国的主要任务之一。推动科技创新和产业创新深度融合的途径是", "options": {"A": "增加高质量科技供给", "B": "促进科技成果转化应用", "C": "强化企业科技创新主体地位", "D": "充分激发创新创造活力"}, "answer": "B", "chap": "第六章"}, {"id": 36, "src": "single", "srcnum": 39, "type": "single", "stem": "加快建设以实体经济为支撑的现代化产业体系，关系我们在未来发展和国际竞争中赢得战略主动。支撑我国国际竞争力的基石是", "options": {"A": "大力发展战略性新兴产业", "B": "保持优势产业的领先地位", "C": "构建优质高效的服务业新体系", "D": "构建现代化基础设施体系"}, "answer": "B", "chap": "第六章"}, {"id": 37, "src": "single", "srcnum": 40, "type": "single", "stem": "现代化产业体系是国家经济现代化的重要标志。引领国家未来产业发展的决定性力量是", "options": {"A": "战略性新兴产业", "B": "现代服务业", "C": "数字经济", "D": "现代农业"}, "answer": "A", "chap": "第六章"}, {"id": 38, "src": "single", "srcnum": 41, "type": "single", "stem": "脱贫摘帽不是终点，而是新生活、新奋斗的起点。接下来要做好乡村振兴这篇大文章，让乡亲们生活越来越美好。实施乡村振兴战略的总方针是", "options": {"A": "农业农村现代化", "B": "坚持农业农村优先发展", "C": "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕", "D": "建立健全城乡融合发展体制机制和政策体系"}, "answer": "B", "chap": "第六章"}, {"id": 39, "src": "single", "srcnum": 42, "type": "single", "stem": "促进区域协调发展，是贯彻新发展理念的重要内容，也是实现高质量发展的必然要求。新形势下促进区域协调发展，要深入实施区域协调发展战略、区域重大战略、主体功能区战略。以下属于区域协调发展战略的是", "options": {"A": "高标准、高质量建设雄安新区", "B": "推进长江经济带发展", "C": "推进粤港澳大湾区建设", "D": "鼓励东部地区加快推进现代化"}, "answer": "D", "chap": "第六章"}, {"id": 40, "src": "single", "srcnum": 43, "type": "single", "stem": "城镇化是现代化的必由之路，是解决农业、农村、农民问题的重要途径，是推动区域协调发展的有力支撑，是扩大内需和促进产业升级的重要抓手。新型城镇化的首要任务是", "options": {"A": "进一步深化户籍制度改革", "B": "推进公共服务共建共享", "C": "推进农业转移人口市民化", "D": "强化产业分工协作"}, "answer": "C", "chap": "第六章"}, {"id": 41, "src": "single", "srcnum": 45, "type": "single", "stem": "建设教育强国是全面建成社会主义现代化强国的战略先导。我们要建设的教育强国，是中国特色社会主义教育强国。建设中国特色社会主义教育强国的根本任务是", "options": {"A": "立德树人", "B": "为党育人、为国育才", "C": "服务中华民族伟大复兴", "D": "支撑引领中国式现代化"}, "answer": "A", "chap": "第七章"}, {"id": 42, "src": "single", "srcnum": 46, "type": "single", "stem": "教育是国之大计、党之大计，是功在当代、利在千秋的德政工程。发展教育的根本尺度是", "options": {"A": "立德树人", "B": "价值观塑造", "C": "人民满意", "D": "服务中华民族伟大复兴"}, "answer": "C", "chap": "第七章"}, {"id": 43, "src": "single", "srcnum": 47, "type": "single", "stem": "全面建设社会主义现代化国家，教育是根本，科技是关键，人才是基础。其中，科技是", "options": {"A": "第一生产力", "B": "第一资源", "C": "第一动力", "D": "第一路径"}, "answer": "A", "chap": "第七章"}, {"id": 44, "src": "single", "srcnum": 48, "type": "single", "stem": "科技是国之利器，国家赖之以强，企业赖之以赢，人民生活赖之以好。中国要强，中国人民生活要好，必须有强大科技。创新始终是一个国家、一个民族发展的不竭动力。科技创新的源头是", "options": {"A": "国家战略科技力量", "B": "现代工程技术、颠覆性技术创新", "C": "关键共性技术、前沿引领技术创新", "D": "基础研究"}, "answer": "D", "chap": "第七章"}, {"id": 45, "src": "single", "srcnum": 49, "type": "single", "stem": "制度优势是一个政党、一个国家的最大优势。坚定中国特色社会主义制度自信，首先要", "options": {"A": "坚定对社会主义基本经济制度的自信", "B": "坚定对中国特色社会主义政治制度的自信", "C": "坚定对中国传统文化的自信", "D": "坚定对马克思主义在意识形态领域指导地位的根本制度的自信"}, "answer": "B", "chap": "第八章"}, {"id": 46, "src": "single", "srcnum": 50, "type": "single", "stem": "中国特色社会主义政治发展道路，是近代以来中国人民长期奋斗历史逻辑、理论逻辑、实践逻辑的必然结果，是坚持党的本质属性、践行党的根本宗旨的必然要求。走中国特色社会主义政治发展道路，最根本的是", "options": {"A": "坚持人民当家作主", "B": "坚持党的领导", "C": "坚持以人民为中心", "D": "坚持独立自主"}, "answer": "B", "chap": "第八章"}, {"id": 47, "src": "single", "srcnum": 51, "type": "single", "stem": "新时代我国民主政治领域具有重大创新意义的标志性成果是", "options": {"A": "协商民主", "B": "中国特色社会主义政治发展道路", "C": "党内民主", "D": "全过程人民民主"}, "answer": "D", "chap": "第八章"}, {"id": 48, "src": "single", "srcnum": 52, "type": "single", "stem": "多民族是我国的一大特色，也是我国发展的一大有利因素。中华民族和各民族的关系，是一个大家庭和家庭成员的关系，各民族的关系是一个大家庭里不同成员的关系。民族团结之本是", "options": {"A": "民族区域自治制度", "B": "各民族共同团结奋斗、共同繁荣发展", "C": "保障少数民族当家作主，管理本民族、本地区事务的权利", "D": "中华民族共同体意识"}, "answer": "D", "chap": "第八章"}, {"id": 49, "src": "single", "srcnum": 53, "type": "single", "stem": "统一战线是中国共产党夺取革命、建设、改革事业胜利的重要法宝，也是实现中华民族伟大复兴的重要法宝。统战工作的本质要求是", "options": {"A": "大团结大联合", "B": "围绕中心、服务大局", "C": "在尊重多样性中寻求一致性", "D": "统一思想"}, "answer": "A", "chap": "第八章"}, {"id": 50, "src": "single", "srcnum": 54, "type": "single", "stem": "统一战线是凝聚人心、汇聚力量的强大法宝。统一战线最鲜明的特征（或：统一战线最核心最根本的问题）是", "options": {"A": "人民至上", "B": "求同存异", "C": "党的领导", "D": "团结奋斗"}, "answer": "C", "chap": "第八章"}, {"id": 51, "src": "single", "srcnum": 55, "type": "single", "stem": "新时代，统一战线面临的时和势、肩负的使命和任务发生了重大变化。新时代爱国统一战线的历史责任是", "options": {"A": "高举爱国主义、社会主义旗帜", "B": "促进中华儿女大团结", "C": "坚持和完善中国特色社会主义制度", "D": "巩固和维护国家安全的民心基础"}, "answer": "B", "chap": "第八章"}, {"id": 52, "src": "single", "srcnum": 56, "type": "single", "stem": "中华民族共同体的形成和发展是人心所向、大势所趋、历史必然。中华民族缔造统一的多民族国家的内生动力是", "options": {"A": "各民族血脉相融", "B": "各民族信念相同", "C": "各民族文化相通", "D": "各民族经济相依"}, "answer": "B", "chap": "第八章"}, {"id": 53, "src": "single", "srcnum": 57, "type": "single", "stem": "习近平总书记指出：“全面推进依法治国，必须走对路。如果路走错了，南辕北辙了，那再提什么要求和举措也都没有意义了。”我们党领导人民长期探索走出的中国特色社会主义法治道路,是全面依法治国的唯一正确道路。中国特色社会主义法治之魂是", "options": {"A": "依法治国和以德治国相结合", "B": "以人民为中心", "C": "党的领导", "D": "法律面前人人平等"}, "answer": "C", "chap": "第九章"}, {"id": 54, "src": "single", "srcnum": 58, "type": "single", "stem": "全面依法治国是“四个全面”战略布局的重要内容之一。推进全面依法治国，根本目的是", "options": {"A": "依法保障人民权益", "B": "努力让人民群众在每一个司法案件中感受到公平正义", "C": "提高依法执政水平", "D": "保证法律面前人人平等"}, "answer": "A", "chap": "第九章"}, {"id": 55, "src": "single", "srcnum": 59, "type": "single", "stem": "走中国特色社会主义法治道路，必须坚持法律面前人人平等。平等是", "options": {"A": "推进全面依法治国的根本目的", "B": "我们的法治同西方资本主义国家的法治最大的区别", "C": "社会主义法律的基本属性", "D": "全面依法治国的关键"}, "answer": "C", "chap": "第九章"}, {"id": 56, "src": "single", "srcnum": 60, "type": "single", "stem": "全面推进依法治国涉及很多方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手，这个总抓手就是", "options": {"A": "建设中国特色社会主义法治体系", "B": "建设社会主义法治国家", "C": "坚持依法治国、依法执政、依法行政共同推进", "D": "坚持法治国家、法治政府、法治社会一体建设"}, "answer": "A", "chap": "第九章"}, {"id": 57, "src": "single", "srcnum": 61, "type": "single", "stem": "坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。坚持依宪治国、依宪执政，作为首要任务的是", "options": {"A": "全面贯彻实施宪法", "B": "法治国家建设", "C": "法治社会建设", "D": "法治政府建设"}, "answer": "A", "chap": "第九章"}, {"id": 58, "src": "single", "srcnum": 62, "type": "single", "stem": "全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。全面依法治国的重点任务和主体工程是", "options": {"A": "法治国家建设", "B": "法治政府建设", "C": "法治社会建设", "D": "依法行政"}, "answer": "B", "chap": "第九章"}, {"id": 59, "src": "single", "srcnum": 63, "type": "single", "stem": "文化是一个国家、一个民族的灵魂。国家的富强，民族的振兴，无不伴随着文化的历史性进步。", "options": {"A": "坚定中国特色社会主义文化自信", "B": "坚持马克思主义在意识形态领域的指导地位", "C": "以社会主义核心价值观引领文化建设", "D": "缩小城乡公共文化服务差距"}, "answer": "A", "chap": "第十章"}, {"id": 60, "src": "single", "srcnum": 64, "type": "single", "stem": "哲学社会科学是人们认识世界、改造世界的重要工具，是推动历史发展和社会进步的重要力量。当代中国哲学社会科学区别于其他哲学社会科学的根本标志是", "options": {"A": "坚持以马克思主义为指导", "B": "坚持正确的政治方向", "C": "坚持党性原则", "D": "坚持以人民为中心"}, "answer": "A", "chap": "第十章"}, {"id": 61, "src": "single", "srcnum": 65, "type": "single", "stem": "新闻舆论工作是治国理政、定国安邦的大事。做好新闻舆论工作的第一位要求是", "options": {"A": "做大做强主流舆论阵地", "B": "管好用好互联网", "C": "提高新闻舆论传播力、引导力、影响力、公信力", "D": "坚持正确的政治方向"}, "answer": "D", "chap": "第十章"}, {"id": 62, "src": "single", "srcnum": 66, "type": "single", "stem": "新形势下做好新闻舆论工作的关键是", "options": {"A": "牢牢坚持马克思主义新闻观", "B": "管好用好互联网", "C": "坚持正确的舆论导向", "D": "团结人民、鼓舞士气"}, "answer": "B", "chap": "第十章"}, {"id": 63, "src": "single", "srcnum": 67, "type": "single", "stem": "中华文明具有突出的连续性，是世界上唯一绵延不断且以国家形态发展至今的伟大文明。中华文明的连续性，从根本上决定了", "options": {"A": "国家统一永远是中国核心利益的核心", "B": "国土不可分、国家不可乱、民族不可散、文明不可断的共同信念", "C": "中华民族不惧新挑战、勇于接受新事物的无畏品格", "D": "中华民族必然走自己的路"}, "answer": "D", "chap": "第十章"}, {"id": 64, "src": "single", "srcnum": 68, "type": "single", "stem": "随着我国社会主要矛盾的转化，人民对美好生活的向往越来越强烈，对精神文化生活更加看重,文化需求高品质、个性化的特点更加明显。满足人民精神文化需求、保障人民文化权益的基本途径是", "options": {"A": "繁荣发展文化事业和文化产业", "B": "推动中华优秀传统文化创造性转化、仓喷胜发展", "C": "提升国家文化软实力", "D": "保护好、传承好文化遗产"}, "answer": "A", "chap": "第十章"}, {"id": 65, "src": "single", "srcnum": 69, "type": "single", "stem": "全面建设社会主义现代化国家，是一项伟大而艰巨的事业，前途光明，任重道远。全面建设社会主义现代化国家，出发点和落脚点是", "options": {"A": "让人民生活越过越好", "B": "国家富强、民族振兴", "C": "国家长治久安、社会安定有序", "D": "解放和增强社会活力"}, "answer": "A", "chap": "第十一章"}, {"id": 66, "src": "single", "srcnum": 70, "type": "single", "stem": "改革、发展、稳定是我国社会主义现代化建设的三个重要支点。其中，发展是解决一切经济社会问题的关键。发展的根本目的是", "options": {"A": "消除绝对贫困", "B": "增进民生福祉", "C": "跳出历史周期率", "D": "促进社会稳定"}, "answer": "B", "chap": "第十一章"}, {"id": 67, "src": "single", "srcnum": 71, "type": "single", "stem": "民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。保障和改善民生的重要方针是", "options": {"A": "坚持尽力而为、量力而行", "B": "坚守底线、突出重点", "C": "完善制度、引导预期", "D": "坚持人人尽责、人人享有"}, "answer": "A", "chap": "第十一章"}, {"id": 68, "src": "single", "srcnum": 72, "type": "single", "stem": "改善民生、实现发展成果由人民共享最重要最直接的方式是", "options": {"A": "稳就业", "B": "城镇化", "C": "社会保障", "D": "收入分配"}, "answer": "D", "chap": "第十一章"}, {"id": 69, "src": "single", "srcnum": 73, "type": "single", "stem": "党的十八大以来，党中央坚持把就业工作摆在治国理政的突出位置，强化就业优先政策，健全就业促进机制，有效应对各种压力挑战，城镇新增就业年均1300万人，为民生改善和经济发展提供了重要支撑。新时代新征程就业工作的新定位、新使命是", "options": {"A": "促进高质量充分就业", "B": "拓展数字经济就业新空间，增加绿色就业新机会", "C": "推动经济社会发展与就业促进协调联动", "D": "着力解决结构性就业矛盾"}, "answer": "A", "chap": "第十一章"}, {"id": 70, "src": "single", "srcnum": 74, "type": "single", "stem": "实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题。促进共同富裕的基础性制度是", "options": {"A": "社会保障制度", "B": "分配制度", "C": "基本养老保险制度", "D": "以人民为中心的法律制度"}, "answer": "B", "chap": "第十一章"}, {"id": 71, "src": "single", "srcnum": 75, "type": "single", "stem": "经过接续奋斗，我国社会建设全面加强，人民安居乐业、社会安定有序的良好局面不断巩固发展，人民对美好生活的向往不断变为现实。新时代加强社会建设的重要着力点是", "options": {"A": "健全和完善社会保障体系", "B": "正确把握民生和发展的关系", "C": "全面推进健康中国建设", "D": "防范化解重大风险"}, "answer": "A", "chap": "第十一章"}, {"id": 72, "src": "single", "srcnum": 76, "type": "single", "stem": "生态环境变化直接影响文明的兴衰演替。生态环境问题归根到底是", "options": {"A": "政府与市场的关系问题", "B": "人与社会的关系问题", "C": "人与人的关系问题", "D": "经济发展方式和生活方式问题"}, "answer": "D", "chap": "第十二章"}, {"id": 73, "src": "single", "srcnum": 77, "type": "single", "stem": "“生态兴则文明兴，生态衰则文明衰。”生态环境是人类生存最为基础的条件，生态文明建设是关系中华民族永续发展的根本大计。解决资源环境生态问题的基础之策是", "options": {"A": "资源循环利用", "B": "促进经济社会发展全面绿色转型", "C": "产业结构优化升级", "D": "严守生态保护红线."}, "answer": "B", "chap": "第十二章"}, {"id": 74, "src": "single", "srcnum": 78, "type": "single", "stem": "全面推进中华民族伟大复兴，既无比光荣又困难重重。民族复兴的根基是", "options": {"A": "国家安全", "B": "社会稳定", "C": "民族团结", "D": "人民幸福"}, "answer": "A", "chap": "第十三章"}, {"id": 75, "src": "single", "srcnum": 79, "type": "single", "stem": "总体国家安全观是新时代国家安全工作的基本遵循。总体国家安全观的根本是", "options": {"A": "人民安全", "B": "政治安全", "C": "经济安全", "D": "军事安全"}, "answer": "B", "chap": "第十三章"}, {"id": 76, "src": "single", "srcnum": 80, "type": "single", "stem": "构建新发展格局是事关全局的系统性、深层次变革，是立足当前、着眼长远的战略谋划，是适应我国发展新阶段要求、塑造国际合作和竞争新优势的必然选择。构建新发展格局的重要前提和保障是", "options": {"A": "主动塑造于我有利的外部安全环境", "B": "夯实我国经济发展的根基", "C": "统筹维护国家安全各类要素、各个领域、各方资源、各种手段", "D": "牢牢守住安全发展这条底线"}, "answer": "D", "chap": "第十三章"}, {"id": 77, "src": "single", "srcnum": 81, "type": "single", "stem": "构建新安全格局是应对国家安全形势新变化、新趋势的战略选择。要坚定不移走中国特色国家安全道路，加快构建统筹各领域安全的新安全格局。应对各领域安全风险挑战的首要任务是", "options": {"A": "维护国土安全", "B": "维护政治安全", "C": "维护社会安全", "D": "维护粮食安全"}, "answer": "B", "chap": "第十三章"}, {"id": 78, "src": "single", "srcnum": 82, "type": "single", "stem": "总体国家安全观以人民安全为宗旨，以政治安全为根本，实现政治安全、人民安全、国家利益至上有机统一。其中，居于中心地位的是", "options": {"A": "政治安全", "B": "人民安全", "C": "国家利益至上", "D": "确保实现党的长期执政、人民安居乐业、国家长治久安"}, "answer": "B", "chap": "第十三章"}, {"id": 79, "src": "single", "srcnum": 83, "type": "single", "stem": "构建新安全格局是全面贯彻落实总体国家安全观的重大举措。构建统筹各领域安全的新安全格局的主阵地、主战场是", "options": {"A": "维护意识形态安全", "B": "维护制度安全", "C": "维护政权安全", "D": "维护重点领域国家安全"}, "answer": "D", "chap": "第十三章"}, {"id": 80, "src": "single", "srcnum": 85, "type": "single", "stem": "党的十八大以来，以习近平同志为核心的党中央深刻把握强国对强军的战略需求，围绕新时代建设一支什么样的强大人民军队、怎样建设强大人民军队，深入进行理论探索和实践创造，形成习近平强军思想并不断丰富和发展。习近平强军思想明确军民融合发展是", "options": {"A": "建军之本、强军之魂", "B": "党建军治军基本方式", "C": "我军鲜明特色和政治优势", "D": "兴国之举、强军之策"}, "answer": "D", "chap": "第十四章"}, {"id": 81, "src": "single", "srcnum": 86, "type": "single", "stem": "人民军队的鲜明特色和政治优势，也是人民军队战无不胜、攻无不克的重要保证的是", "options": {"A": "听党指挥", "B": "能打胜仗", "C": "作风优良", "D": "本领过硬"}, "answer": "C", "chap": "第十四章"}, {"id": 82, "src": "single", "srcnum": 87, "type": "single", "stem": "坚持党对人民军队绝对领导的根本制度和根本实现形式是", "options": {"A": "支部建在连上", "B": "政治委员制", "C": "军委主席负责制", "D": "首长分工负责制"}, "answer": "C", "chap": "第十四章"}, {"id": 83, "src": "single", "srcnum": 88, "type": "single", "stem": "党的十八大以来，我们深入推进政治建军理论探索和实践创造，形成了新时代政治建军方略,明确政治建军是", "options": {"A": "掌握一切领导的基础", "B": "人民军队立军之本", "C": "我军胜利法宝", "D": "我军的生命线"}, "answer": "B", "chap": "第十四章"}, {"id": 84, "src": "single", "srcnum": 89, "type": "single", "stem": "“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想。“一国两制”方针的最高原则是", "options": {"A": "维护国家主权、安全、发展利益", "B": "实现祖国和平统一", "C": "确保中华民族伟大复兴进程不被迟滞甚至中断", "D": "政权必须掌握在爱国者手中"}, "answer": "A", "chap": "第十五章"}, {"id": 85, "src": "single", "srcnum": 90, "type": "single", "stem": "新时代党解决台湾问题的总体方略内涵丰富、逻辑严密、系统完备，深刻回答了推进祖国统一的一系列重大理论和实践问题，是我们党对台大政方针的继承发展和集大成。其中，作为统一的历史方位的是", "options": {"A": "坚持在祖国大陆发展进步基础上解决台湾问题", "B": "坚持一个中国原则和“九二共识”", "C": "坚持推动两岸关系和平发展、融合发展", "D": "坚持在中华民族伟大复兴进程中推进祖国统一"}, "answer": "D", "chap": "第十五章"}, {"id": 86, "src": "single", "srcnum": 91, "type": "single", "stem": "在新时代党解决台湾问题的总体方略中，作为统一的战略支撑的是", "options": {"A": "坚持决不承诺放弃使用武力", "B": "坚持粉碎“台独”分裂图谋", "C": "坚持团结台湾同胞、争取台湾民心", "D": "坚持反对外部势力干涉"}, "answer": "A", "chap": "第十五章"}, {"id": 87, "src": "single", "srcnum": 92, "type": "single", "stem": "外交工作是党和国家工作全局的重要组成部分。中国特色大国外交牢牢把握的主线是", "options": {"A": "服务民族复兴、促进人类进步", "B": "相互尊重、合作共赢", "C": "打造全球伙伴关系、维护多边主义", "D": "维护世界和平、促进共同发展"}, "answer": "A", "chap": "第十六章"}, {"id": 88, "src": "single", "srcnum": 93, "type": "single", "stem": "周边是我国安身立命之所、发展繁荣之基。无论从地理方位、自然环境还是相互关系看，周边对我国都具有极为重要的战略意义。我国始终将周边置于外交全局的首要位置，秉持的周边外交理念是", "options": {"A": "与邻为善、以邻为伴", "B": "真实亲诚", "C": "亲诚惠容", "D": "求同存异、相互尊重、互学互鉴"}, "answer": "C", "chap": "第十六章"}, {"id": 89, "src": "single", "srcnum": 94, "type": "single", "stem": "新时代新征程，要继续全面推进我国对外工作，不断开创中国特色大国外交新局面。我国对外工作的出发点和落脚点是", "options": {"A": "坚定奉行独立自主的和平外交政策", "B": "维护国家主权、安全、发展利益", "C": "推动构建人类命运共同体", "D": "坚持走和平发展道路"}, "answer": "B", "chap": "第十六章"}, {"id": 90, "src": "single", "srcnum": 95, "type": "single", "stem": "把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会革命的重要法宝。党的建设的一贯要求和根本方针是", "options": {"A": "坚持思想建党和制度治党相统一", "B": "坚持党内监督和群众监督相统一", "C": "自我净化、自我完善、自我革新、自我提高", "D": "党要管党、从严治党"}, "answer": "D", "chap": "第十七章"}, {"id": 91, "src": "single", "srcnum": 96, "type": "single", "stem": "把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会革命的重要法宝。深入推进党的建设，作为统领的是（或：摆在首位的是）", "options": {"A": "政治建设", "B": "思想建设", "C": "作风建设", "D": "制度建设"}, "answer": "A", "chap": "第十七章"}, {"id": 92, "src": "single", "srcnum": 97, "type": "single", "stem": "党内政治生活的首要任务是", "options": {"A": "保证全党服从中央", "B": "维护党中央权威和集中统一领导", "C": "营造良好政治生态、提高政治能力", "D": "加强思想教育和理论武装"}, "answer": "D", "chap": "第十七章"}, {"id": 93, "src": "single", "srcnum": 98, "type": "single", "stem": "坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。坚持党的全面领导，要深化党的建设制度改革。深化党的建设制度改革的着力点是", "options": {"A": "调动全党抓改革、促发展的积极性、主动性、创造性", "B": "加强党的创新理论武装", "C": "完善党内法规，增强党内法规权威性和执行力", "D": "树立和践行正确政绩观，健全有效防范和纠治政绩观偏差工作机制"}, "answer": "A", "chap": "第十七章"}, {"id": 94, "src": "single", "srcnum": 99, "type": "single", "stem": "全面从严治党永远在路上，党的自我革命永远在路上。最彻底的自我革命是", "options": {"A": "党风廉政建设", "B": "让人民来监督政府", "C": "建立不忘初心、牢记使命的长效制度", "D": "反腐败"}, "answer": "D", "chap": "第十七章"}, {"id": 95, "src": "single", "srcnum": 100, "type": "single", "stem": "中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格的是", "options": {"A": "勇于自我革命", "B": "密切联系群众", "C": "独立自主", "D": "守正创新"}, "answer": "A", "chap": "第十七章"}, {"id": 96, "src": "single", "srcnum": 101, "type": "single", "stem": "习近平总书记在二十届中央纪委三次全会上发表重要讲话，系统阐述党的自我革命的重要思想，科学回答党的自我革命“为什么要”“为什么能”“怎样推进”的重大问题，特别是明确提出“九个以”的实践要求，为新时代新征程深入推进党的自我革命提供了强大思想武器和科学行动指南。党的自我革命的根本目的是", "options": {"A": "跳出历史周期率", "B": "解决大党独有难题", "C": "引领伟大社会革命", "D": "正风肃纪反腐"}, "answer": "C", "chap": "第十七章"}, {"id": 97, "src": "single", "srcnum": 102, "type": "single", "stem": "以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点。实现伟大自我革命的重要途径是", "options": {"A": "自我净化、自我完善、自我革新、自我提高", "B": "自我管理、自我服务、自我教育、自我监督", "C": "道路自信、理论自信、制度自信、文化自信", "D": "政治意识、大局意识、核心意识、看齐意识"}, "answer": "A", "chap": "第十七章"}, {"id": 98, "src": "single", "srcnum": 9, "type": "multi", "stem": "习近平总书记指出中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色。关于中国式现代化，以下内容正确的是", "options": {"A": "人口规模巨大的现代化是中国式现代化的显著特征", "B": "全体人民共同富裕的现代化是中国式现代化的本质特征", "C": "要物质富足、也要精神富有，是中国式现代化的崇高追求", "D": "促进人与自然和谐共生，是中国式现代化区别于西方现代化的显著标志"}, "answer": "ABC", "chap": "第二章"}, {"id": 99, "src": "single", "srcnum": 25, "type": "multi", "stem": "进一步全面深化改革，必须（选出正确项）", "options": {"A": "以推进中国式现代化为主题", "B": "以深化经济体制改革为重点", "C": "以文化体制改革为牵引", "D": "以制度建设为主线"}, "answer": "ABD", "chap": "第五章"}, {"id": 100, "src": "single", "srcnum": 36, "type": "multi", "stem": "新质生产力的显著特点是创新，这种创新包括", "options": {"A": "资料所有制和产品分配层面的创新", "B": "技术和业态模式层面的创新", "C": "管理和制度层面的创新", "D": "价值观和意识形态层面的创新"}, "answer": "BC", "chap": "第六章"}, {"id": 101, "src": "single", "srcnum": 44, "type": "multi", "stem": "建成教育强国是实现以中国式现代化全面推进强国建设、民族复兴伟业的（选出正确项）", "options": {"A": "先导任务", "B": "坚实基础", "C": "战略支撑", "D": "鲜明标识"}, "answer": "ABC", "chap": "第七章"}, {"id": 102, "src": "single", "srcnum": 84, "type": "multi", "stem": "保障国家安全的治本之策在于（选出正确项）", "options": {"A": "提高防范化解重大风险能力", "B": "健全国家安全体系", "C": "建设更高水平的平安中国", "D": "加强国家安全制度建设"}, "answer": "BD", "chap": "第十三章"}, {"id": 103, "src": "multi", "srcnum": 1, "type": "multi", "stem": "时代是思想之母，实践是理论之源。当代中国正经历着我国历史上最为广泛而深刻的社会变革,也正在进行着人类历史上最为宏大而独特的实践创新。这是一个需要思想理论的时代，是一个产生思想理论的时代，也是一个在伟大变革中不断推动思想理论向前发展的时代。习近平新时代中国特色社会主义思想正是在这个时代中创立并不断丰富发展的。习近平新时代中国特色社会主义思想创立的时代背景是", "options": {"A": "世界百年未有之大变局加速演进", "B": "中华民族伟大复兴进入关键时期，中国式现代化全面推进拓展", "C": "科学社会主义在21世纪的中国焕发新的蓬勃生机", "D": "中国共产党自我革命开辟新的境界"}, "answer": "ABCD", "chap": "导论"}, {"id": 104, "src": "multi", "srcnum": 2, "type": "multi", "stem": "习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”", "options": {"A": "是我们党在探索中国特色社会主义道路中得出的规律性认识", "B": "让中国特色社会主义道路有了更加宏阔深远的历史纵深", "C": "拓展了中国特色社会主义道路的文化根基", "D": "开辟了广阔的理论和实践创新空间"}, "answer": "ABCD", "chap": "导论"}, {"id": 105, "src": "multi", "srcnum": 3, "type": "multi", "stem": "习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”是", "options": {"A": "开辟和发展中国特色社会主义的必由之路", "B": "推进马克思主义中国化时代化的根本途径", "C": "我们取得成功的最大法宝", "D": "我们党坚定信仰信念、把握历史主动的根本所在"}, "answer": "ABC", "chap": "导论"}, {"id": 106, "src": "multi", "srcnum": 4, "type": "multi", "stem": "历史正反两方面的经验表明，“两个结合”是我们取得成功的最大法宝。“结合”不是“拼盘”，不是简单的“物理反应”，而是深刻的“化学反应”。“结合”的结果是", "options": {"A": "造就了一个有机统一的新的文化生命体", "B": "让马克思主义成为中国的", "C": "让中华优秀传统文化成为现代的", "D": "让经由“结合”而形成的新文化成为中国式现代化的文化形态"}, "answer": "ABCD", "chap": "导论"}, {"id": 107, "src": "multi", "srcnum": 5, "type": "multi", "stem": "习近平总书记总结党百年来的理论创新经验，在强调坚持“第一个结合”的基础上，明确提出把马克思主义基本原理同中华优秀传统文化相结合的重大命题，这是又一次的思想解放。“两个结合”", "options": {"A": "是对坚持和发展马克思主义作出的重大理论贡献", "B": "表明我们党对中国道路、理论、制度的认识达到了新高度", "C": "表明我们党的历史自信、文化自信达到了新高度", "D": "表明我们党在传承中华优秀传统文化中推进理论创新的自觉性达到了新高度"}, "answer": "ABCD", "chap": "导论"}, {"id": 108, "src": "multi", "srcnum": 6, "type": "multi", "stem": "习近平新时代中国特色社会主义思想坚持科学社会主义基本原则，深刻总结和充分运用党百年奋斗的历史经验，根据时代和实践发展变化，科学回答了重大时代课题，以全新的视野深化了对共产党执政规律、社会主义建设规律、人类社会发展规律的认识。习近平新时代中国特色社会主义思想科学回答的重大时代课题是", "options": {"A": "新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义", "B": "建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国", "C": "建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党", "D": "实现什么样的发展、怎样发展"}, "answer": "ABC", "chap": "导论"}, {"id": 109, "src": "multi", "srcnum": 7, "type": "multi", "stem": "中国共产党的历史就是一部不断推进理论创新、进行理论创造的历史。不断谱写马克思主义中国化时代化新篇章，是当代中国共产党人的庄严历史责任。继续推进实践基础上的理论创新，首先要把握好习近平新时代中国特色社会主义思想的世界观和方法论，坚持好、运用好贯穿其中的立场观点方法，必须", "options": {"A": "坚持人民至上，坚持自信自立", "B": "坚持守正创新，坚持问题导向", "C": "坚持系统观念，坚持胸怀天下", "D": "坚持党的领导，坚持实事求是"}, "answer": "ABC", "chap": "导论"}, {"id": 110, "src": "multi", "srcnum": 8, "type": "multi", "stem": "以习近平同志为主要代表的中国共产党人，坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，深刻总结并充分运用党成立以来的历史经验，从新的实际出发，创立了习近平新时代中国特色社会主义思想。习近平新时代中国特色社会主义思想", "options": {"A": "是当代中国马克思主义、21世纪马克思主义", "B": "是中华文化和中国精神的时代精华", "C": "实现了马克思主义中国化时代化新的飞跃", "D": "是新时代党和国家事业发展的根本遵循"}, "answer": "ABCD", "chap": "导论"}, {"id": 111, "src": "multi", "srcnum": 9, "type": "multi", "stem": "习近平新时代中国特色社会主义思想，把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合", "options": {"A": "使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就", "B": "用中华文明充实马克思主义的文化生命", "C": "用马克思主义进一步激活中华文明的基因", "D": "是中华民族的文化主体性最有力的体现"}, "answer": "ABCD", "chap": "导论"}, {"id": 112, "src": "multi", "srcnum": 10, "type": "multi", "stem": "党的十八届六中全会明确了习近平同志党中央的核心、全党的核心地位，党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想。“两个确立”对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。“两个确立”", "options": {"A": "是党在新时代取得的重大政治成果", "B": "反映了全党全军全国各族人民共同心愿", "C": "是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素", "D": "是党和人民应对一切不确定性的最大确定性、最大底气、最大保证"}, "answer": "ABCD", "chap": "导论"}, {"id": 113, "src": "multi", "srcnum": 11, "type": "multi", "stem": "道路问题是关系党的事业兴衰成败第一位的问题。一个国家实行什么样的主义，关键要看这个主义能否解决这个国家面临的历史性课题。中国特色社会主义", "options": {"A": "是历史的结论、人民的选择", "B": "具有深厚的历史渊源和广泛的现实基础", "C": "是科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一", "D": "是实现中华民族伟大复兴的正确道路"}, "answer": "ABCD", "chap": "导论"}, {"id": 114, "src": "multi", "srcnum": 12, "type": "multi", "stem": "改革开放以来，我们取得一切成绩和进步的根本原因，归结起来就是", "options": {"A": "开辟了中国特色社会主义道路", "B": "形成了中国特色社会主义理论体系", "C": "确立了中国特色社会主义制度", "D": "发展了中国特色社会主义文化"}, "answer": "ABCD", "chap": "导论"}, {"id": 115, "src": "multi", "srcnum": 13, "type": "multi", "stem": "26亿人，社会保障网越织越密。社会保障", "options": {"A": "是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障", "B": "是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排", "C": "是民族复兴的根基、国家强盛的前提", "D": "发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用"}, "answer": "ABD", "chap": "第十一章"}, {"id": 116, "src": "multi", "srcnum": 14, "type": "multi", "stem": "“70后、80后、90后、00后，他们走出去看世界之前，中国已经可以平视这个世界了。”2021年全国两会期间，习近平总书记的一席话，令人感慨万千。坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信，中国共产党和中国人民有着深厚的根基和底气，根基和底气在于我们有", "options": {"A": "中国共产党的坚强领导", "B": "更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量", "C": "连绵不绝的中华5000多年文明", "D": "广大的国土和世界第一人国的独特优势"}, "answer": "ABC", "chap": "导论"}, {"id": 117, "src": "multi", "srcnum": 15, "type": "multi", "stem": "坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信。文化自信是", "options": {"A": "更基础、更广泛、更深厚的自信", "B": "改革开放以来我们取得一切成绩和进步的根本原因", "C": "我们坚定“四个自信”的理论支撑和根本依据", "D": "一个国家、一个民族发展中最基本、最深沉、最持久的力量"}, "answer": "AD", "chap": "导论"}, {"id": 118, "src": "multi", "srcnum": 16, "type": "multi", "stem": "经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。中国特色社会主义进入了新时代有着充分的依据，它是", "options": {"A": "我国社会主要矛盾发生新变化的反映", "B": "党的主要任务发生新变化的反映", "C": "中国和世界关系发生新变化的反映", "D": "我国进入新发展阶段的反映"}, "answer": "ABC", "chap": "导论"}, {"id": 119, "src": "multi", "srcnum": 17, "type": "multi", "stem": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。新时代我国社会主要矛盾的变化", "options": {"A": "是在社会主义初级阶段中发生的变化", "B": "是关系全局的历史性变化", "C": "没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情", "D": "正确反映了我国全面建成小康社会之后的新特点"}, "answer": "ABC", "chap": "导论"}, {"id": 120, "src": "multi", "srcnum": 18, "type": "multi", "stem": "新时代的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有的里程碑意义主要有", "options": {"A": "中国共产党在革命性锻造中更加坚强有力", "B": "中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定", "C": "实现中华民族伟大复兴进入不可逆转的历史进程", "D": "科学社会主义在21世纪的中国焕发出新的蓬勃生机"}, "answer": "ABCD", "chap": "导论"}, {"id": 121, "src": "multi", "srcnum": 19, "type": "multi", "stem": "中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。在新中国成立特别是改革开放以来长期探索和实践基础上，经过党的十八大以来在理论和实践上的创新突破，我们成功推进和拓展了中国式现代化。中国式现代化", "options": {"A": "既基于自身国情、又借鉴各国经验", "B": "既传承历史文化、又融合现代文明", "C": "是具有中国特色、符合中国实际的现代化", "D": "是强国建设、民族复兴的唯一正确道路"}, "answer": "ABCD", "chap": "第一章"}, {"id": 122, "src": "multi", "srcnum": 20, "type": "multi", "stem": "中国式现代化是中国共产党领导的社会主义现代化。中国共产党领导的社会主义现代化，是对中国式现代化的定性，是管总、管根本的。党的领导直接关系中国式现代化的根本方向、前途命运、最终成败。党的领导", "options": {"A": "决定中国式现代化的根本性质", "B": "确保中国式现代化锚定奋斗目标行稳致远", "C": "激发建设中国式现代化的强劲动力", "D": "凝聚建设中国式现代化的磅礴力量"}, "answer": "ABCD", "chap": "第一章"}, {"id": 123, "src": "multi", "srcnum": 21, "type": "multi", "stem": "中国式现代化是中国共产党领导人民长期探索和实践的重大成果。中国式现代化", "options": {"A": "深深植根于中华优秀传统文化", "B": "体现科学社会主义的先进本质", "C": "借鉴吸收一切人类优秀文明成果", "D": "代表人类文明进步的发展方向"}, "answer": "ABCD", "chap": "第一章"}, {"id": 124, "src": "multi", "srcnum": 22, "type": "multi", "stem": "习近平总书记指出：“中国式现代化，是我们为如何唤醒‘睡狮‘、实现民族复兴这个重大历史课题所给出的答案，是选择自己的道路、做自己的事情。”中国式现代化创造了人类文明新形态，是一种全新的人类文明形态。中国式现代化", "options": {"A": "打破了“现代化二西方化”的迷思，展现了不同于西方现代化模式的新图景", "B": "是对西方式现代化理论和实践的重大超越", "C": "为广大发展中国家提供了全新选择", "D": "是当代中国共产党人回答和解决关乎人类前途命运的时代之问的中国方案"}, "answer": "ABC", "chap": "第一章"}, {"id": 125, "src": "multi", "srcnum": 23, "type": "multi", "stem": "中国特色社会主义之所以是社会主义，究其根本就在于", "options": {"A": "坚持科学社会主义基本原则", "B": "坚持中国共产党的领导", "C": "坚持以人民为中心", "D": "坚持深化改革开放"}, "answer": "AB", "chap": "第二章"}, {"id": 126, "src": "multi", "srcnum": 24, "type": "multi", "stem": "中国最大的国情就是中国共产党的领导。中国共产党领导", "options": {"A": "是中国人民和中华民族能够扭转近代以后的历史命运、取得今天伟大成就的最根本原因", "B": "是人民当家作主的可靠保障", "C": "关系中国特色社会主义的性质、方向和命运", "D": "是实现中华民族伟大复兴的根本保证"}, "answer": "ABCD", "chap": "第二章"}, {"id": 127, "src": "multi", "srcnum": 25, "type": "multi", "stem": "中国共产党领导是中国特色社会主义制度的最大优势，这是因为", "options": {"A": "党的自身优势是中国特色社会主义制度优势的主要来源", "B": "党能够集中全党全国力量、凝聚全民族共同意志，确保中国特色社会主义制度的显著优势充分彰显", "C": "党的领导是全面的、系统的、整体的，事无巨细都去管", "D": "党在实践中不断推进马克思主义中国化时代化，为坚持和完善中国特色社会主义制度提供强大理论优势"}, "answer": "ABD", "chap": "第二章"}, {"id": 128, "src": "multi", "srcnum": 26, "type": "multi", "stem": "党的领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。中国共产党是最高政治领导力量，这是", "options": {"A": "在历史发展中形成的", "B": "由我国国家性质决定的", "C": "由我国的政治制度体系决定的", "D": "由中华民族伟大复兴事业决定的"}, "answer": "ABCD", "chap": "第二章"}, {"id": 129, "src": "multi", "srcnum": 27, "type": "multi", "stem": "坚持党的全面领导，必须依靠制度来保障。党的领导制度是", "options": {"A": "我国的根本政治制度", "B": "党的领导核心地位的必然反映和内在要求", "C": "中国特色社会主义制度体系的核心", "D": "国家治理体系和治理能力现代化的关键"}, "answer": "BCD", "chap": "第二章"}, {"id": 130, "src": "multi", "srcnum": 28, "type": "multi", "stem": "人民是我们党的生命之根、执政之基、力量之源，人民性是马克思主义的本质属性和鲜明品格。人民对美好生活的向往就是党的奋斗目标，要坚持以人民为中心。以下说法正确的有", "options": {"A": "人民立场是中国共产党的根本政治立场", "B": "人民立场是我们党区别于其他政党的显著标志", "C": "人民是中国共产党执政的最大底气、最深厚的根基", "D": "坚持人民至上是新时代党治国理政的根本价值取向"}, "answer": "ABCD", "chap": "第四章"}, {"id": 131, "src": "multi", "srcnum": 29, "type": "multi", "stem": "2024年10月，习近平总书记在福建东山县考察期间，专门参观了谷文昌纪念馆，了解谷文昌同志感人事迹。习近平指出：“‘先祭谷公，后拜祖宗\"这是老百姓发自内心的敬仰。人民心里有一本账，金杯银杯不如老百姓的口碑。”“‘为官一任，造福一方‘，只有走这条路，才是人间正道。”必须牢固树立和践行为民造福的政绩观，这是因为", "options": {"A": "让群众满意是我们党做好一切工作的价值取向和根本标准", "B": "人民是党的工作的最高裁决者和最终评判者", "C": "中国共产党把为民办事、为民造福作为最重要的政绩", "D": "全心全意为人民服务是党的根本宗旨"}, "answer": "ABCD", "chap": "第四章"}, {"id": 132, "src": "multi", "srcnum": 30, "type": "multi", "stem": "我们正在向第二个百年奋斗目标迈进。适应我国社会主要矛盾的变化，更好满足人民日益增长的美好生活需要，必须推动全体人民共同富裕取得更为明显的实质性进展。实现共同富裕", "options": {"A": "不仅是经济问题，而且是关系党的执政基础的重大政治问题", "B": "首先要通过全国人民共同奋斗把“蛋糕”做大做好，然后通过合理的制度安排把“蛋糕”切好分好", "C": "是一个长期的历史过程", "D": "必须等实现了现代化再来解决"}, "answer": "ABC", "chap": "第四章"}, {"id": 133, "src": "multi", "srcnum": 31, "type": "multi", "stem": "共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。要从全局角度来把握共同富裕。共同富裕是", "options": {"A": "全体人民共同富裕", "B": "人民群众物质生活和精神生活都富裕", "C": "所有人都同时富裕", "D": "所有地区同时达到一个富裕水准"}, "answer": "AB", "chap": "第四章"}, {"id": 134, "src": "multi", "srcnum": 32, "type": "multi", "stem": "坚持以人民为中心的发展思想，真正做到发展成果由人民共享，就必须落实到扎实推进全体人民共同富裕上，在推动共同富裕过程中促进人的全面发展。扎实推进共同富裕必须坚持的原则是", "options": {"A": "鼓励勤劳创新致富", "B": "坚持基本经济制度", "C": "尽力而为、量力而行", "D": "坚持循序渐进"}, "answer": "ABCD", "chap": "第四章"}, {"id": 135, "src": "multi", "srcnum": 33, "type": "multi", "stem": "改革开放是党和人民大踏步赶上时代的重要法宝，是当代中国最显著的特征、最壮丽的气象。改革升放是", "options": {"A": "我们党的一次伟大觉醒", "B": "坚持和发展中国特色社会主义的必由之路", "C": "决定当代中国命运的关键一步", "D": "决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招"}, "answer": "ABD", "chap": "第五章"}, {"id": 136, "src": "multi", "srcnum": 34, "type": "multi", "stem": "党的十一届三中全会是划时代的，党的十八届三中全会也是划时代的。党的十八届三中全会", "options": {"A": "开启了改革开放和社会主义现代化建设新时期", "B": "对全面深化改革进行总体擘画，确定了全面深化改革的总目标和时间表、路线图", "C": "实现改革由局部探索、破冰突围到系统集成、全面深化的转变", "D": "实现了改革理论和政策的一系列新的重大突破"}, "answer": "BCD", "chap": "第五章"}, {"id": 137, "src": "multi", "srcnum": 35, "type": "multi", "stem": "全面深化改革开放改什么、怎么改，这是一个带有根本性的问题。习近平总书记强调：“我们的改革开放是有方向、有立场、有原则的。”坚持全面深化改革开放的正确方向，必须", "options": {"A": "坚持和改善党的全面领导", "B": "坚持和完善中国特色社会主义制度", "C": "坚持以人民为中心，促进社会公平正义、增进人民福祉", "D": "有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力"}, "answer": "ABCD", "chap": "第五章"}, {"id": 138, "src": "multi", "srcnum": 36, "type": "multi", "stem": "党的十八届三中全会通过的《中共中央关于全面深化改革若干重大问题的决定》，提出全面深化改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。国家治理体系和国家治理能力的关系是", "options": {"A": "国家治理体系和国家治理能力是等同的", "B": "国家治理体系越完备国家治理能力就一定越强", "C": "通过好的国家治理体系能够提高国家治理能力", "D": "通过提高国家治理能力能够充分发挥国家治理体系的效能"}, "answer": "CD", "chap": "第五章"}, {"id": 139, "src": "multi", "srcnum": 37, "type": "multi", "stem": "正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。全面深化改革开放要统筹改革、发展、稳定，下列选项内容正确的有", "options": {"A": "改革是经济社会发展的强大动力", "B": "发展是解决一切经济社会问题的关键", "C": "稳定是改革发展的前提", "D": "改善人民生活是正确处理改革、发展、稳定关系的结合点"}, "answer": "ABCD", "chap": "第五章"}, {"id": 140, "src": "multi", "srcnum": 38, "type": "multi", "stem": "进一步全面深化改革的总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。到2035年的目标是", "options": {"A": "全面建成高水平社会主义市场经济体制", "B": "中国特色社会主义制度更加完善", "C": "基本实现国家治理体系和治理能力现代化", "D": "基本实现社会主义现代化"}, "answer": "ABCD", "chap": "第五章"}, {"id": 141, "src": "multi", "srcnum": 39, "type": "multi", "stem": "进一步全面深化改革的总目标是继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。这一总目标", "options": {"A": "同党的十八届三中全会确定的全面深化改革总目标一脉相承", "B": "同党的二十大作出的战略部署相衔接", "C": "揭示了进一步全面深化改革的出发点和落脚点", "D": "为进一步全面深化改革明确了目标导向"}, "answer": "ABD", "chap": "第五章"}, {"id": 142, "src": "multi", "srcnum": 40, "type": "multi", "stem": "党的十八大以来，我们党及时总结新鲜经验，不断深化对改革的规律性认识，形成了习近平总书记关于全面深化改革的一系列新思想、新观点、新论断，为进一步全面深化改革提供了根本遵循。关于进一步全面深化改革，以下说法正确的有", "options": {"A": "要始终朝着总目标指引的方向前进，该改的坚决改，不该改的不改", "B": "要全面协调推进各方面改革，确保同时满足所有人的利益诉求", "C": "要做到重大改革于法有据，平等保护全体公民和法人的合法权益", "D": "要稳步扩大制度型开放，主动对接国际高标准经贸规则"}, "answer": "ACD", "chap": "第五章"}, {"id": 143, "src": "multi", "srcnum": 41, "type": "multi", "stem": "党的十九届五中全会提出，全面建成小康社会、实现第一个百年奋斗目标之后，我们要乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进入了一个新发展阶段。新发展阶段是", "options": {"A": "我国社会主义初级阶段历史进程中的一个重要阶段", "B": "全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段", "C": "我们党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段", "D": "所有国家实现社会主义现代化必须经历的阶段"}, "answer": "ABC", "chap": "第六章"}, {"id": 144, "src": "multi", "srcnum": 42, "type": "multi", "stem": "创新、协调、绿色、开放、共享的新发展理念相互贯通、相互促进，是具有内在联系的集合体。以下说法正确的有", "options": {"A": "创新发展注重的是解决发展动力问题", "B": "绿色发展注重的是解决人与自然和谐共生问题", "C": "开放发展注重的是解决发展内外联动问题", "D": "共享发展注重的是解决发展不平衡问题"}, "answer": "ABC", "chap": "第六章"}, {"id": 145, "src": "multi", "srcnum": 43, "type": "multi", "stem": "高质量发展是全面建设社会主义现代化国家的首要任务。高质量发展，就是", "options": {"A": "能够很好满足人民日益增长的美好生活需要的发展", "B": "体现新发展理念的发展", "C": "创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、共享成为根本目的的发展", "D": "从“有没有”转向“好不好”的发展"}, "answer": "ABCD", "chap": "第六章"}, {"id": 146, "src": "multi", "srcnum": 44, "type": "multi", "stem": "高质量发展关系我国社会主义现代化建设全局，具有重大战略意义。高质量发展", "options": {"A": "为全面建设社会主义现代化国家提供更为坚实的物质基础", "B": "是不断满足人民对美好生活需要的重要保证", "C": "是维护国家长治久安的必然要求", "D": "是民族复兴的根基、国家强盛的前提’"}, "answer": "ABC", "chap": "第六章"}, {"id": 147, "src": "multi", "srcnum": 45, "type": "multi", "stem": "新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征，符合新发展理念的先进生产力质态。催生新质生产力的是", "options": {"A": "技术革命性突破", "B": "上层建筑的大幅跃升", "C": "产业深度转型升级", "D": "生产要素创新性配置"}, "answer": "ACD", "chap": "第六章"}, {"id": 148, "src": "multi", "srcnum": 46, "type": "multi", "stem": "习近平总书记提出，发展新质生产力是推动高质量发展的内在要求和重要着力点。关于新质生产力，以下理解正确的有", "options": {"A": "战略性新兴产业、未来产业是发展新质生产力的主阵地", "B": "传统产业通过转型升级，也能成为新质生产力的重要部分", "C": "科技创新是发展新质生产力的核心要素", "D": "发展新质生产力以劳动者、劳动资料、劳动对象及其优化组合的跃升为核心标志"}, "answer": "ABC", "chap": "第六章"}, {"id": 149, "src": "multi", "srcnum": 47, "type": "multi", "stem": "坚持和完善社会主义基本经济制度是实现高质量发展的保障。社会主义基本经济制度", "options": {"A": "是我国生产关系在制度上的体现", "B": "在经济制度体系中具有基础性决定性地位", "C": "是中国特色社会主义制度的重要支柱", "D": "是解放和发展社会生产力、改善人民生活、维护社会公平正义、推进共同富裕的制度基础"}, "answer": "ABCD", "chap": "第六章"}, {"id": 150, "src": "multi", "srcnum": 48, "type": "multi", "stem": "公有制经济是全体人民的宝贵财富，公有制主体地位不能动摇，国有经济主导作用不能动摇,这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制度的重要保证。国有企业是", "options": {"A": "中国特色社会主义的重要物质基础", "B": "中国特色社会主义的政治基础", "C": "我们党执政兴国的重要支柱", "D": "我们党执政兴国的依靠力量"}, "answer": "ABCD", "chap": "第六章"}, {"id": 151, "src": "multi", "srcnum": 49, "type": "multi", "stem": "我国非公有制经济是改革开放以来在中国共产党的方针政策指引下发展起来的，我们要毫不动摇鼓励、支持、引导非公有制经济发展。非公有制经济是", "options": {"A": "社会主义经济的重要组成部分和我国经济社会发展的重要基础", "B": "国家税收的重要来源和就业创业的重要领域", "C": "稳定经济的重要基础和金融发展的重要依托", "D": "技术创新的重要主体和经济持续健康发展的重要力量"}, "answer": "BCD", "chap": "第六章"}, {"id": 152, "src": "multi", "srcnum": 50, "type": "multi", "stem": "迈上新征程，我国民营经济只能壮大，不能弱化，而且要走向更加广阔的舞台。民营经济是", "options": {"A": "非公有制经济的主要经济组织形式", "B": "推进中国式现代化的生力军", "C": "高质量发展的重要基础", "D": "推动我国全面建成社会主义现代化强国、实现第二个百年奋斗目标的重要力量"}, "answer": "ABCD", "chap": "第六章"}, {"id": 153, "src": "multi", "srcnum": 51, "type": "multi", "stem": "构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，是推动高质量发展的战略基点，是关系我国发展全局的重大战略任务。构建新发展格局，是", "options": {"A": "适应我国发展新阶段要求的必然选择", "B": "塑造国际合作和竞争新优势的必然选择", "C": "基于我国比较优势变化，审时度势作出的重大决策", "D": "把握未来发展主动权的先手棋"}, "answer": "ABCD", "chap": "第六章"}, {"id": 154, "src": "multi", "srcnum": 52, "type": "multi", "stem": "加快构建新发展格局，是立足实现第二个百年奋斗目标、统筹发展和安全作出的战略决策，是把握未来发展主动权的战略部署。大力推动构建新发展格局，必须", "options": {"A": "着力推动实施扩大内需战略同深化供给侧结构性改革有机结合", "B": "着力发展实体经济", "C": "着力加快科技自立自强", "D": "着力推动产业链供应链优化升级"}, "answer": "ABCD", "chap": "第六章"}, {"id": 155, "src": "multi", "srcnum": 53, "type": "multi", "stem": "习近平总书记强调，扩大内需既关系经济稳定，也关系经济安全，不是权宜之计，而是战略之举。2024年7月30日召开的中共中央政治局会议强调“深化创新驱动发展，深入挖掘内需潜力”，要求“以提振消费为重点扩大国内需求，经济政策的着力点要更多转向惠民生、促消费”。2025年全国两会，“加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚”写入了政府工作报告。中央经济工作会议将\"大力提振消费、提高投资效益，全方位扩大国内需求”列为2025年要抓好的重点任务之首。要深入挖掘内需潜力，是因为", "options": {"A": "大国经济的特征都是内需为主导、内部可循环", "B": "内需是中国经济发展的基本动力", "C": "我国同其他国家的产业关联和相互依赖程度都比较低", "D": "内需是满足人民日益增长的美好生活需要的必然要求"}, "answer": "ABD", "chap": "第六章"}, {"id": 156, "src": "multi", "srcnum": 54, "type": "multi", "stem": "建设农业强国，必须走中国特色社会主义乡村振兴道路，大力实施乡村振兴战略，全面推进乡村振兴。实施乡村振兴战略", "options": {"A": "农业农村现代化是总目标", "B": "坚持农业农村优先发展是总方针", "C": "产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求", "D": "建立健全城乡融合发展体制机制和政策体系是制度保障"}, "answer": "ABCD", "chap": "第六章"}, {"id": 157, "src": "multi", "srcnum": 55, "type": "multi", "stem": "习近平总书记指出：“在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败J党的二十届三中全会通过的《中共中央关于进一步全面深化改革推进中国式现代化的决定》，对完善城乡融合发展体制机制作出重要战略部署，必将对推进中国式现代化产生重大而深远影响。完善城乡融合发展体制机制是", "options": {"A": "补上农业农村短板、建设农业强国的现实选择", "B": "拓展现代化发展空间、推动高质量发展的迫切需要", "C": "新时代“三农”工作的总抓手", "D": "满足人民对美好生活的向往、促进共同富裕的内在要求"}, "answer": "ABD", "chap": "第六章"}, {"id": 158, "src": "multi", "srcnum": 56, "type": "multi", "stem": "京津冀地区是我国经济最具活力、开放程度最高、创新能力最强、吸纳人口最多的地区之一。京津冀协同发展，是习近平总书记亲自谋划、亲自部署、亲自推动的重大国家战略，对于促进区域协调发展、形成新增长极具有重要意义。推动京津冀协同发展有利于", "options": {"A": "解决北京“大城市病”问题，探索人口经济密集地区优化开发的新模式", "B": "完善城市群形态，打造具有较强影响力的世界级城市群", "C": "增强区域发展协调性平衡性，积极服务构建新发展格局", "D": "高标准建设好北京“新两翼”，推动京津冀成为高质量发展建设共同富裕示范区"}, "answer": "ABC", "chap": "第六章"}, {"id": 159, "src": "multi", "srcnum": 57, "type": "multi", "stem": "新形势下促进区域协调发展，要深入实施区域协调发展战略、区域重大战略、主体功能区战略。健全主体功能区制度，要逐步形成的空间格局分为", "options": {"A": "城市化地区", "B": "农产品主产区", "C": "科技园区", "D": "生态功能区"}, "answer": "ABD", "chap": "第六章"}, {"id": 160, "src": "multi", "srcnum": 58, "type": "multi", "stem": "教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义现代化国家", "options": {"A": "教育是根本，科技是关键，人才是基础", "B": "必须坚持科技是第一生产力、人才是第一资源、创新是第一动力", "C": "必须坚持教育优先发展、科技自立自强、人才引领驱动", "D": "必须深入实施科教兴国战略、人才强国战略、创新驱动发展战略"}, "answer": "ABCD", "chap": "第七章"}, {"id": 161, "src": "multi", "srcnum": 59, "type": "multi", "stem": "教育是国之大计、党之大计，是民族振兴、社会进步的基石。建设教育强国是", "options": {"A": "全面建成社会主义现代化强国的战略先导", "B": "实现高水平科技自立自强的重要支撑", "C": "促进全体人民共同富裕的有效途径", "D": "以中国式现代化全面推进中华民族伟大复兴的基础工程"}, "answer": "ABCD", "chap": "第七章"}, {"id": 162, "src": "multi", "srcnum": 60, "type": "multi", "stem": "加快建设科技强国，实现高水平科技自立自强，是", "options": {"A": "国家强盛和民族复兴的战略基石", "B": "应对风险挑战和维护国家利益的必然选择", "C": "发展经济的着力点", "D": "构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求"}, "answer": "ABD", "chap": "第七章"}, {"id": 163, "src": "multi", "srcnum": 61, "type": "multi", "stem": "科技自立自强是国家强盛之基、安全之要。加快建设科技强国，必须坚持走中国特色自主创新道路，发挥新型举国体制优势，完善国家创新体系，加快关键核心技术攻关，实现高水平科技自立自强。要打赢关键核心技术攻坚战，这是因为", "options": {"A": "关键核心技术是要不来、买不来、讨不来的", "B": "关键核心技术是国之重器", "C": "关键核心技术必须掌握在自己手中", "D": "掌握最关键最核心的技术才能从根本上保障国家经济安全、国防安全和其他安全"}, "answer": "ABCD", "chap": "第七章"}, {"id": 164, "src": "multi", "srcnum": 62, "type": "multi", "stem": "自力更生是中华民族自立于世界民族之林的奋斗基点，自主创新是我们攀登世界科技高峰的必由之路。实现高水平科技自立自强，必须增强自主创新能力。自主创新，就是从增强国家创新能力出发，加强", "options": {"A": "原始创新", "B": "集成创新", "C": "开放创新", "D": "改革创新"}, "answer": "ABC", "chap": "第七章"}, {"id": 165, "src": "multi", "srcnum": 63, "type": "multi", "stem": "千秋基业，人才为先。全面建设社会主义现代化国家，要聚天下英才而用之，推动我国由人才大国迈向人才强国。人才是", "options": {"A": "人力资源中能力和素质较高的劳动者", "B": "实现民族振兴、赢得国际竞争主动的战略资源", "C": "我们党执政的最大底气和最深厚的根基", "D": "引领发展的第一动力"}, "answer": "AB", "chap": "第七章"}, {"id": 166, "src": "multi", "srcnum": 64, "type": "multi", "stem": "民主首先而且主要是一种国家制度。中国特色社会主义政治制度", "options": {"A": "是中国共产党带领中国人民在革命、建设、改革的长期实践中形成的", "B": "集中体现了我国人民民主的本质属性", "C": "是保证人民当家作主科学有效的制度安排", "D": "具有鲜明的中国特色、民族特色、时代特色"}, "answer": "ABCD", "chap": "第八章"}, {"id": 167, "src": "multi", "srcnum": 65, "type": "multi", "stem": "中国特色社会主义政治制度是由根本政治制度、基本政治制度、重要政治制度等组成的制度体系。我国的社会主义民主政治制度安排，能够", "options": {"A": "有效保证人民享有更加广泛、更加充实的权利和自由，保证人民广泛参加国家治理和社会治理", "B": "有效调节国家政治关系，增强民族凝聚力，形成安定团结的政治局面", "C": "集中力量办大事一", "D": "有效维护国家独立自主，有力维护国家主权、安全、发展利益，维护中国人民和中华民族的福祉"}, "answer": "ABCD", "chap": "第八章"}, {"id": 168, "src": "multi", "srcnum": 66, "type": "multi", "stem": "人民民主是社会主义的生命，全过程人民民主", "options": {"A": "植根于我国社会主义民主的长期实践", "B": "是社会主义民主政治的本质属性.", "C": "是人民当家作主和依法治国的根本保证", "D": "是新时代我国民主政治领域具有重大创新意义的标志性成果"}, "answer": "ABD", "chap": "第八章"}, {"id": 169, "src": "multi", "srcnum": 67, "type": "multi", "stem": "全过程人民民主的提出、实践和发展，鲜明展示了我们党始终高举人民民主旗帜、实现人民当家作主的坚定立场，深刻彰显了我国人民民主的鲜明特色和显著优势，实现了", "options": {"A": "过程民主和成果民主相统一", "B": "程序民主和实质民主相统一", "C": "直接民主和间接民主相统一", "D": "人民民主和国家意志相统一"}, "answer": "ABCD", "chap": "第八章"}, {"id": 170, "src": "multi", "srcnum": 68, "type": "multi", "stem": "全过程人民民主，既有完整的制度程序，也有完整的参与实践，把民主选举、民主协商、民主决策、民主管理、民主监督贯通起来，涵盖经济、政治、文化、社会、生态文明等各个方面，聚焦国家发展大事、社会治理难事、百姓日常琐事，具有", "options": {"A": "时间上的连续性", "B": "内容上的整体性", "C": "运行上的协同性", "D": "人民参与上的广泛性和持续性"}, "answer": "ABCD", "chap": "第八章"}, {"id": 171, "src": "multi", "srcnum": 69, "type": "multi", "stem": "全过程人民民主，是中国共产党团结带领人民追求民主、发展民主、实现民主的伟大创造，是新时代我国民主政治领域具有重大创新意义的标志性成果。全过程人民民主是", "options": {"A": "全链条、全方位、全覆盖的民主", "B": "最广泛、最真实、最管用的民主", "C": "最纯粹、最先进、最好的民主", "D": "协商民主、选举民主、人人民主的统一"}, "answer": "AB", "chap": "第八章"}, {"id": 172, "src": "multi", "srcnum": 70, "type": "multi", "stem": "人民代表大会制度是我国的根本政治制度。这一根本制度，是我们党领导人民在人类政治制度史上的伟大创造。人民代表大会制度是好制度，它", "options": {"A": "符合我国国情和实际", "B": "体现社会主义国家性质", "C": "保证人民当家作主", "D": "能够有效凝聚全体人民力量一道推进中国式现代化"}, "answer": "ABCD", "chap": "第八章"}, {"id": 173, "src": "multi", "srcnum": 71, "type": "multi", "stem": "改革开放40多年来，人民代表大会制度为党领导人民创造经济快速发展奇迹和社会长期稳定奇迹提供了重要制度保障。实践证明，人民代表大会制度是我们党领导人民在人类政治制度史上的伟大创造，是在我国政治发展史乃至世界政治发展史上具有重大意义的全新政治制度。人民代表大会制度", "options": {"A": "有效保证国家沿着社会主义道路前进", "B": "有效保证国家治理跳出治乱兴衰的历史周期率", "C": "有效保证全体人民直接参与国家管理", "D": "有效保证国家政治生活既充满活力又安定有序"}, "answer": "ABD", "chap": "第八章"}, {"id": 174, "src": "multi", "srcnum": 72, "type": "multi", "stem": "人民代表大会制度坚持党的领导、人民当家作主、依法治国有机统一，坚决维护党中央权威和集中统一领导，坚持党总揽全局、协调各方的领导核心作用，有利于从制度上法律上坚持和巩固党的领导地位和执政地位，确保", "options": {"A": "党的主张通过法定程序成为国家意志", "B": "党组织推荐的人选通过法定程序成为国家政权机关的领导人员", "C": "党内法规体系上升为全社会都必须遵守的法律规范体系", "D": "党通过国家政权机关实施对国家和社会的领导"}, "answer": "ABD", "chap": "第八章"}, {"id": 175, "src": "multi", "srcnum": 73, "type": "multi", "stem": "中国特色社会主义政治制度，既把握了长期形成的历史传承，又把握了走过的发展道路、积累的政治经验、形成的政治原则，还把握了现实要求、着眼解决现实问题，注重历史和现实、理论和实践、形式和内容有机统一，具有鲜明的中国特色、民族特色、时代特色。具有鲜明中国特色的新型政党制度的内容是", "options": {"A": "共产党领导、多党派合作", "B": "共产党执政、多党派参政", "C": "长期共存、互相监督", "D": "肝胆相照、荣辱与共"}, "answer": "AB", "chap": "第八章"}, {"id": 176, "src": "multi", "srcnum": 74, "type": "multi", "stem": "8岁增长至U2024年的79岁，主要健康指标居于中高收入国家前列。我们党之所以高度重视人民群众的生命安全和身体健康，是因为人民健康是", "options": {"A": "社会文明进步的基础", "B": "民族昌盛和国家富强的重要标志", "C": "社会主义现代化的重要标志", "D": "促进人的全面发展的必然要求"}, "answer": "ABCD", "chap": "第十一章"}, {"id": 177, "src": "multi", "srcnum": 75, "type": "multi", "stem": "75年来的实践充分证明，人民政协在人类政治制度发展史上具有独特政治价值，已经并将不断展现出旺盛生命力。人民政协..", "options": {"A": "作为多党派参政的国家权力机关，有利于贯彻民主集中制、保证国家政治生活既充满活力又安定有序", "B": "作为最广泛的爱国统一战线组织，有利于最大限度把全体中华儿女的智慧和力量汇聚起来", "C": "作为社会主义协商民主的重要渠道和专门协商机构，有利于促进科学决策、有效施策，提升国家治理效能", "D": "作为中国共产党领导的政治组织，有利于完善人民当家作主的制度体系"}, "answer": "BCD", "chap": "第八章"}, {"id": 178, "src": "multi", "srcnum": 76, "type": "multi", "stem": "习近平总书记指出：“有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是人民民主的真谛。”协商民主是实践全过程人民民主的重要形式，是", "options": {"A": "我国社会主义民主政治的特有形式和独特优势", "B": "党的群众路线在政治领域的重要体现", "C": "中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排", "D": "新时代我国民主政治领域具有重大创新意义的标志性成果"}, "answer": "ABC", "chap": "第八章"}, {"id": 179, "src": "multi", "srcnum": 77, "type": "multi", "stem": "基层民主是全过程人民民主的重要体现。我国基层民主有多种多样的形式，如以村民委员会为组织形态的农村村民自治、以社区居民委员会为组织形态的城市居民自治、以职工代表大会为组织依托的企事业单位职工自治等。发展基层民主", "options": {"A": "是实现人民有效政治参与的重要渠道", "B": "是人民当家作主的有效途径", "C": "是社会主义民主最广泛的实践", "D": "彰显了人民当家作主的广泛性、真实性、有效性"}, "answer": "ABCD", "chap": "第八章"}, {"id": 180, "src": "multi", "srcnum": 78, "type": "multi", "stem": "新时代统战工作取得的最大成果，就是在实践中形成了关于做好新时代党的统一战线工作的重要思想，就加强和改进统战工作提出了一系列新理念新思想新战略。必须充分发挥统一战线的重要法宝作用。统一战线是", "options": {"A": "中国共产党区别于其他任何政党的显著标志", "B": "党克敌制胜、执政兴国的重要法宝", "C": "团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝", "D": "党的总路线总政策的重要组成部分"}, "answer": "BCD", "chap": "第八章"}, {"id": 181, "src": "multi", "srcnum": 79, "type": "multi", "stem": "统一战线是我国新民主主义革命的三大法宝之一。新时代，统一战线面临的时和势、肩负的使命和任务发生了重大变化，但统一战线仍然是重要法宝，我们要深刻理解发展壮大新时代爱国统一战线的重要意义。统一战线", "options": {"A": "在维护国家主权、安全、发展利益上的作用更加重要", "B": "在围绕中心、服务大局上的作用更加重要", "C": "在增强党的阶级基础、扩大党的群众基础上的作用更加重要", "D": "在团结国际社会共同反对霸权主义、单边主义的斗争中的作用更加重要"}, "answer": "ABC", "chap": "第八章"}, {"id": 182, "src": "multi", "srcnum": 80, "type": "multi", "stem": "民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。对中华民族形成起决定作用的是对中华民族共同体的认同，而不是种族、血缘、地域、宗教等因素。只有铸牢中华民族共同体意识，才能", "options": {"A": "构建起维护国家统一和民族团结的坚固思想长城", "B": "增进各民族对中华民族的自觉认同，夯实我国民族关系发展的思想基础", "C": "有效应对实现中华民族伟大复兴过程中民族领域可能发生的风险挑战", "D": "为党和国家兴旺发达、长治久安提供重要思想保证"}, "answer": "ABCD", "chap": "第八章"}, {"id": 183, "src": "multi", "srcnum": 81, "type": "multi", "stem": "法律是治国之重器，法治是国家治理体系和治理能力的重要依托。历史和现实告诉我们，法治兴则国兴，法治强则国强。全面依法治国，是", "options": {"A": "完善和发展中国特色社会主义制度的重要方面", "B": "推进国家治理体系和治理能力现代化的重要方面", "C": "坚持和发展中国特色社会主义的本质要求", "D": "坚持和发展中国特色社会主义的重要保障"}, "answer": "ABCD", "chap": "第九章"}, {"id": 184, "src": "multi", "srcnum": 82, "type": "multi", "stem": "我们党领导人民长期探索走出的中国特色社会主义法治道路，是全面依法治国的唯一正确道路。我国法治建设的成就可以列举出十几条、几十条，但归结起来就是开辟了中国特色社会主义法治道路这一条。中国特色社会主义法治道路的核心要义是", "options": {"A": "坚持党的领导", "B": "坚持以人民为中心", "C": "坚持中国特色社会主义制度", "D": "贯彻中国特色社会主义法治理论"}, "answer": "ACD", "chap": "第九章"}, {"id": 185, "src": "multi", "srcnum": 83, "type": "multi", "stem": "中国特色社会主义法治道路是全面依法治国的唯一正确道路。坚持和拓展中国特色社会主义法治道路，必须毫不动摇坚持的原则有", "options": {"A": "坚持中国共产党的领导", "B": "坚持以人民为中心", "C": "坚持法律面前人人平等", "D": "坚持依法治国和以德治国相结合"}, "answer": "ABCD", "chap": "第九章"}, {"id": 186, "src": "multi", "srcnum": 84, "type": "multi", "stem": "建设法治中国，是全面建设社会主义现代化国家的重要组成部分。加快建设法治中国，必须坚持统筹兼顾、把握重点、整体谋划，更加注重系统性、整体性、协同性。法治中国建设的工作布局是", "options": {"A": "坚持依法治国、依法执政、依法行政共同推进", "B": "坚持法治国家、法治政府、法治社会一体建设", "C": "坚持科学立法、严格执法、公正司法、全民守法", "D": "坚持统筹推进国内法治和涉外法治"}, "answer": "ABD", "chap": "第九章"}, {"id": 187, "src": "multi", "srcnum": 85, "type": "multi", "stem": "文化是一个国家、一个民族的灵魂。国家的富强，民族的振兴，无不伴随着文化的历史性进步。国家强大、民族兴盛、社会发展，不仅需要高度发达的物质文明，也需要高度繁荣的精神文明。文化繁荣兴盛是", "options": {"A": "实现中华民族伟大复兴的精神支撑", "B": "建设社会主义现代化强国的应有之义", "C": "满足人民日益增长的美好生活需要的内在要求", "D": "在世界文化激荡中站稳脚跟的前提基础"}, "answer": "ABCD", "chap": "第十章"}, {"id": 188, "src": "multi", "srcnum": 86, "type": "multi", "stem": "中国式现代化是物质文明和精神文明相协调的现代化，全面建成社会主义现代化强国必然要求", "options": {"A": "统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局的重要内容", "B": "推动高质量发展的重要支点", "C": "满足人民日益增长的美好生活需要的重要因素", "D": "战胜前进道路上各种风险挑战的重要力量源泉"}, "answer": "ABCD", "chap": "第十章"}, {"id": 189, "src": "multi", "srcnum": 87, "type": "multi", "stem": "2024年8月21日，在外交部发言人主持的例行记者会上，有记者问，中国游戏《黑神话：悟空》全球火爆推出，其中的中国文化元素令玩家印象深刻，请问发言人有何评论？外交部发言人表示：“我不了解电子游戏，但是感谢你让我关注到这款游戏。从名字看，这款游戏取材于中国古典文学名著《西游记》，我想这也反映了中国文化的吸引力中华优秀传统文化是", "options": {"A": "我们坚定文化自信的深厚基础", "B": "中华民族的根和魂", "C": "最深厚的文化软实力", "D": "我们在世界文化激荡中站稳脚跟的根基"}, "answer": "ABCD", "chap": "第十章"}, {"id": 190, "src": "multi", "srcnum": 88, "type": "multi", "stem": "中华文明源远流长、博大精深，是世界上唯一绵延不断且以国家形态发展至今的伟大文明。中华文明是", "options": {"A": "中华民族独特的精神标识", "B": "当代中国文化的根基", "C": "维系全世界华人的精神纽带", "D": "中国文化创新的宝藏"}, "answer": "ABCD", "chap": "第十章"}, {"id": 191, "src": "multi", "srcnum": 89, "type": "multi", "stem": "2025年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界影史多项纪录。2025年是中国电影诞生120周年。《哪吒之魔童闹海》作为全球电影票房排行榜前10名榜单中唯一的非好莱坞影片，为中国电影诞生120周年献上了一份沉甸甸的厚礼，也激发了中华儿女的民族自豪感和文化自信心。《哪吒之魔童闹海》国际版海报上那句“我偏要踏出一条自己的路”，正是今天中国人坚定文化自信的写照。我们坚定文化自信的底气在于", "options": {"A": "中华优秀传统文化是我们坚定文化自信的深厚基础", "B": "党带领人民在伟大斗争中孕育的革命文化和社会主义先进文化是我们坚定文化自信的坚强基石", "C": "中国特色社会主义伟大实践是我们坚定文化自信的现实基础", "D": "全人类共同价值是我们坚定文化自信的价值基础"}, "answer": "ABC", "chap": "第十章"}, {"id": 192, "src": "multi", "srcnum": 90, "type": "multi", "stem": "中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路。全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路。决定社会主义文化事业前途命运的关键是", "options": {"A": "坚持为人民服务", "B": "坚持为社会主义服务", "C": "坚持百花齐放", "D": "坚持百家争鸣"}, "answer": "AB", "chap": "第十章"}, {"id": 193, "src": "multi", "srcnum": 91, "type": "multi", "stem": "2023年10月7日至8日，全国宣传思想文化工作会议在北京召开。会议的最重要成果是首次提出并阐释习近平文化思想。习近平文化思想", "options": {"A": "既有文化理论观点上的创新和突破，又有文化工作布局上的部署要求", "B": "明确了新时代文化建设的路线图和任务书", "C": "标志着我们党对中国特色社会主义文化建设规律的认识达到了新高度", "D": "表明我们党的历史自信、文化自信达到了新高度"}, "answer": "ABCD", "chap": "第十章"}, {"id": 194, "src": "multi", "srcnum": 92, "type": "multi", "stem": "马克思主义是我们立党立国、兴党兴国的根本指导思想。坚持马克思主义在意识形态领域指导地位的制度是中国特色社会主义制度体系的一项根本制度。坚持马克思主义在意识形态领域指导地位的根本制度是", "options": {"A": "坚持和加强党对宣传思想文化工作全面领导的本质要求", "B": "发展社会主义先进文化的有力保障", "C": "坚持和巩固我国社会主义制度、保证我国文化建设正确方向的必然要求", "D": "历史的结论"}, "answer": "ABCD", "chap": "第十章"}, {"id": 195, "src": "multi", "srcnum": 93, "type": "multi", "stem": "核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。社会主义核心价值观", "options": {"A": "体现了社会主义本质要求", "B": "继承了中华优秀传统文化", "C": "吸收了世界文明有益成果", "D": "体现了时代精神"}, "answer": "ABCD", "chap": "第十章"}, {"id": 196, "src": "multi", "srcnum": 94, "type": "multi", "stem": "哲学家冯友兰曾写道：“盖并世列强，虽新而不古；希腊罗马，有古而无今。惟我国家，亘古亘今，亦新亦旧，斯所谓‘周虽旧邦，其命维新‘者也!”创新性是中华文明的突出特性之一，创新性从根本上决定了中华民族", "options": {"A": "守正不守旧、尊古不复古的进取精神", "B": "不惧新挑战、勇于接受新事物的无畏品格", "C": "必然走自己的路", "D": "形成多元一体的格局"}, "answer": "AB", "chap": "第十章"}, {"id": 197, "src": "multi", "srcnum": 95, "type": "multi", "stem": "海纳百川，有容乃大。文明的繁荣、人类的进步，离不开求同存异、开放包容，离不开文明交流、互学互鉴。中华文明自古就以开放包容闻名于世。中华文明具有突出的包容性，从根本上决定了", "options": {"A": "中华民族交往交流交融的历史取向", "B": "中国各宗教信仰多元并存的和谐格局", "C": "中华文化对世界文明兼收并蓄的开放胸怀", "D": "中国不断追求文明交流互鉴而不搞文化霸权"}, "answer": "ABC", "chap": "第十章"}, {"id": 198, "src": "multi", "srcnum": 96, "type": "multi", "stem": "统一性是中华文明的突出特性之一，从根本上决定了", "options": {"A": "中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚", "B": "国土不可分、国家不可乱、民族不可散、文明不可断的共同信念", "C": "国家统一永远是中国核心利益的核心", "D": "一个坚强统一的国家是各族人民的命运所系"}, "answer": "ABCD", "chap": "第十章"}, {"id": 199, "src": "multi", "srcnum": 97, "type": "multi", "stem": "英国哲学家罗素这样评价中国文化中的和平传统：“中国至高无上的伦理品质中的一些东西，现代世界极为需要”，“若能够被世界采纳，地球上肯定比现在有更多的欢乐祥和”。中华文明历来崇尚“以和邦国”“和而不同”“以和为贵”，中华民族的血液中没有侵略他人、称王称霸的基因。中华文明具有的和平性，从根本上决定了中国", "options": {"A": "始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者", "B": "不断追求文明交流互鉴而不搞文化霸权", "C": "不会把自己的价值观念与政治体制强加于人", "D": "坚持合作、不搞对抗，决不搞“党同伐异”的小圈子"}, "answer": "ABCD", "chap": "第十章"}, {"id": 200, "src": "multi", "srcnum": 98, "type": "multi", "stem": "2025年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界影史多项纪录，并成功登顶全球动画电影票房榜首，打破了长期以来好莱坞对全球动画市场的垄断。《哪吒之魔童闹海》的导演饺子认为，影片成功的关键在于满足了观众对传统题材现代化表达的需求。这启示我们，不断提升中华文化影响力，必须", "options": {"A": "推动中华优秀传统文化创造性转化和创新性发展.", "B": "使中华民族最基本的文化基因同当代中国相适应、同现代社会相协调、同现实文化相融通", "C": "把跨越时空、超越国界、富有永恒魅力、具有当代价值的文化精神弘扬起来", "D": "加强国际传播能力建设，全面提升国际传播效能"}, "answer": "ABCD", "chap": "第十章"}, {"id": 201, "src": "multi", "srcnum": 99, "type": "multi", "stem": "治国有常，利民为本。民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障等方面。随着经济社会的发展进步，人民生活品质的不断提高，民生内涵也在不断丰富。民生", "options": {"A": "事关人民的生存生活生计", "B": "事关民心所向、民情所系、民意所指", "C": "是国家强盛之基、安全之要", "D": "决定党的事业成败和国家命运兴衰"}, "answer": "ABD", "chap": "第十一章"}, {"id": 202, "src": "multi", "srcnum": 100, "type": "multi", "stem": "习近平指出，以人民为中心是我们党的根本执政理念，让人民生活幸福是“国之大者”。全面进各项民生事业，使改革发展成果更多更公平惠及全体人民。增进民生福祉是", "options": {"A": "坚持立党为公、执政为民的本质要求", "B": "社会主义生产的根本目的", "C": "全面建设社会主义现代化国家的应有之义", "D": "推动高质量发展的战略基点"}, "answer": "ABC", "chap": "第十一章"}, {"id": 203, "src": "multi", "srcnum": 101, "type": "multi", "stem": "保障和改善民生的重要前提，是正确把握民生和发展的关系。以下说法正确的有", "options": {"A": "发展是解决民生问题的“总钥匙”", "B": "民生是发展的“指南针”", "C": "发展是改善民生的物质基础", "D": "持续不断改善民生能够调动人们发展生产的积极性"}, "answer": "ABCD", "chap": "第十一章"}, {"id": 204, "src": "multi", "srcnum": 102, "type": "multi", "stem": "就业事关人民群众切身利益，事关经济社会健康发展，事关国家长治久安。党的十八大以来,党中央坚持把就业工作摆在治国理政的突出位置，强化就业优先政策，健全就业促进机制，有效应对各种压力挑战，为民生改善和经济发展提供了重要支撑。就业是", "options": {"A": "最基本的民生", "B": "最大的根基工程", "C": "改善民生、实现发展成果由人民共享最重要最直接的方式", "D": "劳动者赖以生存和发展的基础、共享经济发展成果的基本条件"}, "answer": "ABD", "chap": "第十一章"}, {"id": 205, "src": "multi", "srcnum": 103, "type": "multi", "stem": "促进高质量充分就业，是新时代新征程就业工作的新定位、新使命。促进高质量充分就业需要全面贯彻的方针是", "options": {"A": "劳动者自主就业", "B": "城镇转移就业", "C": "市场调节就业", "D": "政府促进就业和鼓励创业"}, "answer": "ACD", "chap": "第十一章"}, {"id": 206, "src": "multi", "srcnum": 104, "type": "multi", "stem": "新时代的10多年，我国建成了世界上规模最大的社会保障体系。社会保障", "options": {"A": "是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障", "B": "是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排", "C": "是民族复兴的根基、国家强盛的前提", "D": "发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用"}, "answer": "ABD", "chap": "第十一章"}, {"id": 207, "src": "multi", "srcnum": 105, "type": "multi", "stem": "我们党高度重视人民群众的生命安全和身体健康，是因为人民健康是", "options": {"A": "社会文明进步的基础", "B": "民族昌盛和国家富强的重要标志", "C": "社会主义现代化的重要标志", "D": "促进人的全面发展的必然要求"}, "answer": "ABCD", "chap": "第十一章"}, {"id": 208, "src": "multi", "srcnum": 106, "type": "multi", "stem": "社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化的重要内容。新时代加强和创新社会治理，要求坚持", "options": {"A": "系统治理", "B": "依法治理", "C": "综合治理", "D": "源头治理"}, "answer": "ABCD", "chap": "第十一章"}, {"id": 209, "src": "multi", "srcnum": 107, "type": "multi", "stem": "基础不牢，地动山摇。习近平指出，基层强则国家强，基层安则天下安，必须抓好基层治理现代化这项基础性工作。以下说法正确的有", "options": {"A": "基层治理是国家治理的基石", "B": "城乡社区是社会治理最基本的单元", "C": "社会治理的重心必须向基层下移", "D": "城乡社区是党和政府联系、服务居民群众的“最后一公里\""}, "answer": "ABCD", "chap": "第十一章"}, {"id": 210, "src": "multi", "srcnum": 108, "type": "multi", "stem": "保护自然就是保护人类，建设生态文明就是造福人类。生态文明之所以重要，是因为", "options": {"A": "生态环境变化直接影响文明的兴衰演替", "B": "生态文明是人类文明发展的历史趋势", "C": "生态文明建设是重大经济问题", "D": "生态文明建设是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题"}, "answer": "ABCD", "chap": "第十二章"}, {"id": 211, "src": "multi", "srcnum": 109, "type": "multi", "stem": "生态环境问题归根到底是经济发展方式和生活方式问题。绿水青山就是金山银山", "options": {"A": "明确了新时代我国发展壮大的必由之路", "B": "指明了实现发展和保护协同共生的新路径", "C": "阐明了经济发展与生态环境保护之间的关系", "D": "揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理"}, "answer": "BCD", "chap": "第十二章"}, {"id": 212, "src": "multi", "srcnum": 110, "type": "multi", "stem": "党的十八大以来，我们把生态文明建设作为关系中华民族永续发展的根本大计，开展了一系列开创性工作，决心之大、力度之大、成效之大前所未有，生态文明建设从理论到实践都发生了历史性、转折性、全局性变化，美丽中国建设迈出重大步伐。我们实现", "options": {"A": "由重点整治到系统治理的重大转变", "B": "由被动应对到主动作为的重大转变", "C": "由全球环境治理参与者到引领者的重大转变", "D": "由实践探索到科学理论指导的重大转变"}, "answer": "ABCD", "chap": "第十二章"}, {"id": 213, "src": "multi", "srcnum": 111, "type": "multi", "stem": "新时代我国生态文明建设的重大成就表现在", "options": {"A": "生态文明建设战略地位更加凸显", "B": "生态文明制度体系更加健全", "C": "污染防治和生态保护更加有力", "D": "生态环境保护结构性、根源性、趋势性压力得到根本缓解"}, "answer": "ABC", "chap": "第十二章"}, {"id": 214, "src": "multi", "srcnum": 112, "type": "multi", "stem": "山水林田湖草沙是一个生命共同体，是不可分割的生态系统，要坚持山水林田湖草沙一体化保护和系统治理。要加快实施重要生态系统保护和修复重大工程，强化国土空间规划和用途管控，划定落实三条控制线以及各类海域保护线。三条控制线是指", "options": {"A": "资源利用上线", "B": "生态保护红线", "C": "永久基本农田", "D": "城镇开发边界"}, "answer": "BCD", "chap": "第十二章"}, {"id": 215, "src": "multi", "srcnum": 113, "type": "multi", "stem": "保护生态环境必须依靠制度、依靠法治。必须把制度建设作为生态文明建设的重中之重，构建生态文明制度体系，把生态文明建设纳入制度化、法治化轨道。生态文明制度体系的内涵是", "options": {"A": "产权清晰", "B": "多元参与", "C": "激励约束并重", "D": "系统完整"}, "answer": "ABCD", "chap": "第十二章"}, {"id": 216, "src": "multi", "srcnum": 114, "type": "multi", "stem": "统筹发展和安全，是党和国家的一项基础性工作，是我们党治国理政的一个重大原则。之所以要统筹发展和安全，是因为发展和安全是两件大事，是一体之两翼、驱动之双轮，必须同步推进。以下说法正确的有", "options": {"A": "发展解决的是动力问题，是推动国家和民族康续绵延的根本支撑", "B": "安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石", "C": "发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全", "D": "安全是发展的条件和保障，没有国家安全，发展取得的成果也可能毁于一旦"}, "answer": "ABCD", "chap": "第十三章"}, {"id": 217, "src": "multi", "srcnum": 115, "type": "multi", "stem": "牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障。只有以新安全格局保障新发展格局，把国家发展建立在更加安全、更为可靠的基础之上，才能", "options": {"A": "夯实我国经济发展的根基", "B": "增强发展的安全性稳定性", "C": "在各种可以预见和难以预见的风险挑战中增强我国的生存力、竞争力、发展力、持续力", "D": "确保中华民族伟大复兴进程不被迟滞甚至中断，胜利实现全面建成社会主义现代化强国目标"}, "answer": "ABCD", "chap": "第十三章"}, {"id": 218, "src": "multi", "srcnum": 116, "type": "multi", "stem": "构建统筹各领域安全的新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要任务。这是因为", "options": {"A": "政治安全是国家安全的根本", "B": "政治安全是一切国家生存和发展的基础条件", "C": "政治安全决定和影响着国家其他各个领域的安全", "D": "政治安全是立国之基"}, "answer": "ABC", "chap": "第十三章"}, {"id": 219, "src": "multi", "srcnum": 117, "type": "multi", "stem": "维护政治安全的主要内容包括", "options": {"A": "维护政权安全", "B": "维护制度安全", "C": "维护国土安全", "D": "维护意识形态安全"}, "answer": "ABD", "chap": "第十三章"}, {"id": 220, "src": "multi", "srcnum": 118, "type": "multi", "stem": "政治安全与人民安全、国家利益至上是有机统一的。以下说法正确的有", "options": {"A": "政治安全是维护人民安全和国家利益的根本保证", "B": "人民安全居于中心地位", "C": "国家利益至上是实现政治安全和人民安全的要求和原则", "D": "要把三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安"}, "answer": "ABCD", "chap": "第十三章"}, {"id": 221, "src": "multi", "srcnum": 119, "type": "multi", "stem": "习近平指出：”我们捍卫和平、维护安全、慑止战争的手段和选择有多种多样，但军事手段始终是保底手段只有以强大军事实力为后盾", "options": {"A": "政治安全、国土安全等其他安全才能托底", "B": "国家的总体安全和人民的幸福生活才有保障", "C": "实现国家繁荣富强的主动权才能牢牢掌握在自己手中", "D": "当代中国价值观念才能走向世界"}, "answer": "ABC", "chap": "第十四章"}, {"id": 222, "src": "multi", "srcnum": 120, "type": "multi", "stem": "进入新时代，以习近平同志为核心的党中央着眼实现中华民族伟大复兴这个国家和民族最高利益，对人民军队使命任务作出新定位、提出新要求，概括起来就是", "options": {"A": "为巩固中国共产党领导和我国社会主义制度提供战略支撑", "B": "为捍卫国家主权、统一和领土完整提供战略支撑", "C": "为维护我国海外利益提供战略支撑", "D": "为促进世界和平与发展提供战略支撑"}, "answer": "ABCD", "chap": "第十四章"}, {"id": 223, "src": "multi", "srcnum": 121, "type": "multi", "stem": "90多年来，人民军队之所以能够始终保持强大的凝聚力、向心力、战斗力，经受住各种考验,不断从胜利走向胜利，最根本的就是靠党的坚强领导。实践证明，听党指挥是", "options": {"A": "人民军队建设的首要", "B": "人民军队的命脉所在", "C": "人民军队的鲜明特色和政治优势", "D": "新时代强军目标的核心"}, "answer": "AB", "chap": "第十四章"}, {"id": 224, "src": "multi", "srcnum": 122, "type": "multi", "stem": "根据国防和军队现代化新“三步走”战略安排，到2035年我国要基本实现国防和军队现代化。这一步的关键是实现", "options": {"A": "军事理论现代化", "B": "军队组织形态现代化", "C": "军事人员现代化", "D": "武器装备现代化"}, "answer": "ABCD", "chap": "第十四章"}, {"id": 225, "src": "multi", "srcnum": 123, "type": "multi", "stem": "习近平指出：“坚持党指挥枪、建设自己的人民军队，是党在血与火的斗争中得出的颠扑不破的真理。”坚持党对人民军队的绝对领导", "options": {"A": "是马克思主义建党建军的一条基本原则", "B": "是人民军队永远不变的军魂", "C": "反映了军队的根本职能和军队建设的根本指向", "D": "必须有一整套制度作保证"}, "answer": "ABD", "chap": "第十四章"}, {"id": 226, "src": "multi", "srcnum": 124, "type": "multi", "stem": "“一国两制”立足中国国情，把原则性和灵活性、现实性和长远性、一致性和差异性统一起来，凝结了中国共产党人为解决国家统一问题展现出的超凡勇气和卓越智慧，是前无古人的伟大创举。“一国两制”", "options": {"A": "是中国特色社会主义制度创新的重要成果", "B": "是中国共产党领导人民实现祖国和平统一的伟大构想", "C": "包含了中华文化中的和合理念", "D": "为国际社会解决类似问题提供了新思路、新方案"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 227, "src": "multi", "srcnum": 125, "type": "multi", "stem": "“一国两制”构想获得了有关各方的一致认可，实现了港澳平稳过渡、和平回归，洗刷了民族百年耻辱，完成了实现祖国完全统一的重要一步。“一国两制”伟大构想体现了", "options": {"A": "中国共产党的政治智慧和开拓创新的勇气", "B": "中华民族追求统一、反对分裂、爱好和平的精神特质", "C": "中国特色社会主义制度的先进性质", "D": "尊重差异、求同存异的思维方式"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 228, "src": "multi", "srcnum": 126, "type": "multi", "stem": "“一国两制”是党领导人民实现祖国和平统一的一项重要制度，是国家的一项基本国策国两制”的根本宗旨是", "options": {"A": "维护国家主权、安全、发展利益", "B": "保持香港、澳门长期繁荣稳定", "C": "维护台海和平稳定", "D": "增强中华儿女对伟大祖国的认同感"}, "answer": "AB", "chap": "第十五章"}, {"id": 229, "src": "multi", "srcnum": 127, "type": "multi", "stem": "“一国两制”方针是一个完整的体系。关于“一国”和“两制”的关系，以下说法正确的有", "options": {"A": "“一国”是实行“两制”的前提和基础", "B": "“两制”从属和派生于“一国”，并统一于“一国”之内", "C": "“一国”是根，根深才能叶茂；“一国”是本，本固才能枝荣", "D": "“一国”之内的“两制”等量齐观、比肩并列"}, "answer": "ABC", "chap": "第十五章"}, {"id": 230, "src": "multi", "srcnum": 128, "type": "multi", "stem": "准确把握“一国两制”的科学内涵，必须坚持中央全面管治权和保障特别行政区高度自治权相统一。我国是单一制国家，中央对包括香港、澳门特别行政区在内的所有地方行政区域拥有全面管治权。全面管治权与高度自治权在本质上是统一的。以下说法正确的有", "options": {"A": "全面管治权是授权特别行政区高度自治的前提和基础", "B": "高度自治权是中央行使全面管治权的体现，", "C": "它们之间是源与流、本与末的关系", "D": "特别行政区不存在所谓“剩余权力”"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 231, "src": "multi", "srcnum": 129, "type": "multi", "stem": "要始终坚持“爱国者治港”“爱国者治澳”，把特别行政区管治权牢牢掌握在爱国者手巾，这是", "options": {"A": "事关国家主权、安全、发展利益的根本原则.", "B": "事关香港、澳门长期繁荣稳定的根本原则", "C": "保证香港、澳门长治久安的必然要求", "D": "人民当家作主和依法治国的根本保证"}, "answer": "ABC", "chap": "第十五章"}, {"id": 232, "src": "multi", "srcnum": 130, "type": "multi", "stem": "香港、澳门回归以来的实践经验告诉我们，保持香港、澳门长期繁荣稳定，继续推进“一国两制”实践行稳致远，需要", "options": {"A": "坚守“一国”之本、善用“两制”之利", "B": "维护高水平安全、推动高质量发展", "C": "发挥独特优势、强化内联外通", "D": "弘扬核心价值、促进包容和谐"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 233, "src": "multi", "srcnum": 131, "type": "multi", "stem": "党的十八大以来，以习近平同志为核心的党中央积极推进对台工作理论和实践创新，形成新时代党解决台湾问题的总体方略，牢牢把握两岸关系主导权和主动权，扎实推进祖国统一进程。解决台湾问题、实现祖国完全统一，是", "options": {"A": "中国共产党矢志不渝的历史任务", "B": "全体中华儿女的共同愿望", "C": "由中华民族伟大复兴的时和势所决定的", "D": "实现中华民族伟大复兴的必然要求"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 234, "src": "multi", "srcnum": 132, "type": "multi", "stem": "民族复兴、国家统一是大势所趋、大义所在、民心所向。以下说法正确的有", "options": {"A": "中华文明具有突出的统一性，国家统一永远是中国核心利益的核心", "B": "台湾问题因民族弱乱而产生，必将随着民族复兴而解决", "C": "实现祖国完全统一是不可阻挡的历史潮流", "D": "在中华民族的发展进程中，追求统一、反对分裂始终是全民族的主流价值观"}, "answer": "ABCD", "chap": "第十五章"}, {"id": 235, "src": "multi", "srcnum": 133, "type": "multi", "stem": "坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择。走和平发展道路", "options": {"A": "是由中国共产党性质宗旨和我国社会主义制度决定的", "B": "是基于中国历史文化传统作出的必然选择", "C": "是新时代对外工作的总目标", "D": "符合历史潮流、顺应世界大势"}, "answer": "ABD", "chap": "第十六章"}, {"id": 236, "src": "multi", "srcnum": 134, "type": "multi", "stem": "构建人类命运共同体，就是为了造福各国人民，促进世界和平，实现共同繁荣和发展。共建“一带一路”", "options": {"A": "是对中国与世界实现开放共赢路径的顶层设计", "B": "是推动构建人类命运共同体的实践平台", "C": "根植历史、更面向未来，源于中国、更属于世界", "D": "追求的是发展，崇尚的是共赢，传递的是希望"}, "answer": "ABCD", "chap": "第十六章"}, {"id": 237, "src": "multi", "srcnum": 135, "type": "multi", "stem": "党要管党、从严治党，是党的建设的一贯要求和根本方针。全面从严治党是", "options": {"A": "党永葆生机活力、走好新的赶考之路的必由之路", "B": "新时代党的建设的鲜明主题", "C": "党的政治建设的首要任务", "D": "新时代党的自我革命的伟大实践"}, "answer": "ABD", "chap": "第十七章"}, {"id": 238, "src": "multi", "srcnum": 136, "type": "multi", "stem": "全面从严治党是新时代党的自我革命的伟大实践。全面从严治党", "options": {"A": "核心是加强党的领导", "B": "基础在全面", "C": "关键在严", "D": "要害在治"}, "answer": "ABCD", "chap": "第十七章"}, {"id": 239, "src": "multi", "srcnum": 137, "type": "multi", "stem": "全面从严治党是一项管党治党的系统工程，客观上需要一个布局合理、内容科学、要素齐备、统一高效的全面从严治党体系。要落实新时代党的建设总要求，把全的要求、严的基调、治的理念落实到全面从严治党全过程，坚持", "options": {"A": "内容上全涵盖", "B": "对象上全覆盖", "C": "责任上全链条", "D": "制度上全贯通"}, "answer": "ABCD", "chap": "第十七章"}, {"id": 240, "src": "multi", "srcnum": 138, "type": "multi", "stem": "党的政治建设是党的根本性建设。党的政治建设的首要任务是", "options": {"A": "保证全党服从中央", "B": "时刻保持解决大党独有难题的清醒和坚定", "C": "维护党中央权威和集中统一领导", "D": "以伟大自我革命引领伟大社会革命"}, "answer": "AC", "chap": "第十七章"}], "judge": [{"id": 1, "stem": "习近平新时代中国特色社会主义思想科学回答了新时代坚持和发展什么样的中国特色社会主义、建设什么样的社会主义现代化强国、建设什么样的长期执政的马克思主义政党等重大时代课题。", "answer": true, "explain": "三个重大时代课题表述正确。", "chap": "导论"}, {"id": 2, "stem": "“十四个坚持”是习近平新时代中国特色社会主义思想最重要、最核心的内容，构成四梁八柱、发挥统摄作用。", "answer": false, "explain": "错。应是“十个明确”构成四梁八柱、发挥统摄作用；“十四个坚持”是基本方略。", "chap": "导论"}, {"id": 3, "stem": "“六个必须坚持”是习近平新时代中国特色社会主义思想的世界观和方法论。", "answer": true, "explain": "六个必须坚持=世界观和方法论（人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下）。", "chap": "导论"}, {"id": 4, "stem": "人民至上是贯穿习近平新时代中国特色社会主义思想的一根红线。", "answer": true, "explain": "表述正确。", "chap": "导论"}, {"id": 5, "stem": "“两个确立”是党在新时代取得的重大政治成果，是应对一切不确定性的最大确定性、最大底气、最大保证。", "answer": true, "explain": "表述正确。", "chap": "导论"}, {"id": 6, "stem": "习近平新时代中国特色社会主义思想创立的国际背景是中华民族伟大复兴的战略全局。", "answer": false, "explain": "错，写反了。国际背景是世界百年未有之大变局；国内背景才是中华民族伟大复兴的战略全局。", "chap": "导论"}, {"id": 7, "stem": "中国特色社会主义最本质的特征、中国特色社会主义制度的最大优势，都是中国共产党领导。", "

answer": true, "explain": "表述正确。", "chap": "第一章"}, {"id": 8, "stem": "文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。", "answer": true, "explain": "表述正确。", "chap": "第一章"}, {"id": 9, "stem": "四个自信中，道路自信是实现途径，理论自信是行动指南，制度自信是根本保障，文化自信是精神力量。", "answer": true, "explain": "对应关系正确。", "chap": "第一章"}, {"id": 10, "stem": "中国特色社会主义进入新时代，意味着我国社会主义初级阶段的基本国情已经改变。", "answer": false, "explain": "错。社会主要矛盾变了，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变、国际地位没有变（一变两不变）。", "chap": "第一章"}, {"id": 11, "stem": "党的基本路线是国家的生命线、人民的幸福线。", "answer": true, "explain": "表述正确。基本理论是行动指南。", "chap": "第一章"}, {"id": 12, "stem": "中国梦的本质是国家富强、民族振兴、人民幸福。", "answer": true, "explain": "表述正确。", "chap": "第二章"}, {"id": 13, "stem": "从2020年到2035年，我国要建成社会主义现代化强国。", "answer": false, "explain": "错。2020到2035是基本实现社会主义现代化；2035到本世纪中叶才建成社会主义现代化强国（两步走）。", "chap": "第二章"}, {"id": 14, "stem": "我国现代化五个特征中，人口规模巨大是显著特征，共同富裕是本质特征。", "answer": true, "explain": "表述正确。物质和精神协调是根本要求，人与自然和谐是鲜明特点，和平发展是突出特征。", "chap": "第二章"}, {"id": 15, "stem": "全体人民共同富裕的现代化，是中国式现代化区别于西方现代化的显著标志。", "answer": true, "explain": "表述正确。", "chap": "第二章"}, {"id": 16, "stem": "中国式现代化是中国共产党领导的社会主义现代化，这是对中国式现代化的定性，是管总、管根本的。", "answer": true, "explain": "表述正确。", "chap": "第二章"}, {"id": 17, "stem": "党中央集中统一领导是党的领导的最高原则。", "answer": true, "explain": "表述正确。", "chap": "第三章"}, {"id": 18, "stem": "党的领导制度是我国的根本政治制度。", "answer": false, "explain": "错。人民代表大会制度才是我国的根本政治制度；党的领导制度是我国的根本领导制度，在制度体系中具有统领地位。", "chap": "第三章"}, {"id": 19, "stem": "民心是最大的政治，决定事业兴衰成败。", "answer": true, "explain": "表述正确。", "chap": "第三章"}, {"id": 20, "stem": "人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。", "answer": true, "explain": "表述正确。", "chap": "第四章"}, {"id": 21, "stem": "现代化的最终目标是实现高水平科技自立自强。", "answer": false, "explain": "错。现代化的最终目标是实现人自由而全面的发展。高水平科技自立自强是国家强盛之基、安全之要。", "chap": "第四章"}, {"id": 22, "stem": "让群众满意是我们党做好一切工作的价值取向和根本标准；人民是党的工作的最高裁决者和最终评判者。", "answer": true, "explain": "表述正确。", "chap": "第四章"}, {"id": 23, "stem": "分配制度是促进共同富裕的基础性制度；收入分配是民生之源。", "answer": true, "explain": "表述正确。", "chap": "第四章"}, {"id": 24, "stem": "改革开放是决定当代中国命运的关键一招，是坚持和发展中国特色社会主义的必由之路。", "answer": true, "explain": "表述正确。", "chap": "第五章"}, {"id": 25, "stem": "解放和发展社会生产力是改革开放的鲜明特征和首要任务；解放和增强社会活力是新时代全面深化改革的关键所在。", "answer": true, "explain": "表述正确。", "chap": "第五章"}, {"id": 26, "stem": "全面深化改革的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。", "answer": false, "explain": "错，这是依法治国的总目标。全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。", "chap": "第五章"}, {"id": 27, "stem": "摸着石头过河，是富有中国特色、符合中国国情的改革方法。", "answer": true, "explain": "表述正确。", "chap": "第五章"}, {"id": 28, "stem": "正确处理改革发展稳定关系：改革是动力，发展是关键，稳定是前提，把改善人民生活作为结合点。", "answer": true, "explain": "表述正确。", "chap": "第五章"}, {"id": 29, "stem": "贯彻新发展理念是新时代我国发展壮大的必由之路。", "answer": true, "explain": "表述正确，是最重要最主要的重大理论。", "chap": "第六章"}, {"id": 30, "stem": "高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任务。", "answer": true, "explain": "表述正确。", "chap": "第六章"}, {"id": 31, "stem": "公有制主体地位不能动摇，国有经济主导作用不能动摇。", "answer": true, "explain": "表述正确。", "chap": "第六章"}, {"id": 32, "stem": "民营经济是非公有制经济的主要经济组织形式，是推进中国式现代化的生力军。", "answer": true, "explain": "表述正确。要促进民营经济做大做优做强。", "chap": "第六章"}, {"id": 33, "stem": "构建高水平社会主义市场经济体制，关键是要处理好政府和市场的关系。", "answer": true, "explain": "表述正确。", "chap": "第六章"}, {"id": 34, "stem": "构建新发展格局最本质的特征是实现高水平的对外开放。", "answer": false, "explain": "错。最本质的特征是实现高水平的自立自强。", "chap": "第六章"}, {"id": 35, "stem": "农业强国是社会主义现代化强国的根基。", "answer": true, "explain": "表述正确。", "chap": "第六章"}, {"id": 36, "stem": "新质生产力的核心标志是全要素生产率大幅提升，特点是创新，关键在质优，本质是先进生产力。", "answer": true, "explain": "表述正确。", "chap": "第六章"}, {"id": 37, "stem": "教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。", "answer": true, "explain": "表述正确。", "chap": "第七章"}, {"id": 38, "stem": "科技是第一生产力，人才是第一资源，创新是第一动力。", "answer": true, "explain": "表述正确（对应科教兴国、人才强国、创新驱动）。", "chap": "第七章"}, {"id": 39, "stem": "基础研究是科技创新的源头；自主创新是攀登世界科技高峰的必由之路。", "answer": true, "explain": "表述正确。", "chap": "第七章"}, {"id": 40, "stem": "人民满意是发展教育的根本尺度。", "answer": true, "explain": "表述正确。", "chap": "第七章"}, {"id": 41, "stem": "立德树人是教育的根本任务。", "answer": true, "explain": "对。培养什么人、怎样培养人、为谁培养人是教育的根本问题。", "chap": "第七章"}, {"id": 42, "stem": "人民民主是社会主义的生命。", "answer": true, "explain": "表述正确。", "chap": "第八章"}, {"id": 43, "stem": "全过程人民民主是全链条、全方位、全覆盖的民主，是最广泛、最真实、最管用的民主。", "answer": true, "explain": "表述正确。", "chap": "第八章"}, {"id": 44, "stem": "协商民主是实践全过程人民民主的重要形式，是中国社会主义民主政治中独特的、独有的、独到的民主形式。", "answer": true, "explain": "表述正确。", "chap": "第八章"}, {"id": 45, "stem": "人民代表大会制度是实现全过程人民民主的重要制度载体。", "answer": true, "explain": "表述正确。基层民主是重要体现。", "chap": "第八章"}, {"id": 46, "stem": "统一战线工作的本质要求是求同存异。", "answer": false, "explain": "错。统战工作的本质要求是大团结大联合；关键是坚持求同存异，找到最大公约数、画出最大同心圆。", "chap": "第八章"}, {"id": 47, "stem": "民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。", "answer": true, "explain": "表述正确。", "chap": "第八章"}, {"id": 48, "stem": "党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。", "answer": true, "explain": "表述正确。", "chap": "第九章"}, {"id": 49, "stem": "平等是社会主义法律的基本属性。", "answer": true, "explain": "表述正确。", "chap": "第九章"}, {"id": 50, "stem": "全面推进依法治国的总抓手是建设社会主义法治国家。", "answer": false, "explain": "错。总抓手是建设中国特色社会主义法治体系（注意是“治”不是“制”）。", "chap": "第九章"}, {"id": 51, "stem": "坚持依宪治国、依宪执政，全面贯彻实施宪法是首要任务。", "answer": true, "explain": "表述正确。", "chap": "第九章"}, {"id": 52, "stem": "法治政府建设是重点任务和主体工程，法治社会是基础，法治国家是目标。", "answer": true, "explain": "表述正确。", "chap": "第九章"}, {"id": 53, "stem": "推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义文化自信。", "answer": true, "explain": "表述正确。", "chap": "第十章"}, {"id": 54, "stem": "创新创造是文化的生命所在，是文化的本质特征。", "answer": true, "explain": "表述正确。", "chap": "第十章"}, {"id": 55, "stem": "马克思主义为指导，是当代中国哲学社会科学区别于其他哲学社会科学的根本标志。", "answer": true, "explain": "表述正确。", "chap": "第十章"}, {"id": 56, "stem": "中华优秀传统文化是中华民族的根和魂，是我们在世界文化激荡中站稳脚跟的根基。", "answer": true, "explain": "表述正确。", "chap": "第十章"}, {"id": 57, "stem": "互联网是意识形态工作的主阵地、主战场、最前沿。", "answer": true, "explain": "表述正确。", "chap": "第十章"}, {"id": 58, "stem": "解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的重中之重。", "answer": true, "explain": "表述正确。", "chap": "第十一章"}, {"id": 59, "stem": "就业是最基本的民生，是最大的民生工程、民心工程、根基工程。", "answer": true, "explain": "表述正确。", "chap": "第十一章"}, {"id": 60, "stem": "新时代加强和创新社会治理，要求坚持系统治理、依法治理、综合治理、源头治理。", "answer": true, "explain": "表述正确。", "chap": "第十一章"}, {"id": 61, "stem": "基层治理是国家治理的基石，要坚持共建共治共享的社会治理理念。", "answer": true, "explain": "表述正确。", "chap": "第十一章"}, {"id": 62, "stem": "生态环境问题归根到底是经济发展方式和生活方式问题。", "answer": true, "explain": "表述正确。", "chap": "第十二章"}, {"id": 63, "stem": "良好的生态环境是最公平的公共产品，是最普惠的民生福祉。", "answer": true, "explain": "表述正确。", "chap": "第十二章"}, {"id": 64, "stem": "绿色低碳发展是解决生态环境问题的治本之策。", "answer": true, "explain": "表述正确。", "chap": "第十二章"}, {"id": 65, "stem": "三条红线指生态保护红线、环境质量底线、资源利用上线。", "answer": true, "explain": "表述正确。", "chap": "第十二章"}, {"id": 66, "stem": "国家安全是民族复兴的根基，社会稳定是国家强盛的前提。", "answer": true, "explain": "表述正确。", "chap": "第十三章"}, {"id": 67, "stem": "总体国家安全观以政治安全为宗旨，以人民安全为根本。", "answer": false, "explain": "错，写反了。以人民安全为宗旨，以政治安全为根本，以经济安全为基础。", "chap": "第十三章"}, {"id": 68, "stem": "总体国家安全观的关键是“总体”。", "answer": true, "explain": "表述正确。", "chap": "第十三章"}, {"id": 69, "stem": "发展解决的是动力问题，安全解决的是保障问题。", "answer": true, "explain": "表述正确。", "chap": "第十三章"}, {"id": 70, "stem": "总体国家安全观中，人民安全居于中心地位。", "answer": true, "explain": "表述正确。政治安全是根本保证，国家利益至上是要求和原则。", "chap": "第十三章"}, {"id": 71, "stem": "维护重点领域国家安全是主阵地、主战场。", "answer": true, "explain": "表述正确。", "chap": "第十三章"}, {"id": 72, "stem": "坚持党对人民军队的绝对领导，是建军之本、强军之魂。", "answer": true, "explain": "表述正确，是马克思主义建党建军的基本原则。", "chap": "第十四章"}, {"id": 73, "stem": "政治建军是人民军队的立军之本。", "answer": true, "explain": "表述正确。", "chap": "第十四章"}, {"id": 74, "stem": "军委主席负责制是坚持党对人民军队绝对领导的根本制度和根本实现形式。", "answer": true, "explain": "表述正确，处于最高层次、居于统领地位。", "chap": "第十四章"}, {"id": 75, "stem": "听党指挥是核心，能打胜仗是灵魂。", "answer": false, "explain": "错，写反了。听党指挥是灵魂，能打胜仗是核心，作风优良是保证。", "chap": "第十四章"}, {"id": 76, "stem": "“一国两制”最早是针对香港问题提出来的。", "answer": false, "explain": "错。“一国两制”最早是针对台湾问题提出的，首先运用于解决香港、澳门问题。", "chap": "第十五章"}, {"id": 77, "stem": "“一国两制”方针的最高原则和根本宗旨都涉及维护国家主权、安全、发展利益。", "answer": true, "explain": "表述正确。", "chap": "第十五章"}, {"id": 78, "stem": "坚持在中华民族伟大复兴进程中推进祖国统一，这是统一的历史方位。", "answer": true, "explain": "表述正确。", "chap": "第十五章"}, {"id": 79, "stem": "坚持决不承诺放弃使用武力，这是统一的战略支撑。", "answer": true, "explain": "表述正确。粉碎台独分裂图谋是必然要求。", "chap": "第十五章"}, {"id": 80, "stem": "“一国”之内的“两制”是等量齐观、比肩并列的。", "answer": false, "explain": "错。“两制”并非等量齐观、比肩并列，国家主体必须实行社会主义制度，“两制”从属并统一于“一国”。", "chap": "第十五章"}, {"id": 81, "stem": "推动构建人类命运共同体是新时代对外工作的总目标。", "answer": true, "explain": "表述正确。", "chap": "第十六章"}, {"id": 82, "stem": "和平、发展、公平、正义、民主、自由，是全人类的共同价值。", "answer": true, "explain": "表述正确。", "chap": "第十六章"}, {"id": 83, "stem": "我国周边外交方针是亲诚惠容、与邻为善、以邻为伴。", "answer": true, "explain": "表述正确。", "chap": "第十六章"}, {"id": 84, "stem": "全面从严治党是新时代党的建设的鲜明主题。", "answer": true, "explain": "表述正确。", "chap": "第十七章"}, {"id": 85, "stem": "党要管党、从严治党，是党的建设的一贯要求和根本方针。", "answer": true, "explain": "表述正确。", "chap": "第十七章"}, {"id": 86, "stem": "勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格。", "answer": true, "explain": "表述正确。", "chap": "第十七章"}, {"id": 87, "stem": "党的政治建设是党的根本性建设，其首要任务是加强思想教育和理论武装。", "answer": false, "explain": "错。党的政治建设的首要任务是保证全党服从中央、维护党中央权威和集中统一领导；党内政治生活的首要任务才是加强思想教育和理论武装。", "chap": "第十七章"}, {"id": 88, "stem": "腐败是党长期执政面临的最大威胁，反腐败是最彻底的自我革命。", "answer": true, "explain": "表述正确。", "chap": "第十七章"}, {"id": 89, "stem": "党的自我革命是跳出历史周期率的第二个答案。", "answer": true, "explain": "表述正确（第一个答案是人民监督）。", "chap": "第十七章"}], "essays": [{"id": 1, "chapter": "导论", "q": "中国特色社会主义进入新时代的意义", "points": ["党始终走在时代前列，始终成为全国人民的主心骨，始终成为坚强领导核心。", "中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定，焕发出更为强烈的历史自觉和主动精神。", "改革开放和社会主义现代化建设深入推进，实现中华民族伟大复兴进入了不可逆转的历史进程。", "科学社会主义在21世纪的中国焕发出新的蓬勃生机，中国式现代化为人类实现现代化提供了新的选择。"]}, {"id": 2, "chapter": "第二章", "q": "如何奋力实现中国梦？", "points": ["必须走中国道路，这就是中国特色社会主义道路。", "必须弘扬中国精神，这就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神。", "必须凝聚中国力量，这就是全国各族人民大团结的力量。"]}, {"id": 3, "chapter": "第二章", "q": "中国式现代化是中国共产党领导人民长期探索和实践的重大成果", "points": ["新民主主义革命时期，取得新民主主义革命的胜利，为实现现代化创造了根本社会条件。", "社会主义革命和建设时期，为现代化建设奠定了根本政治前提和制度基础。", "改革开放和社会主义现代化建设新时期，为中国式现代化提供了充满新的活力的体制保证和快速发展的物质条件。", "进入新时代，为中国式现代化提供了更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量。"]}, {"id": 4, "chapter": "第二章", "q": "为什么说中国式现代化是中国共产党领导的社会主义现代化（是对中国式现代化的定性，管总、管根本）", "points": ["党的领导决定中国式现代化的根本性质（是社会主义现代化）。", "党的领导确保中国式现代化锚定奋斗目标行稳致远（一代一代地接力推进）。", "党的领导激发建设中国式现代化的强劲动力（改革开放）。", "党的领导凝聚建设中国式现代化的磅礴力量（汇集全体人民的智慧和力量）。"]}, {"id": 5, "chapter": "第五章", "q": "坚持全面深化改革开放的正确方向", "points": ["必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度。", "必须坚持以人民为中心，促进社会公平正义、增进人民福祉。", "必须有利于进一步解放思想、进一步解放和发展生产力、进一步解放和增强社会活力。"]}, {"id": 6, "chapter": "第五章", "q": "坚定不移扩大高水平对外开放", "points": ["开放也是改革。以开放促改革、促发展是我国发展不断取得新成就的宝贵经验。", "新时代中国的对外开放是全方位、全领域的。高水平对外开放的决心不会变，同世界分享发展机遇的决心不会变。", "中国的发展离不开世界，世界的繁荣也需要中国。"]}, {"id": 7, "chapter": "第六章", "q": "高质量发展关系我国社会主义现代化建设全局，具有重大战略意义", "points": ["高质量发展为全面建设社会主义现代化国家提供更为坚实的物质基础。", "高质量发展是不断满足人民对美好生活需要的重要保证。", "高质量发展是维护国家长治久安的必然要求。"]}, {"id": 8, "chapter": "第七章", "q": "科技强则国家强（为什么必须实现高水平科技自立自强）", "points": ["科技是国之利器。实现高水平科技自立自强是国家强盛和民族复兴的战略基石。", "是应对风险挑战和维护国家利益的必然选择。科技自立自强是国家强盛之基、安全之要。", "是构建新发展格局、推动高质量发展、满足人民美好生活需要的内在要求。"]}, {"id": 9, "chapter": "第八章", "q": "怎样坚定不移走中国特色社会主义政治发展道路", "points": ["必须坚持党的领导、人民当家作主、依法治国有机统一。党的领导是根本保证，人民当家作主是本质特征，依法治国是基本方式，三者统一于伟大实践。最根本的是坚持党的领导。", "必须积极稳妥推进政治体制改革。", "必须始终保持政治定力。"]}, {"id": 10, "chapter": "第九章", "q": "全面依法治国是国家治理的一场深刻革命", "points": ["法律是治国之重器，法治是国家治理体系和治理能力的重要依托。全面依法治国关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。", "全面依法治国是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化的重要方面，是坚持和发展中国特色社会主义的本质要求和重要保障。"]}, {"id": 11, "chapter": "第十章", "q": "文化繁荣兴盛是实现中华民族伟大复兴的必然要求", "points": ["是实现中华民族伟大复兴的精神支撑。", "是建设社会主义现代化强国的应有之义（提供思想保证、舆论支持、精神动力和文化条件）。", "是满足人民日益增长的美好生活需要的内在要求。", "是在世界文化激荡中站稳脚跟的前提基础。"]}, {"id": 12, "chapter": "第十一章", "q": "民生是人民幸福之基", "points": ["民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。", "增进民生福祉是坚持立党为公、执政为民的本质要求。", "增进民生福祉是社会主义生产的根本目的。", "增进民生福祉是全面建设社会主义现代化国家的应有之义。必须把实现人民对美好生活的向往作为现代化建设的出发点和落脚点。"]}], "materials": [{"id": 101, "chapter": "导论/第二章", "q": "材料分析题1：(1)如何理解\"中国特色的关键就在于'两个结合'\"？(2)为什么说中国式现代化是中国共产党领导的社会主义现代化，\"这是对中国式现代化定性的话，是管总、管根本的\"？", "points": ["(1)\"两个结合\"是开辟和发展中国特色社会主义的必由之路；中国特色社会主义最鲜明的特色来源于\"两个结合\"，写出了科学社会主义\"新版本\"；中国式现代化理论是\"两个 var store=(function(){
  try{var k='__t__';localStorage.setItem(k,'1');localStorage.removeItem(k);
    return {get:function(k,d){var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}};
  }catch(e){var m={};return {get:function(k,d){return k in m?m[k]:d},set:function(k,v){m[k]=v}};}
})();

var REC=store.get('xjp_rec',{});      // id -> {ok:bool, type}
var FLAG=store.get('xjp_flag',{});    // wrong ids set

function saveRec(){store.set('xjp_rec',REC)}
function mark(id,ok,type){REC[id]={ok:ok,type:type};saveRec()}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var pracChap='导论', pracIdx=0, pracList=[];
function buildPracChips(){
  var c=document.getElementById('prac-chips');c.innerHTML='';
  var all=document.createElement('span');all.className='chip'+(pracChap==='全部'?' on':'');all.textContent='全部';
  all.onclick=function(){pracChap='全部';pracIdx=0;loadPrac()};c.appendChild(all);
  CHAPS.forEach(function(ch){
    var n=DATA.mcq.filter(q=>q.chap===ch).length;if(!n)return;
    var s=document.createElement('span');s.className='chip'+(pracChap===ch?' on':'');s.textContent=ch+'('+n+')';
    s.onclick=function(){pracChap=ch;pracIdx=0;loadPrac()};c.appendChild(s);
  });
}
function loadPrac(){
  buildPracChips();
  var list=DATA.mcq.filter(q=>pracChap==='全部'||q.chap===pracChap);
  if(document.getElementById('prac-wrongonly').checked) list=list.filter(q=>REC[q.id]&&!REC[q.id].ok);
  if(document.getElementById('prac-shuffle').checked) list=shuffle(list);
  pracList=list;if(pracIdx>=list.length)pracIdx=0;
  renderPrac();
}
function renderPrac(){
  var area=document.getElementById('prac-area');
  document.getElementById('prac-count').textContent=pracList.length?'共 '+pracList.length+' 题':'';
  if(!pracList.length){area.innerHTML='<div class="card empty">没有题目。<br>'+(document.getElementById('prac-wrongonly').checked?'这一章还没有做错的题 👍':'')+'</div>';return}
  var q=pracList[pracIdx];
  area.innerHTML=qCardHTML(q,pracIdx,pracList.length)+
   '<div class="navbtns"><button class="btn ghost" id="pp">上一题</button><button class="btn" id="pn">下一题</button></div>';
  wireQCard(q,function(){/*after answer*/});
  document.getElementById('pp').onclick=function(){pracIdx=(pracIdx-1+pracList.length)%pracList.length;renderPrac()};
  document.getElementById('pn').onclick=function(){pracIdx=(pracIdx+1)%pracList.length;renderPrac()};
}
function qCardHTML(q,idx,total){
  var tag=q.type==='multi'?'<span class="pill t2">多选</span>':'<span class="pill">单选</span>';
  var opts=Object.keys(q.options).map(function(k){
    return '<div class="opt" data-k="'+k+'"><div class="key">'+k+'</div><div class="txt">'+esc(q.options[k])+'</div></div>';
  }).join('');
  var hint=q.type==='multi'?'<span class="tag-multi"> · 可多选，选完点"提交"</span>':'';
  return '<div class="card" data-qid="'+q.id+'" data-ans="'+q.answer+'" data-type="'+q.type+'">'+
    '<div class="qnum">'+(idx+1)+' / '+total+' · '+q.chap+' '+tag+hint+'</div>'+
    '<div class="qstem">'+esc(q.stem)+'</div>'+opts+
    (q.type==='multi'?'<button class="btn sm" id="submitm" style="margin-top:4px">提交</button>':'')+
    '<div class="feedback" id="fb"></div></div>';
}
function wireQCard(q,cb){
  var card=document.querySelector('[data-qid="'+q.id+'"]');
  var answered=false;var chosen=[];
  var opts=card.querySelectorAll('.opt');
  var fb=card.querySelector('#fb');
  function reveal(){
    answered=true;var correct=q.answer.split('');
    opts.forEach(function(o){
      o.classList.add('disabled');var k=o.dataset.k;
      if(correct.indexOf(k)>=0)o.classList.add('ok');
      else if(chosen.indexOf(k)>=0)o.classList.add('bad');
      o.classList.remove('sel');
    });
    var ok=chosen.slice().sort().join('')===correct.slice().sort().join('');
    fb.className='feedback show '+(ok?'right':'wrong');
    fb.innerHTML=(ok?'✓ 答对了':'✗ 答错了')+' &nbsp; 正确答案：<b>'+q.answer+'</b>';
    mark(q.id,ok,'mcq');if(!ok)FLAG[q.id]=1;else delete FLAG[q.id];store.set('xjp_flag',FLAG);
    if(cb)cb(ok);
  }
  opts.forEach(function(o){
    o.onclick=function(){
      if(answered)return;var k=o.dataset.k;
      if(q.type==='single'){chosen=[k];reveal();}
      else{var i=chosen.indexOf(k);if(i>=0){chosen.splice(i,1);o.classList.remove('sel')}else{chosen.push(k);o.classList.add('sel')}}
    };
  });
  if(q.type==='multi'){var sb=card.querySelector('#submitm');sb.onclick=function(){if(answered)return;if(!chosen.length){return}reveal();sb.style.display='none'}}
}
document.getElementById('prac-wrongonly').onchange=function(){pracIdx=0;loadPrac()};
document.getElementById('prac-shuffle').onchange=function(){pracIdx=0;loadPrac()};
document.getElementById('prac-reset').onclick=function(){
  if(!confirm('清除本章（'+pracChap+'）的作答记录？'))return;
  DATA.mcq.filter(q=>pracChap==='全部'||q.chap===pracChap).forEach(function(q){delete REC[q.id];delete FLAG[q.id]});
  saveRec();store.set('xjp_flag',FLAG);pracIdx=0;loadPrac();
};

// ================= JUDGE =================
var judgeChap='导论',judgeIdx=0,judgeList=[];
function buildJudgeChips(){
  var c=document.getElementById('judge-chips');c.innerHTML='';
  var all=document.createElement('span');all.className='chip'+(judgeChap==='全部'?' on':'');all.textContent='全部';
  all.onclick=function(){judgeChap='全部';judgeIdx=0;loadJudge()};c.appendChild(all);
  CHAPS.forEach(function(ch){
    var n=DATA.judge.filter(q=>q.chap===ch).length;if(!n)return;
    var s=document.createElement('span');s.className='chip'+(judgeChap===ch?' on':'');s.textContent=ch+'('+n+')';
    s.onclick=function(){judgeChap=ch;judgeIdx=0;loadJudge()};c.appendChild(s);
  });
}
function loadJudge(){buildJudgeChips();judgeList=DATA.judge.filter(q=>judgeChap==='全部'||q.chap===judgeChap);if(judgeIdx>=judgeList.length)judgeIdx=0;renderJudge()}
function renderJudge(){
  var area=document.getElementById('judge-area');
  document.getElementById('judge-count').textContent=judgeList.length?'共 '+judgeList.length+' 题':'';
  if(!judgeList.length){area.innerHTML='<div class="card empty">本章暂无判断题</div>';return}
  var q=judgeList[judgeIdx];
  area.innerHTML='<div class="card">'+
    '<div class="qnum">'+(judgeIdx+1)+' / '+judgeList.length+' · '+q.chap+' <span class="pill t3">判断</span></div>'+
    '<div class="qstem">'+esc(q.stem)+'</div>'+
    '<div class="row"><button class="btn ghost" id="jt" style="flex:1">✓ 正确</button><button class="btn ghost" id="jf" style="flex:1">✗ 错误</button></div>'+
    '<div class="feedback" id="jfb"></div></div>'+
    '<div class="navbtns"><button class="btn ghost" id="jp">上一题</button><button class="btn" id="jn">下一题</button></div>';
  var done=false;
  function ans(v){
    if(done)return;done=true;var ok=(v===q.answer);
    var fb=document.getElementById('jfb');fb.className='feedback show '+(ok?'right':'wrong');
    fb.innerHTML='<b>'+(q.answer?'正确':'错误')+'</b>。'+esc(q.explain||'');
    document.getElementById('jt').disabled=true;document.getElementById('jf').disabled=true;
    mark('J'+q.id,ok,'judge');if(!ok)FLAG['J'+q.id]=1;store.set('xjp_flag',FLAG);
  }
  document.getElementById('jt').onclick=function(){ans(true)};
  document.getElementById('jf').onclick=function(){ans(false)};
  document.getElementById('jp').onclick=function(){judgeIdx=(judgeIdx-1+judgeList.length)%judgeList.length;renderJudge()};
  document.getElementById('jn').onclick=function(){judgeIdx=(judgeIdx+1)%judgeList.length;renderJudge()};
}

// ================= ESSAY =================
var essayType='essay',essayIdx=0,essayList=[];
function loadEssay(){
  var kw=document.getElementById('essay-search').value.trim();
  var src=essayType==='essay'?DATA.essay.essays:DATA.essay.materials;
  essayList=src.filter(function(e){return !kw||(e.q+JSON.stringify(e.points)).indexOf(kw)>=0});
  if(essayIdx>=essayList.length)essayIdx=0;renderEssay();
}
function renderEssay(){
  var area=document.getElementById('essay-area');
  document.getElementById('essay-pos').textContent=essayList.length?(essayIdx+1)+' / '+essayList.length:'无结果';
  if(!essayList.length){area.innerHTML='<div class="card empty">没有匹配的题目</div>';return}
  var e=essayList[essayIdx];
  var pts=e.points.map(p=>'<li>'+esc(p)+'</li>').join('');
  area.innerHTML='<div class="flash" id="flash"><div class="flash-inner">'+
    '<div class="flash-face"><div class="qnum">'+esc(e.chapter)+'</div><h3>'+esc(e.q)+'</h3><span class="tap">点击翻面看答题要点 →</span></div>'+
    '<div class="flash-face flash-back"><div class="qnum">答题要点</div><ol>'+pts+'</ol><span class="tap">← 点击返回</span></div>'+
    '</div></div>';
  document.getElementById('flash').onclick=function(){this.classList.toggle('flip')};
}
document.querySelectorAll('[data-et]').forEach(function(b){
  b.onclick=function(){essayType=b.dataset.et;essayIdx=0;
    document.querySelectorAll('[data-et]').forEach(x=>x.classList.add('ghost'));
    loadEssay();};
});
document.getElementById('essay-search').oninput=function(){essayIdx=0;loadEssay()};
document.getElementById('essay-prev').onclick=function(){if(!essayList.length)return;essayIdx=(essayIdx-1+essayList.length)%essayList.length;renderEssay()};
document.getElementById('essay-next').onclick=function(){if(!essayList.length)return;essayIdx=(essayIdx+1)%essayList.length;renderEssay()};

// ================= EXAM =================
var examQs=[],examAns={},examDone=false;
document.getElementById('ex-start').onclick=function(){
  var ns=+document.getElementById('ex-single').value,nm=+document.getElementById('ex-multi').value,nj=+document.getElementById('ex-judge').value;
  var singles=shuffle(DATA.mcq.filter(q=>q.type==='single')).slice(0,ns);
  var multis=shuffle(DATA.mcq.filter(q=>q.type==='multi')).slice(0,nm);
  var judges=shuffle(DATA.judge).slice(0,nj).map(function(j){return {id:'J'+j.id,type:'judge',stem:j.stem,answer:j.answer,explain:j.explain,chap:j.chap}});
  examQs=shuffle(singles.concat(multis)).concat([]);examQs=singles.concat(multis,judges);
  if(!examQs.length){alert('请至少选择一类题目');return}
  examAns={};examDone=false;
  document.getElementById('exam-setup').style.display='none';
  renderExam();
};
function renderExam(){
  var area=document.getElementById('exam-area');var html='';
  examQs.forEach(function(q,i){
    if(q.type==='judge'){
      html+='<div class="card" data-ex="'+i+'"><div class="qnum">'+(i+1)+'. 判断 · '+q.chap+'</div><div class="qstem">'+esc(q.stem)+'</div>'+
        '<div class="row"><button class="btn ghost ex-j" data-v="1" style="flex:1">✓ 正确</button><button class="btn ghost ex-j" data-v="0" style="flex:1">✗ 错误</button></div>'+
        '<div class="feedback" id="exfb'+i+'"></div></div>';
    }else{
      var tag=q.type==='multi'?'多选':'单选';
      var opts=Object.keys(q.options).map(k=>'<div class="opt ex-opt" data-k="'+k+'"><div class="key">'+k+'</div><div class="txt">'+esc(q.options[k])+'</div></div>').join('');
      html+='<div class="card" data-ex="'+i+'" data-type="'+q.type+'"><div class="qnum">'+(i+1)+'. '+tag+' · '+q.chap+'</div><div class="qstem">'+esc(q.stem)+'</div>'+opts+'<div class="feedback" id="exfb'+i+'"></div></div>';
    }
  });
  html+='<div class="navbtns"><button class="btn" id="ex-submit">交卷看分数</button><button class="btn gray" id="ex-again">重新设置</button></div>';
  area.innerHTML=html;
  examQs.forEach(function(q,i){
    var card=area.querySelector('[data-ex="'+i+'"]');
    if(q.type==='judge'){
      card.querySelectorAll('.ex-j').forEach(function(b){b.onclick=function(){if(examDone)return;examAns[i]=(b.dataset.v==='1');card.querySelectorAll('.ex-j').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.style.background=b.classList.contains('on')?'var(--gold)':''}});
    }else{
      card.querySelectorAll('.ex-opt').forEach(function(o){o.onclick=function(){
        if(examDone)return;var k=o.dataset.k;examAns[i]=examAns[i]||[];
        if(q.type==='single'){examAns[i]=[k];card.querySelectorAll('.ex-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel')}
        else{var idx=examAns[i].indexOf(k);if(idx>=0){examAns[i].splice(idx,1);o.classList.remove('sel')}else{examAns[i].push(k);o.classList.add('sel')}}
      }});
    }
  });
  document.getElementById('ex-submit').onclick=gradeExam;
  document.getElementById('ex-again').onclick=function(){examQs=[];document.getElementById('exam-area').innerHTML='';document.getElementById('exam-setup').style.display='block'};
}
function gradeExam(){
  if(examDone)return;examDone=true;var right=0;
  examQs.forEach(function(q,i){
    var card=document.querySelector('[data-ex="'+i+'"]');var fb=document.getElementById('exfb'+i);var ok;
    if(q.type==='judge'){
      ok=(examAns[i]===q.answer);
      card.querySelectorAll('.ex-j').forEach(x=>x.disabled=true);
      fb.className='feedback show '+(ok?'right':'wrong');fb.innerHTML='<b>'+(q.answer?'正确':'错误')+'</b>。'+esc(q.explain||'');
    }else{
      var correct=q.answer.split('').sort().join('');var ch=(examAns[i]||[]).slice().sort().join('');ok=(ch===correct);
      card.querySelectorAll('.ex-opt').forEach(function(o){var k=o.dataset.k;o.classList.add('disabled');if(q.answer.indexOf(k)>=0)o.classList.add('ok');else if((examAns[i]||[]).indexOf(k)>=0)o.classList.add('bad')});
      fb.className='feedback show '+(ok?'right':'wrong');fb.innerHTML=(ok?'✓ 正确':'✗ 错误')+' 答案：<b>'+q.answer+'</b>';
    }
    if(ok)right++;mark(q.id,ok,q.type==='judge'?'judge':'mcq');if(!ok)FLAG[q.id]=1;
  });
  store.set('xjp_flag',FLAG);
  var pct=Math.round(right/examQs.length*100);
  var res=document.createElement('div');res.className='card result-big';
  res.innerHTML='<div class="big">'+pct+' 分</div><div class="muted">答对 '+right+' / '+examQs.length+' 题</div>';
  document.getElementById('exam-area').insertBefore(res,document.getElementById('exam-area').firstChild);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ================= STAT =================
function renderStat(){
  var totalMcq=DATA.mcq.length,totalJ=DATA.judge.length,total=totalMcq+totalJ;
  var done=0,right=0,wrong=0;
  Object.keys(REC).forEach(function(k){done++;if(REC[k].ok)right++;else wrong++});
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-right').textContent=right;
  document.getElementById('st-wrong').textContent=wrong;
  document.getElementById('st-rate').textContent=(done?Math.round(right/done*100):0)+'%';
  document.getElementById('st-bar').style.width=(done/total*100)+'%';
  document.getElementById('st-total').textContent='题库共 '+total+' 道客观题（'+totalMcq+' 选择 + '+totalJ+' 判断），已作答 '+done+' 题。';
  // per chapter
  var box=document.getElementById('st-chap');box.innerHTML='';
  CHAPS.forEach(function(ch){
    var ids=DATA.mcq.filter(q=>q.chap===ch).map(q=>q.id).concat(DATA.judge.filter(q=>q.chap===ch).map(q=>'J'+q.id));
    var d=0,r=0;ids.forEach(function(id){if(REC[id]){d++;if(REC[id].ok)r++}});
    if(!ids.length)return;
    var pct=d?Math.round(r/d*100):0;
    var row=document.createElement('div');row.style.marginBottom='9px';
    row.innerHTML='<div style="display:flex;justify-content:space-between;font-size:14px"><span>'+ch+'</span><span class="muted">'+r+'/'+d+'（共'+ids.length+'） '+(d?pct+'%':'-')+'</span></div><div class="progress" style="margin:5px 0 0"><i style="width:'+(d?pct:0)+'%"></i></div>';
    box.appendChild(row);
  });
}
document.getElementById('st-clear').onclick=function(){if(!confirm('清空所有作答记录和错题？此操作不可恢复。'))return;REC={};FLAG={};saveRec();store.set('xjp_flag',FLAG);renderStat();};
document.getElementById('st-gowrong').onclick=function(){
  document.querySelector('.tab[data-p="practice"]').click();
  pracChap='全部';document.getElementById('prac-wrongonly').checked=true;pracIdx=0;loadPrac();
  window.scrollTo({top:0});
};

// init
loadPrac();loadJudge();loadEssay();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习思想期末冲刺</title>
<style>
:root{color-scheme:light;--red:#c1272d;--red2:#a51d22;--gold:#d4a843;--bg:#f4f1ea;--card:#fff;--ink:#23211c;--muted:#7a756a;--line:#e3ddd0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;display:grid;place-items:center;padding:24px}
main{width:min(720px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 1px 10px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:26px;color:var(--red2)}
p{margin:0 0 22px;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
a{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:12px;padding:18px 20px;font-weight:700;box-shadow:0 2px 10px rgba(193,39,45,.18)}
a span{display:block;margin-top:4px;color:#ffe9ad;font-size:14px;font-weight:600}
@media(max-width:560px){main{padding:22px}.links{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<main>
  <h1>习思想期末冲刺</h1>
  <p>请选择要打开的网站。</p>
  <div class="links">
    <a href="./quiz/">刷题网站<span>客观题练习与复习</span></a>
    <a href="./recite/">背诵网站<span>知识点背诵手册</span></a>
  </div>
</main>
</body>
</html>
